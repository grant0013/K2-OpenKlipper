events {
    worker_connections  1024;
}

worker_processes  1;

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen 4408 default_server;

        access_log off;  # logs live in RAM (/tmp); camera snapshot polling filled 222 MB overnight on 10-26
        error_log /var/log/nginx/fluidd-error.log;

        # disable this section on smaller hardware like a pi zero
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_proxied expired no-cache no-store private auth;
        gzip_comp_level 4;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

        # web_path from fluidd static files
        root /usr/share/fluidd;

        index index.html;
        server_name _;

        # disable max upload size checks
        client_max_body_size 0;

        # disable proxy request buffering
        proxy_request_buffering off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://apiserver/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://apiserver$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        location /webcam/ {
            proxy_pass http://mjpgstreamer1/;
        }

        location /webcam2/ {
            proxy_pass http://mjpgstreamer2/;
        }

        location /webcam3/ {
            proxy_pass http://mjpgstreamer3/;
        }

        location /webcam4/ {
            proxy_pass http://mjpgstreamer4/;
        }

        # Hark Tech: go2rtc camera proxy for Fluidd (added 2026-06-21)
        location /cam/ {
            proxy_pass http://127.0.0.1:1984/cam/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    # Isolated upstream Klipper control plane.  The stock/legacy Fluidd server
    # on 4408 now shares the open stack's Moonraker (7126).
    server {
        listen 4409;

        access_log off;  # same: logs live in RAM
        error_log /var/log/nginx/mainsail-mainline-error.log;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

        root /mnt/UDISK/mainsail-mainline;
        index index.html;
        server_name _;
        client_max_body_size 0;
        proxy_request_buffering off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://mainline_apiserver/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://mainline_apiserver$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        location /cam/ {
            proxy_pass http://127.0.0.1:1984/cam/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Creality's Fluidd on 4408 talks to the open stack's Moonraker too: the
    # stock Moonraker on 7125 is switched off by install.sh. uninstall.sh
    # restores Creality's original nginx.conf.
    upstream apiserver {
        ip_hash;
        server 127.0.0.1:7126;
    }

    upstream mainline_apiserver {
        ip_hash;
        server 127.0.0.1:7126;
    }

    upstream mjpgstreamer1 {
        ip_hash;
        server 127.0.0.1:8080;
    }

    upstream mjpgstreamer2 {
        ip_hash;
        server 127.0.0.1:8081;
    }

    upstream mjpgstreamer3 {
        ip_hash;
        server 127.0.0.1:8082;
    }

    upstream mjpgstreamer4 {
        ip_hash;
        server 127.0.0.1:8083;
    }

}
