# OrcaSlicer 2.4.x K2 Mainline profile notes
#
# Printer Settings > Machine G-code > Machine start G-code:
#
# START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] TOOL=[initial_no_support_extruder] TOWER_X={wipe_tower_x[0]} TOWER_Y={wipe_tower_y[0]} TOWER_W={if enable_prime_tower}[prime_tower_width]{else}0{endif}
#
# Printer Settings > Multimaterial > Change filament G-code:
#
# SET_GCODE_VARIABLE MACRO=_CFS_TC VARIABLE=next_purge VALUE={flush_length}
# G90
# G1 Z{max(z_after_toolchange, 0.6)} F600
#
# Why:
# - TOWER_X/TOWER_Y/TOWER_W let START_PRINT mesh the prime tower area as well
#   as the objects. The plain adaptive mesh stops at the objects, and a tower
#   printed on the stretched mesh edge came loose.
# - {flush_length} is the slicer's flush for this colour change in mm (flush
#   volumes matrix x flush multiplier). _CFS_TC purges exactly that much in
#   the chute for a change between two slots of the same material, like
#   Creality Print does. Keep "Purge in prime tower" off; the tower then only
#   takes the prime volume.
# - Orca runs Change filament G-code for the initial T0-T3 selection as well
#   as later toolchanges. Creality's template moves to X0 Y140 and then lowers
#   to z_after_toolchange, which is Z0 for the initial selection, so the next
#   travel scraped the bed. START_PRINT and the K2 T0-T3/CFS implementation
#   already own loading, purging and parking; this template makes no XY move
#   and clamps the initial travel to 0.6 mm.
