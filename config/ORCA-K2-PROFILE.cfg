# OrcaSlicer 2.4.x K2 Mainline profile notes
#
# Printer Settings > Machine G-code > Machine start G-code:
#
# START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] TOOL=[initial_no_support_extruder]
#
# Printer Settings > Multimaterial > Change filament G-code:
#
# G90
# G1 Z{max(z_after_toolchange, 0.6)} F600
#
# Why:
# Orca runs Change filament G-code for the initial T0-T3 selection as well as
# later toolchanges. Creality's template moves to X0 Y140 and then lowers to
# z_after_toolchange, which is Z0 for the initial selection. The following
# travel to the first object therefore occurs at Z0 and scrapes the bed.
#
# START_PRINT and the K2 T0-T3/CFS implementation already own loading, purging,
# and safe parking. This replacement makes no unnecessary XY move. It preserves
# the requested Z for later-layer changes and clamps the initial travel to a
# safe 0.6 mm.
