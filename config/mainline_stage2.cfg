# Creality K2 / F021 - upstream Klipper CoreXY configuration
# Stage 2: X/Y motion and homing were validated on 2026-07-07.
# Mainline X/Y/Z Home All and the open PRTouch contact-abort path were validated
# repeatedly on 2026-07-28. After a restart, Z has no trustworthy position, so
# Home All first uses the PA15 bottom reference and approaches the nozzle from
# a known coordinate. Re-homing within the same session can skip that phase.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
minimum_cruise_ratio: 0.0  # stock runs accel_to_decel = accel; mainline ignores ACCEL_TO_DECEL from Orca
square_corner_velocity: 10
max_z_velocity: 20  # stock K2
max_z_accel: 500  # stock K2

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 262
position_min: -12
position_max: 262
homing_speed: 100
homing_retract_dist: 10

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -3
position_min: -3
position_max: 296.5
homing_speed: 100
homing_retract_dist: 10

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 270
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 5

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
sense_resistor: 0.100

[thermistor k2_nozzle_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: k2_nozzle_thermistor
sensor_pin: nozzle_mcu:PA0
control: pid
# PID_CALIBRATE at 250C with the part fan at 40% (PETG print level), 2026-10-25.
pid_kp: 16.523
pid_ki: 1.360
pid_kd: 50.187
pressure_advance: 0.038
pressure_advance_smooth_time: 0.06
min_temp: -30
# Stock K2 value (Creality rates the hotend to 300 C); was 390 until 10-26
max_temp: 350

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[thermistor k2_bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 27586
temperature3: 100
resistance3: 6610

[heater_bed]
heater_pin: PC8
sensor_type: k2_bed_thermistor
sensor_pin: PC4
max_power: 0.5
control: pid
pid_kp: 18.578
pid_ki: 0.152
pid_kd: 298.489
min_temp: -30
max_temp: 115

[verify_heater heater_bed]
check_gain_time: 180
heating_gain: 1.0
hysteresis: 10

[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
shutdown_speed: 0

[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
heater: extruder
heater_temp: 50

[fan_generic auxiliary_fan]
pin: PB4
cycle_time: 0.010
shutdown_speed: 0

[multi_pin exhaust_fan_pins]
pins: PB1, PB3

[fan_generic exhaust_fan]
pin: multi_pin:exhaust_fan_pins
cycle_time: 0.010
shutdown_speed: 0

[temperature_sensor chamber_temperature]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[multi_pin chamber_led_pins]
pins: PB0, PA12

[output_pin chamber_led]
pin: multi_pin:chamber_led_pins
pwm: true
cycle_time: 0.010
value: 1
shutdown_value: 0

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: ^!nozzle_mcu:PA11
# Klipper pauses and parks first (our PAUSE macro), then this runs
runout_gcode:
    _RUNOUT_REFILL

# Runout auto-refill, like stock: if another CFS slot holds the same material
# and colour, CFS_RUNOUT_REFILL pushes the old tail through at the chute,
# loads and purges that slot and resumes. Otherwise (or if the refill fails)
# the print stays paused for you to load filament and RESUME. Set
# variable_enabled: 0 in printer-overrides.cfg to always just pause.
[gcode_macro _RUNOUT_REFILL]
variable_enabled: 1
gcode:
    {% set cfs = printer.k2_cfs %}
    {% set slots = printer.hark_cfs_slots.slots %}
    # The box deselects a slot that has run out, so fall back to the slot
    # that was feeding the print
    {% set old = cfs.active_slot or cfs.feed_slot or cfs.last_loaded_slot %}
    {% set state = printer.print_stats.state %}
    {% set ns = namespace(pick="") %}
    {% if old and old in slots %}
        {% set want_type = (slots[old].type or "")|upper %}
        {% set want_colour = (slots[old].color or "")|upper %}
        {% for s in ["A", "B", "C", "D"] %}
            {% if not ns.pick and s != old and s in slots and slots[s].loaded
                  and (slots[s].type or "")|upper == want_type and want_type
                  and (slots[s].color or "")|upper == want_colour
                  and (not cfs.slots_loaded or cfs.slots_loaded[loop.index0]) %}
                {% set ns.pick = s %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if state != "paused" %}
        RESPOND MSG="Filament runout detected (not printing)"
    {% elif printer["gcode_macro _RUNOUT_REFILL"].enabled|int == 1 and cfs.online and ns.pick %}
        RESPOND MSG="Slot {old} ran out: refilling from slot {ns.pick} (same material and colour)"
        CFS_RUNOUT_REFILL SLOT={ns.pick} CONFIRM=1
    {% elif not cfs.fitted %}
        RESPOND TYPE=error MSG="Filament ran out. Fit a new spool on the rear holder, run UNLOAD_FILAMENT then LOAD_FILAMENT, then RESUME."
    {% else %}
        RESPOND TYPE=error MSG="Filament ran out{(' in slot ' ~ old) if old else ''} and no other slot has the same filament. Load filament, then RESUME."
    {% endif %}

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 54.8  # SHAPER_CALIBRATE 10-25 (lis2dw_k2): X peak 53.9 Hz, Y peak 43.5 Hz
shaper_type_y: mzv
shaper_freq_y: 45.4

[prtouch_mainline]
z_offset: 0
speed: 0.75
lift_speed: 5
samples: 1
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.5
home_samples: 1
home_start_z: 5
home_samples_tolerance: 0.10
home_settle_time: 0.5
home_followup_guard: 0.5
# Multi-tap Z home (K2 Plus firmware method): keep tapping until the tightest
# home_samples taps among the last home_samples + home_allowed_noisy agree
# within home_samples_tolerance, up to home_max_touches taps (0 = same as
# home_samples). The K2 Plus ships 3 / 3 noisy / 10 touches / 0.010 mm. These
# defaults keep today's single tap; try PRTOUCH_HOME_Z SAMPLES=3
# ALLOWED_NOISY=3 MAX_TOUCHES=10 SAMPLES_TOLERANCE=0.01 first.
home_max_touches: 0
home_allowed_noisy: 0
# Standard PROBE / bed-mesh moves run only after Z home has established the
# contact plane. Settle XY vibration, reject triggers above that plane, and
# never search far enough below it to reproduce the v27 bed-flex incident.
probe_settle_time: 0.75
# Bed-mesh taps that trigger above this Z (the Z home contact plane is 0)
# are a blob or a false trigger, not the bed: re-probed probe_plane_retries
# times, then the mesh stops. Applies only while the Z frame is still the
# one PRTOUCH_HOME_Z set. Real K2 meshes stay well inside +-0.35 mm.
probe_arm_below_z: 0.45
probe_plane_check: True
probe_plane_retries: 1
probe_minimum_z: -0.60
# Multi-tap per probe point (PROBE, PROBE_ACCURACY, bed mesh), same rules as
# the Z home. 1 = today's single tap. Per command: TAP_SAMPLES=, TAP_TOLERANCE=,
# TAP_MAX_TOUCHES=, TAP_NOISY= (e.g. on BED_MESH_CALIBRATE).
probe_tap_samples: 1
probe_tap_tolerance: 0.10
probe_tap_max_touches: 0
probe_tap_allowed_noisy: 0
# One retry from the start Z after a clean no-trigger probe, for moves up to
# the max distance (a mesh tap is 1.6 mm, the Z home tap 5.6 mm). Off (0).
probe_no_trigger_retries: 0
probe_no_trigger_retry_max_distance: 2.0
# PRTOUCH_SCRUB (K2 Plus firmware method; used only by NOZZLE_CLEAR
# METHOD=detect and START_PRINT variable_scrub_method: 'detect'). The line is
# the strip the stock-style scrub uses. Taps 3x normal and 3x with the MCU
# hold thresholds x scrub_detect_hold_ratio at the line centre; a median
# difference above scrub_detect_deflection is a flexible tab. Defaults:
#scrub_x_start: 155
#scrub_x_end: 165
#scrub_y_min: 264.5
#scrub_y_max: 266.5
#scrub_detect_hold_ratio: 1.5
#scrub_detect_deflection: 0.035
#scrub_tab_depth: 0.15
#scrub_no_tab_depth: 0.05
#scrub_speed: 10
#scrub_max_passes: 3
#scrub_shorten_done: 0.01
#scrub_start_z: 5
#scrub_travel_speed: 100
#scrub_min_temp: 130
# Fail-closed arming: refuse a probe if an MCU acks start with an error or
# PC7 already reads contact after arming; warn if PC7 does not release.
pres_arm_checks: True
pres_release_timeout: 0.25
# Log the MCU's 64-sample pressure buffer when a probe never triggers.
probe_fail_dump: True
# The next four belong to the experimental host classifier. The active path
# lets the pressure MCU decide contact, so they have no effect on it.
probe_contact_threshold: 600
# Live v51 centre contact stayed at 607-1230 for nine consecutive windows.
# Print-time vibration produced only one- or two-window bursts. Three fresh
# 80ms windows therefore identify sustained nozzle load without a Z-plane gate
# and limit added physical press to about 0.19mm at the 0.8mm/s probe speed.
probe_contact_polls: 3
probe_max_window_p2p: 100000
# The stock cascade requires a 4000-count dynamic tap and missed a confirmed
# light contact at this speed. Use measured sustained load instead.
probe_contact_mode: amplitude
# Creality confirms spatially abnormal mesh points instead of averaging every
# location. Keep the fast single-tap path, then take two extra taps only for a
# point whose orthogonal-neighbour residual exceeds 0.08mm. The median of the
# original and two repeats rejects one bad read without flattening real edges.
mesh_guard_enabled: True
mesh_guard_residual: 0.08
mesh_guard_samples: 2
mesh_guard_max_points: 6
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
pres_cfg_regs: 60
prth_msg_show: true
host_probe_warmup_polls: 8
host_probe_period_ms: 80
max_probe_descent: 6
host_probe_failure_retract: 2
# Rear-left live mesh contact was sustained at 728-732 while settled idle
# noise remained below ~340. Two consecutive windows plus the Z-plane gate
# make 600 conservative without losing that lower-sensitivity corner.
host_probe_contact_threshold: 600
# Schmitt-style hold threshold = entry threshold * ratio. Contact must first
# cross 600, then remain above 450 for the configured sustained-contact count.
host_probe_contact_release_ratio: 0.75
host_probe_contact_polls: 2
enable_not_linear_comp: true
temp_non_linaer_a: -0.00000000
temp_non_linaer_b: 0.00000000
temp_non_linaer_c: 0.04500000
prth_max_chps: 8
prth_tri_zacc: 100
prth_min_fans: 0.6
need_steady_regional: 0.8
horizontal_move_z_quick: 1
slot_left_pos: 195
slot_mid_pos: 170

[bed_mesh]
speed: 150
mesh_min: 5, 5
mesh_max: 255, 255
probe_count: 7, 7
mesh_pps: 2, 2
fade_start: 5
fade_end: 50
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 1
adaptive_margin: 5
split_delta_z: 0.01
move_check_distance: 3

[idle_timeout]
# Heaters and motors off after 30 minutes idle, as a safety net when a macro
# stops partway (e.g. a failed calibration left the nozzle hot). Never while
# printing. A job paused for 30 minutes (runout, safety watch) loses only
# its hotend heat: the bed stays on so the part stays stuck, and homing is
# kept, so it can still be resumed after reheating.
timeout: 1800
gcode:
    {% set state = printer.print_stats.state %}
    {% if state == "paused" %}
        M104 S0
        RESPOND TYPE=error MSG="Paused for 30 minutes: hotend off (bed kept on). Reheat before RESUME"
    {% elif state != "printing" %}
        TURN_OFF_HEATERS
        M107
        M84
        RESPOND MSG="Idle for 30 minutes: heaters and motors off"
    {% endif %}

[virtual_sdcard]
path: /mnt/UDISK/printer_data_mainline/gcodes

[gcode_arcs]
# Stock K2 printer.cfg uses 0.012mm. 1.0mm cut curves into 1mm chords and
# stuttered at each joint. 0.1mm starved the move queue on an arc-heavy
# organic model (33k arcs; buffer 1.0 s -> 0, MCU 'Stepper too far in past',
# 10-25), so 0.5mm: five times fewer moves, still smooth curves.
resolution: 0.5

[pause_resume]

# Mainsail detects pause/resume support through explicit macros. Keep upstream
# Klipper's native semantics while exposing the standard named wrappers.
[gcode_macro PAUSE]
description: Pause the current print, nozzle lifted and parked off the part
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    # A hot nozzle left on the part oozes and scorches it. Lift 2 mm and park
    # behind the bed; RESUME restores the saved position.
    {% if printer.toolhead.homed_axes == "xyz" %}
        {% set z = [printer.toolhead.position.z + 2, printer.toolhead.axis_maximum.z]|min %}
        G90
        G1 Z{z} F600
        G1 X205 Y261 F12000
    {% endif %}

[gcode_macro RESUME]
description: Resume the current print
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE

[display_status]

[exclude_object]

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set fan_index = params.P|default(0)|int %}
    {% set requested = params.S|default(255)|float %}
    {% set speed = [[requested / 255.0, 0.0]|max, 1.0]|min %}
    {% if fan_index == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif fan_index == 1 %}
        # The slicer or you set the exhaust fan: automatic chamber control
        # leaves it alone for the rest of this print.
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=1
        SET_FAN_SPEED FAN=exhaust_fan SPEED={speed}
    {% else %}
        M106.1 S{requested}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% set fan_index = params.P|default(0)|int %}
    {% if fan_index == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
    {% elif fan_index == 1 %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=1
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        M107.1
    {% endif %}

[gcode_macro M141]
description: Set the chamber target for automatic exhaust-fan control (S0 = default)
gcode:
    {% set target = params.S|default(0)|float %}
    {% set default = printer["gcode_macro _CHAMBER_FAN"].default_target|float %}
    {% set use = target if target > 0 else default %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={use}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=slicer_set VALUE={1 if target > 0 else 0}
    RESPOND MSG="Chamber target {use|int}C: the exhaust fan vents above {(use + 2)|int}C while printing"

# Automatic chamber control, like stock's [temperature_fan chamber_fan]: while
# printing, the exhaust fan (PB1+PB3) runs when the chamber is 2C over the
# target and stops 2C under it (stock watermark, 35C). The slicer's M141 sets
# the target (S0 = default), e.g. a higher one for ABS keeps the heat in. An
# explicit M106 P1 / M107 P1 from the slicer or you wins for that print. The
# K2 has no chamber heater, so the fan only ever vents.
#
# Without a slicer M141, START_PRINT takes the target from the loaded slot's
# material (material_targets). end_vent runs the exhaust fan at full for that
# many seconds after a print (0 = off) to clear fumes and cool the chamber.
[gcode_macro _CHAMBER_FAN]
variable_default_target: 35
variable_material_targets: {'PLA': 35, 'TPU': 35, 'PETG': 40, 'ABS': 50, 'ASA': 50, 'PC': 50, 'PA': 50}
variable_end_vent: 0
variable_target: 35
variable_slicer_set: 0
variable_manual: 0
variable_on: 0
variable_vent: 0
gcode:

# End-of-print vent: exhaust fan at full for end_vent seconds
[gcode_macro _CHAMBER_VENT]
gcode:
    {% set seconds = printer["gcode_macro _CHAMBER_FAN"].end_vent|int %}
    {% if seconds > 0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=1
        UPDATE_DELAYED_GCODE ID=_CHAMBER_VENT_END DURATION={seconds}
        RESPOND MSG="Venting the chamber for {seconds} s"
    {% endif %}

[delayed_gcode _CHAMBER_VENT_END]
gcode:
    {% if printer["gcode_macro _CHAMBER_FAN"].vent|int %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=0
        {% if printer.print_stats.state not in ("printing", "paused") %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
    {% endif %}

[delayed_gcode _CHAMBER_FAN_LOOP]
gcode:
    {% set v = printer["gcode_macro _CHAMBER_FAN"] %}
    {% set state = printer.print_stats.state %}
    {% if v.vent|int %}
        # End-of-print vent running: leave the fan alone, check again later
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    {% elif state in ("printing", "paused") %}
        {% if v.manual|int == 0 %}
            {% set temp = printer["temperature_sensor chamber_temperature"].temperature|float %}
            {% if temp >= v.target|float + 2 and v.on|int == 0 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=1
                SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=1
            {% elif temp <= v.target|float - 2 and v.on|int == 1 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=0
                SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
            {% endif %}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    {% else %}
        # Print over: stop venting and go back to the default target
        {% if v.on|int == 1 and v.manual|int == 0 %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={v.default_target}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=slicer_set VALUE=0
    {% endif %}

# Console messages from macros (RESPOND)
[respond]

# Stock NOZZLE_CLEAR (inside Creality's closed prtouch_v3): scrub the hot
# nozzle on the textured strip at the back of the bed, where stock's
# prth_clr_probe_pos (85, 265.5) and prth_clr_pose (160, 265.5) put it. The
# strip height is probed first, so the scrub presses a measured 0.1 mm into it
# (stock pa_clr_down_mm -0.1) instead of a guessed Z, and the nozzle cools
# back to probing temperature while it scrubs so it leaves clean.
# UNTIL_CLEAN=1 (opt-in, adapted from the K2 Plus firmware's PRTOUCH_SCRUB):
# after each scrub, probe the strip again at the same X85 point and scrub
# again until the measured contact drops by less than CLEAN_TOL (0.01 mm),
# up to MAX_PASSES (3). Debris under the tip reads as a higher contact, so a
# contact that stops dropping means the tip is clean. The depth stays PRESS
# below the probed strip, as stock.
# Portions adapted from Jacob10383's K2 Plus custom firmware (https://github.com/Jacob10383/k2-plus-custom-firmware, extras/prtouch.py), GPLv3.
# METHOD=detect (opt-in, the K2 Plus firmware's full PRTOUCH_SCRUB): heat to
# HOT, then PRTOUCH_SCRUB taps the strip centre normally and with a firmer
# press to tell a flexible tab from a solid strip, scrubs the strip line
# (X155-165 by default) at the measured contact minus scrub_tab_depth or
# scrub_no_tab_depth, and repeats until the end contacts stop dropping, up
# to MAX_PASSES (default scrub_max_passes; settings in [prtouch_mainline]). The
# nozzle stays at HOT for every tap and only goes to COOL afterwards, so the
# contacts are not shifted by a cooling nozzle. UNTIL_CLEAN and PRESS do not
# apply. METHOD=fixed (the default) is the scrub above.
[gcode_macro NOZZLE_CLEAR]
description: Scrub the nozzle on the bed's rear cleaning strip, like stock
gcode:
    {% set hot = params.HOT|default(200)|float %}
    {% set method = params.METHOD|default("fixed")|lower %}
    {% set until_clean = params.UNTIL_CLEAN|default(0)|int %}
    {% set passes = params.MAX_PASSES|default(3)|int %}
    {% if method not in ("fixed", "detect") %}
        { action_raise_error("NOZZLE_CLEAR METHOD must be fixed or detect") }
    {% endif %}
    {% if passes < 1 or passes > 6 %}
        { action_raise_error("NOZZLE_CLEAR MAX_PASSES must be 1-6") }
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("NOZZLE_CLEAR needs X, Y and Z homed") }
    {% endif %}
    BED_MESH_CLEAR
    G90
    G1 Z5 F600
    {% if method == "detect" %}
        M109 S{hot}
        PRTOUCH_SCRUB{% if params.MAX_PASSES %} MAX_PASSES={passes}{% endif %}
        M104 S{params.COOL|default(140)|float}
    {% else %}
        G1 X85 Y265.5 F6000
        M400
        PROBE
        G1 Z5 F600
        M109 S{hot}
        {% if until_clean %}
            SET_GCODE_VARIABLE MACRO=_NOZZLE_CLEAN_PASS VARIABLE=done VALUE=0
            {% for n in range(1, passes + 1) %}
                _NOZZLE_CLEAN_PASS PASS={n} MAX={passes} TOL={params.CLEAN_TOL|default(0.01)} COOL={params.COOL|default(140)} PRESS={params.PRESS|default(0.1)}
            {% endfor %}
        {% else %}
            _NOZZLE_CLEAR_SCRUB COOL={params.COOL|default(140)} PRESS={params.PRESS|default(0.1)}
        {% endif %}
    {% endif %}

# One NOZZLE_CLEAR UNTIL_CLEAN=1 pass: scrub at the last measured strip
# contact, re-probe the strip, then let _NOZZLE_CLEAN_CHECK decide. Passes
# after the clean one do nothing. (Klipper macros cannot call themselves, so
# NOZZLE_CLEAR unrolls the passes.)
[gcode_macro _NOZZLE_CLEAN_PASS]
variable_done: 0
gcode:
    {% if not printer["gcode_macro _NOZZLE_CLEAN_PASS"].done %}
        {% set before = printer.probe.last_z_result %}
        _NOZZLE_CLEAR_SCRUB COOL={params.COOL} PRESS={params.PRESS}
        G90
        G1 X85 Y265.5 F6000
        M400
        PROBE
        G1 Z5 F600
        _NOZZLE_CLEAN_CHECK PASS={params.PASS} MAX={params.MAX} TOL={params.TOL} BEFORE={before}
    {% endif %}

[gcode_macro _NOZZLE_CLEAN_CHECK]
gcode:
    {% set before = params.BEFORE|float %}
    {% set after = printer.probe.last_z_result %}
    {% set dropped = before - after %}
    {% if dropped < params.TOL|float %}
        SET_GCODE_VARIABLE MACRO=_NOZZLE_CLEAN_PASS VARIABLE=done VALUE=1
        RESPOND MSG="Nozzle clean after {params.PASS} scrub pass(es): strip contact {"%.4f"|format(after)}, moved {"%.4f"|format(dropped)} mm"
    {% elif params.PASS|int >= params.MAX|int %}
        RESPOND MSG="Nozzle scrub: strip contact still dropping {"%.4f"|format(dropped)} mm after {params.MAX} passes (contact {"%.4f"|format(after)}); check the nozzle"
    {% else %}
        RESPOND MSG="Nozzle scrub pass {params.PASS}: strip contact dropped {"%.4f"|format(dropped)} mm, scrubbing again"
    {% endif %}

[gcode_macro _NOZZLE_CLEAR_SCRUB]
gcode:
    {% set z = printer.probe.last_z_result - params.PRESS|float %}
    G90
    # Stock prth_clr_pose 160,265.5,10 (the smooth right tab), prtouch_clr_sped 200
    G1 X165 Y265.5 F6000
    G1 Z{z + 1} F600
    G1 Z{z} F300
    {% for i in range(20) %}
        {% if i == 6 %}
            M104 S{params.COOL|float}
        {% endif %}
        G1 X155 Y{264.5 + i % 3} F12000
        G1 X165 Y{264.5 + (i + 1) % 3} F12000
    {% endfor %}
    G1 Z5 F600
    M400
    RESPOND MSG="Nozzle scrubbed on the bed strip (strip Z {"%.3f"|format(z + params.PRESS|float)})"

[gcode_macro _HEAT_SOAK]
description: Wait for the bed to settle, counting down in the status line
gcode:
    {% set seconds = params.SECONDS|default(120)|int %}
    {% for left in range(seconds, 0, -1) %}
        M117 Heat soak: {"%d:%02d"|format(left // 60, left % 60)} left
        {% if left == seconds or left % 15 == 0 %}
            RESPOND MSG="Heat soak: {left}s left"
        {% endif %}
        G4 P1000
    {% endfor %}
    M117
    RESPOND MSG="Heat soak done"

# Bambu P2S start: wipe on the silicone while the nozzle cools to probing
# temperature with the part fan on full, so ooze freezes and gets stripped off
# instead of reaching the bed under the probe.
[gcode_macro _COOL_WIPE]
description: Wipe the nozzle while cooling it to probing temperature, fan on
gcode:
    {% set probe_temp = params.PROBE_TEMP|default(140)|float %}
    {% set uz = params.UNHOMED_Z|default(0)|int %}
    G90
    {% if not uz %}
        G1 Z5 F600
    {% endif %}
    M83
    G1 E-3 F1800
    M106 S255
    M104 S180
    # Wipes 1-3 stay over the chute (PARK=0); only the last one parks.
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=185
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    M104 S{probe_temp}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={probe_temp + 5}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    M107
    M109 S{probe_temp}

# Creality Print's K2 flush block (its start and change-filament G-code,
# 10-25): at the chute, part fan low, five fast pushes each followed by a
# 1 mm/s pause, a 5 s full-fan blast so the strand sets and snaps off, the
# retract, then the full wipe. PRE pushes back earlier retractions first.
[gcode_macro _CREALITY_FLUSH]
description: One Creality K2 flush block over the chute with blast and wipe
gcode:
    {% set length = params.LENGTH|default(90)|float %}
    {% set pre = params.PRE|default(0)|float %}
    {% set speed = params.SPEED|default(6)|float %}
    {% set retract = params.RETRACT|default(2)|float %}
    {% set fan_after = params.FAN_AFTER|default(30)|int %}
    M83
    M106 S30
    G1 E{"%.3f"|format(length * 0.18 + pre)} F{speed * 60}
    G1 E{"%.3f"|format(length * 0.02)} F60
    {% for pulse in range(4) %}
        G1 E{"%.3f"|format(length * 0.18)} F{speed * 60}
        G1 E{"%.3f"|format(length * 0.02)} F60
    {% endfor %}
    M400
    M106 S255
    G4 P5000
    M106 S{fan_after}
    G1 E-{retract} F1800
    NOZZLE_WIPE CONFIRM=1

# Creality Print's K2 start prime line, on the front edge of the plate
# (Y-1, X105-160): a thick lead-in, alternating slow/fast thin segments,
# then a drag down to Z0 that wipes the tip. FLOW is the outer-wall
# volumetric speed (mm3/s); PRIME the retraction it pushes back first.
[gcode_macro _CREALITY_PRIME_LINE]
description: Creality K2 start prime line along the front edge
gcode:
    {% set flow = params.FLOW|default(12)|float %}
    {% set prime = params.PRIME|default(0.8)|float %}
    G90
    M83
    M204 S2000
    G1 Z3 F600
    G1 X105 Y-1 F30000
    G1 E{prime} F300
    G1 Z0.3 F1200
    G1 X130 E9 F{flow / 1.2 * 60}
    G1 X135 E0.3742 F{flow / 0.15 / 4 * 60}
    G1 X140 E0.3742 F{flow / 0.15 * 60}
    G1 X145 E0.3742 F{flow / 0.15 / 4 * 60}
    G1 X150 E0.3742 F{flow / 0.15 * 60}
    G1 X155 E0.3742 F{flow / 0.15 / 4 * 60}
    G91
    G1 X1 Z-0.3
    G1 X4
    G90
    G92 E0

[gcode_macro START_PRINT]
description: Heat, clean, precision-home, adaptive-mesh, and prepare the CFS slot
# Set when the slicer gave no TOOL: the first T0-T3 command loads that slot.
variable_cfs_pending: 0
# Set around START_PRINT's own Z home: the nozzle was just cool-wiped, so
# homing_override skips its in-print re-wipe.
variable_skip_home_wipe: 0
# BED_MESH_CHECK limits after the mesh (mm, and mm per mm between points)
variable_mesh_max_deviation: 0.35
variable_mesh_max_slope: 0.006
# First-layer height correction (mm, lowers the nozzle). Z is measured with
# the nozzle at 140C but the print runs hotter; stock prtouch applies
# temp_non_linaer_c 0.045 for this and the open driver does not. The 9-pad
# test on 10-26 lifted off at 0 and stuck at 0.05; the 60C motor-mount run
# then showed the nozzle ploughing first-layer infill at 0.05; at 0.03 the
# infill lines sat slightly apart, and 0.03 and 0.04 looked the same on the
# textured plate (10-27), so 0.04.
variable_hot_z_comp: 0.04
# Opt-in print-temperature scaling of hot_z_comp (from the K2 Plus firmware's
# thermal_expansion, which ships 0.00083 mm/C). Their model: the nozzle grows
# toward the bed as it heats, so a hotter print needs the nozzle HIGHER. Ours
# taps at a fixed 140C, so only the print temperature varies: the offset used
# is hot_z_comp - hot_z_rate * (EXTRUDER_TEMP - hot_z_ref_temp), with
# hot_z_ref_temp the print temperature hot_z_comp was tuned at. 0 = today.
variable_hot_z_rate: 0
variable_hot_z_ref_temp: 220
# Per-material first-layer correction added to hot_z_comp (mm, positive
# lowers the nozzle), after the K2 Plus firmware's offset_<MATERIAL>, e.g.
# variable_hot_z_material: {'PLA': -0.01, 'PETG': 0.0}. The material comes
# from START_PRINT MATERIAL= if the slicer sends it, else from the loaded
# slot's filament record (slot E without a CFS).
variable_hot_z_material: {}
# Opt-in: after the Z tap, scrub the strip until the measured contact stops
# moving (NOZZLE_CLEAR UNTIL_CLEAN=1), then tap Z again with the clean
# nozzle. 0 = today's single scrub after the tap.
variable_scrub_until_clean: 0
# Opt-in: 'detect' scrubs with NOZZLE_CLEAR METHOD=detect (the K2 Plus
# firmware's PRTOUCH_SCRUB) after the cool-wipe and BEFORE the Z tap, like
# the K2 Plus, so the Z tap and the mesh use the scrubbed nozzle and no
# second tap is needed; scrub_until_clean is then ignored. 'fixed' = today.
variable_scrub_method: 'fixed'
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|float %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set slots = ["A", "B", "C", "D"] %}
    # No CFS (cfs_fitted: False): one filament from the rear spool holder,
    # primed at the chute here instead of loaded from a slot
    {% set cfs_fitted = printer.k2_cfs.fitted %}
    {% if not cfs_fitted %}
        {% if tool > 0 %}
            { action_raise_error("This printer has no CFS, but the file asks for T%d. Slice it for one filament (T0)." % tool) }
        {% endif %}
        {% set tool = 0 %}
    {% endif %}
    # The print's material: START_PRINT MATERIAL= if the slicer sends it,
    # else the loaded slot's filament record (slot E without a CFS). Used for
    # the chamber target and the first-layer offset.
    {% set material = (params.MATERIAL|default(""))|upper %}
    {% if not material %}
        {% set records = printer.hark_cfs_slots.slots %}
        {% set rec_slot = "E" if not cfs_fitted else (slots[tool] if tool >= 0 else "") %}
        {% if rec_slot and rec_slot in records and records[rec_slot].loaded %}
            {% set material = (records[rec_slot].type or "")|upper %}
        {% endif %}
    {% endif %}
    _CFS_CHECK
    # Bed temperature as the job arrives (Jinja renders before M140 runs).
    # A bed already held at temperature has a settled plate and frame, so
    # the soak only has to cover however far it had cooled.
    {% set bed_gap = bed_temp - printer.heater_bed.temperature %}
    {% if bed_gap <= 3 %}
        {% set soak = 0 %}
    {% elif bed_gap < 15 %}
        {% set soak = (30 + 90 * (bed_gap - 3) / 12)|int %}
    {% else %}
        {% set soak = 120 %}
    {% endif %}
    {% if tool < -1 or tool > 3 %}
        { action_raise_error("START_PRINT TOOL must be 0, 1, 2, or 3") }
    {% endif %}
    {% if bed_temp < 0 or bed_temp > 110 %}
        { action_raise_error("START_PRINT BED_TEMP must be 0-110C") }
    {% endif %}
    {% if extruder_temp < 170 or extruder_temp > 350 %}
        { action_raise_error("START_PRINT EXTRUDER_TEMP must be 170-350C") }
    {% endif %}
    {% set scrub_method = printer["gcode_macro START_PRINT"].scrub_method|string|lower %}
    {% if scrub_method not in ("fixed", "detect") %}
        { action_raise_error("START_PRINT scrub_method must be 'fixed' or 'detect'") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    # Clear any old offset so homing and probing moves are not shifted.
    SET_GCODE_OFFSET Z=0
    M107
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    # Automatic chamber control for this print. The target is whatever the
    # slicer's M191/M141 set before this macro, else the material's
    # (material_targets), else 35C; it goes back to the default when the
    # print ends. A previous print's end vent stops here.
    {% set cf = printer["gcode_macro _CHAMBER_FAN"] %}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_VENT_END DURATION=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=0
    {% if not cf.slicer_set|int and material in cf.material_targets %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={cf.material_targets[material]}
        RESPOND MSG="Chamber target {cf.material_targets[material]}C for {material}: the exhaust fan vents above {cf.material_targets[material] + 2}C"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    M107 P2
    M140 S{bed_temp}
    M104 S140

    # One heat cycle before probing. No Z contact yet (a crusted nozzle
    # cannot fake one), load and purge at print temperature over the
    # chute while the bed heats and soaks, wipe while cooling to probing
    # temperature, then the clean nozzle measures Z, scrapes on the bed
    # strip and goes straight to the mesh.
    # Absolute Z from the PA15 bottom switch on every print, so the precise
    # tap below always starts from a known 5 mm whatever happened to Z since
    # the last home (a stale Z made the tap miss the bed, 10-25). The bed
    # waits at the bottom through the load and purge.
    KZ_ALIGN_BOTTOM CONFIRM=1
    G28 X Y
    CFS_PURGE_POSITION CONFIRM=1 UNHOMED_Z=1
    {% if tool >= 0 %}
        M104 S{extruder_temp}
        # Wait only while the bed is still heating. M190 also waits for a
        # hotter bed to cool to target and for the PID to settle within 1C,
        # which cost 2-5 min on 10-26. The bed keeps soaking through the
        # load, purge and wipes before the Z tap.
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
        M109 S{extruder_temp}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        # The load and purge, then the cool-down, give the bed its soak
        {% if cfs_fitted %}
            CFS_PRINT_START SLOT={slots[tool]} CONFIRM=1 UNHOMED_Z=1
        {% else %}
            _SPOOL_PRINT_START
        {% endif %}
        {% if printer["gcode_macro _PA_AUTO"].on_print_start|int and cfs_fitted
              and printer.k2_cfs.active_slot != slots[tool] %}
            # Still at print temperature at the chute; the feed stays armed
            # for the flush that follows
            _PA_AUTO SLOT={slots[tool]} KEEP_FEED=1
        {% endif %}
    {% else %}
        # Creality Print and stock Orca K2 jobs omit TOOL and send Tn next.
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=1
        { action_respond_info("START_PRINT: CFS slot load deferred to the first T command") }
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
        {% if soak > 0 %}
            _HEAT_SOAK SECONDS={soak}
        {% else %}
            RESPOND MSG="Heat soak skipped: bed was already at {bed_temp|int}C"
        {% endif %}
    {% endif %}
    _COOL_WIPE PROBE_TEMP=140 UNHOMED_Z=1
    {% if tool >= 0 and bed_gap >= 15 %}
        # Cold start: the plate edges warm after the centre and keep rising.
        # On 10-26 a 28C start reached the Z tap 221 s after the bed hit
        # temperature and the right edge printed a little close; runs
        # with 260+ s were right. Top the soak up to about 5 minutes.
        _HEAT_SOAK SECONDS=90
    {% endif %}

    {% if scrub_method == "detect" %}
        # Scrub before the Z tap. Z is known from KZ_ALIGN_BOTTOM (within
        # about 0.06 mm of the tap) and every scrub depth is relative to
        # contacts measured on the strip. If the first strip tap misses,
        # the scrub stops and reports, and the Z tap runs as usual. Go to
        # the bed centre first, as the Z home does, before the bed comes up
        # to 5 mm.
        G90
        G1 X130 Y125 F6000
        NOZZLE_CLEAR METHOD=detect HOT=140 COOL=140
    {% endif %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=1
    G28 Z
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    {% if scrub_method == "detect" %}
        # Already scrubbed before the tap.
    {% elif printer["gcode_macro START_PRINT"].scrub_until_clean %}
        NOZZLE_CLEAR HOT=140 COOL=140 UNTIL_CLEAN=1
        # The tip is now clean: measure the contact plane again with it.
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=1
        G28 Z
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    {% else %}
        NOZZLE_CLEAR HOT=140 COOL=140
    {% endif %}
    BED_MESH_CLEAR
    # Mesh taps at 3 mm/s (Z home stays at 1 mm/s). 0.75/3/5 mm/s read the
    # same bed shape on 10-26 (sd < 3 um, 3 mm/s within 0.005 of 0.75),
    # and 3 mm/s saves about 1 s per point.
    # Adaptive mesh over the model AND the prime tower. The plain adaptive
    # mesh only probes under the objects, so the tower printed on the mesh
    # edge stretched outwards and came loose (10-25). Orca passes the tower
    # with TOWER_X/TOWER_Y (front-left corner) and TOWER_W (0 = no tower).
    {% set tower_w = params.TOWER_W|default(0)|float %}
    {% set objs = printer.exclude_object.objects %}
    {% if tower_w > 0 and objs %}
        {% set bm = printer.configfile.settings.bed_mesh %}
        {% set xs = [] %}
        {% set ys = [] %}
        {% for o in objs %}
            {% for pt in o.polygon %}
                {% set _ = xs.append(pt[0]) %}
                {% set _ = ys.append(pt[1]) %}
            {% endfor %}
        {% endfor %}
        {% set tx = params.TOWER_X|default(0)|float %}
        {% set ty = params.TOWER_Y|default(0)|float %}
        {% set _ = xs.extend([tx, tx + tower_w]) %}
        {% set _ = ys.extend([ty, ty + tower_w]) %}
        {% set m = bm.adaptive_margin %}
        {% set x0 = [xs|min - m, bm.mesh_min[0]]|max %}
        {% set y0 = [ys|min - m, bm.mesh_min[1]]|max %}
        {% set x1 = [xs|max + m, bm.mesh_max[0]]|min %}
        {% set y1 = [ys|max + m, bm.mesh_max[1]]|min %}
        {% set sx = (bm.mesh_max[0] - bm.mesh_min[0]) / (bm.probe_count[0] - 1) %}
        {% set sy = (bm.mesh_max[1] - bm.mesh_min[1]) / (bm.probe_count[1] - 1) %}
        {% set cx = [[((x1 - x0) / sx)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[0]]|min %}
        {% set cy = [[((y1 - y0) / sy)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[1]]|min %}
        RESPOND MSG="Mesh covers the model and prime tower: X{x0|round(1)}-{x1|round(1)} Y{y0|round(1)}-{y1|round(1)}, {cx}x{cy} points"
        BED_MESH_CALIBRATE MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={cx},{cy} PROBE_SPEED=3
    {% else %}
        BED_MESH_CALIBRATE ADAPTIVE=1 PROBE_SPEED=3
    {% endif %}
    # Stop before printing on a mesh no K2 bed should have (a bad tap the
    # mesh guard could not fix). Normal adaptive meshes read ~0.04mm and a
    # slope under 0.001; the full bed read 0.254mm on 10-24.
    BED_MESH_CHECK MAX_DEVIATION={printer["gcode_macro START_PRINT"].mesh_max_deviation} MAX_SLOPE={printer["gcode_macro START_PRINT"].mesh_max_slope}

    # Leave the probed surface before final heating so nozzle ooze falls into
    # the purge bucket instead of onto the just-measured bed.
    G90
    G1 Z5 F600
    M400
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{extruder_temp}
    {% if tool >= 0 %}
        # Creality's last start flush block at print temperature: push back
        # the purge (2) and cool-wipe (3) retractions, pulsed flush, 5 s
        # blast so the strand snaps off, retract, full wipe.
        _CREALITY_FLUSH LENGTH=90 PRE=5 FAN_AFTER=0
    {% endif %}

    M220 S100
    M221 S100
    {% if tool >= 0 %}
        _CREALITY_PRIME_LINE
    {% endif %}
    # Stock runs accel_to_decel = accel; 0.5 here made curves stutter.
    SET_VELOCITY_LIMIT ACCEL=20000 MINIMUM_CRUISE_RATIO=0.0
    # Applied after the prime line; the slicer's first move takes it up.
    # Written as 0 - x: a leading "{-" is Jinja whitespace control, not a
    # minus, and set +0.05 on 10-26.
    {% set sp = printer["gcode_macro START_PRINT"] %}
    {% set mat_comp = (sp.hot_z_material[material] if material in sp.hot_z_material else 0)|float %}
    {% set hot_comp = sp.hot_z_comp + mat_comp - sp.hot_z_rate * (extruder_temp - sp.hot_z_ref_temp) %}
    {% if hot_comp|abs > 0.3 %}
        { action_raise_error("START_PRINT: hot Z comp %.3f mm is implausible; check hot_z_comp/hot_z_material/hot_z_rate/hot_z_ref_temp" % hot_comp) }
    {% endif %}
    {% if sp.hot_z_rate != 0 or mat_comp != 0 %}
        RESPOND MSG="First-layer Z comp {"%.4f"|format(hot_comp)} mm: {sp.hot_z_comp}{(" %+.3f (%s)" % (mat_comp, material)) if mat_comp else ""} - {sp.hot_z_rate} mm/C x ({extruder_temp} - {sp.hot_z_ref_temp}) C"
    {% endif %}
    SET_GCODE_OFFSET Z={0 - hot_comp}
    G90
    M83
    G92 E0

# Stock K2 slicer compatibility (2026-10-24). START_PRINT already purges into
# the bucket and wipes, so the stock adaptive purge line is not needed.
[gcode_macro LINE_PURGE]
description: Stock K2 purge line; START_PRINT already purged into the bucket
gcode:
    { action_respond_info("LINE_PURGE skipped: START_PRINT purged into the bucket") }

[gcode_macro M191]
description: Set the chamber target (no wait: the K2 has no chamber heater)
gcode:
    {% set target = params.S|default(0)|float %}
    M141 S{target}

# Mid-print slot change. Between two slots of the same material the chute
# purge follows the slicer's flush matrix, like Creality Print: Orca's
# change-filament G-code sets next_purge to {flush_length} (mm) just before
# the T command. Without it, PLA to PLA falls back to pla_purge mm. Any
# change of material keeps the full stock purge. With [k2_cfs]
# toolchange_purge_from_file: true the file's flush_volumes_matrix comes
# before the pla_purge fallback.
[gcode_macro _CFS_TC]
variable_pla_purge: 70
variable_next_purge: 0
gcode:
    {% set new = params.SLOT|upper %}
    # The box can report no active slot while it follows the extruder
    {% set old = printer.k2_cfs.active_slot or printer.k2_cfs.feed_slot %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set t_new = (slots[new].type if new in slots else "")|upper %}
    {% set t_old = (slots[old].type if old and old in slots else "")|upper %}
    {% set flush = printer["gcode_macro _CFS_TC"].next_purge|float %}
    SET_GCODE_VARIABLE MACRO=_CFS_TC VARIABLE=next_purge VALUE=0
    {% if t_new and t_new == t_old and flush > 0 %}
        CFS_TOOLCHANGE SLOT={new} PURGE={"%.1f"|format([[flush, 30]|max, 240]|min)}
    {% elif t_new == "PLA" and t_old == "PLA" %}
        CFS_TOOLCHANGE SLOT={new} PURGE_FALLBACK={printer["gcode_macro _CFS_TC"].pla_purge}
    {% else %}
        CFS_TOOLCHANGE SLOT={new}
    {% endif %}

# Without a CFS the rear spool is T0 and uses slot E's filament record (the
# external spool: pressure advance, retraction) when one is set; T1-T3
# cannot print.
[gcode_macro _NO_CFS_TOOL]
gcode:
    {% if params.T|int != 0 %}
        { action_raise_error("This printer has no CFS: the file asks for T%s but only T0 (the rear spool) exists. Slice it for one filament." % params.T) }
    {% endif %}

[gcode_macro T0]
description: Select CFS slot A (loads it at print start, changes to it mid-print)
rename_existing: M8800
gcode:
    {% if not printer.k2_cfs.fitted %}
        _NO_CFS_TOOL T=0
    {% elif printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        CFS_PRINT_START SLOT=A CONFIRM=1
        M8800
    {% elif printer.print_stats.state == "printing" %}
        _CFS_TC SLOT=A
    {% else %}
        M8800
    {% endif %}
    CFS_SLOT_APPLY SLOT={"A" if printer.k2_cfs.fitted else "E"}

[gcode_macro T1]
description: Select CFS slot B (loads it at print start, changes to it mid-print)
rename_existing: M8801
gcode:
    {% if not printer.k2_cfs.fitted %}
        _NO_CFS_TOOL T=1
    {% elif printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        CFS_PRINT_START SLOT=B CONFIRM=1
        M8801
    {% elif printer.print_stats.state == "printing" %}
        _CFS_TC SLOT=B
    {% else %}
        M8801
    {% endif %}
    CFS_SLOT_APPLY SLOT=B

[gcode_macro T2]
description: Select CFS slot C (loads it at print start, changes to it mid-print)
rename_existing: M8802
gcode:
    {% if not printer.k2_cfs.fitted %}
        _NO_CFS_TOOL T=2
    {% elif printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        CFS_PRINT_START SLOT=C CONFIRM=1
        M8802
    {% elif printer.print_stats.state == "printing" %}
        _CFS_TC SLOT=C
    {% else %}
        M8802
    {% endif %}
    CFS_SLOT_APPLY SLOT=C

[gcode_macro T3]
description: Select CFS slot D (loads it at print start, changes to it mid-print)
rename_existing: M8803
gcode:
    {% if not printer.k2_cfs.fitted %}
        _NO_CFS_TOOL T=3
    {% elif printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        CFS_PRINT_START SLOT=D CONFIRM=1
        M8803
    {% elif printer.print_stats.state == "printing" %}
        _CFS_TC SLOT=D
    {% else %}
        M8803
    {% endif %}
    CFS_SLOT_APPLY SLOT=D

[gcode_macro CANCEL_PRINT]
description: Cancel without motion and leave every heat/feed source safe
rename_existing: CANCEL_PRINT_BASE
gcode:
    # Stop virtual-SD execution before changing machine state. Do not move:
    # cancel may be invoked because motion or the toolhead is unsafe.
    CANCEL_PRINT_BASE
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
    TURN_OFF_HEATERS
    M107
    M107 P1
    M107 P2
    CFS_FEED_STOP
    # Stock idle state between prints
    CFS_PRELOAD ENABLE=1
    BED_MESH_CLEAR
    EXCLUDE_OBJECT RESET=1
    EXCLUDE_OBJECT_DEFINE RESET=1
    M220 S100
    M221 S100
    M84
    _CHAMBER_VENT

[gcode_macro END_PRINT]
description: Safely park and shut down after a completed print
gcode:
    M400
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G92 E0
        G1 E-1 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M107 P1
    M107 P2

    {% if "z" in printer.toolhead.homed_axes %}
        {% set remaining_z =
            printer.toolhead.axis_maximum.z|float
            - printer.toolhead.position.z|float %}
        {% set z_hop = [[remaining_z, 0.0]|max, 2.0]|min %}
        G91
        G1 Z{z_hop} F600
        G90
    {% endif %}
    {% if "x" in printer.toolhead.homed_axes
          and "y" in printer.toolhead.homed_axes %}
        G90
        G1 Y261 F12000
        G1 X205 F12000
    {% endif %}

    BED_MESH_CLEAR
    EXCLUDE_OBJECT RESET=1
    EXCLUDE_OBJECT_DEFINE RESET=1
    M220 S100
    M221 S100
    M84
    CFS_FEED_STOP
    # Stock idle state between prints
    CFS_PRELOAD ENABLE=1
    _CHAMBER_VENT

[force_move]
enable_force_move: true

[hark_compat]

[fan_feedback]
# Native K2 MCU tachometer inputs. Creality's master-server requires the
# get_cx_fan_status webhook and otherwise treats the throat fan as stopped.
fan0_pin: PC6
fan1_pin: nozzle_mcu:PA12
fan2_pin: nozzle_mcu:PC13
print_delay_time: 5
current_delay_time: 2

[k2_motor_bus]
serial: /dev/ttyS5
baud: 230400
# Wake the closed-loop X/Y/E motors ourselves instead of relying on stock
# Klipper having run first (2026-10-24)
init_motors: True
extruder_motor_mcu: nozzle_mcu
# Step/dir levels held while the motors wake (PB7 high = Y driver; the
# extruder needs its dir line low, which a print can leave high)
wake_pins: PB9=0, PB10=0, PB7=1, PB8=0, nozzle_mcu:PB4=0, nozzle_mcu:PB5=0
# The CFS loses its bus address at power-off. At ready the driver finds it
# with the stock discover broadcast and gives it back; cfs_uniid (this CFS's
# id, shown by CFS_QUERY CMD=BOX_STATE) is optional and tried first.
#cfs_uniid:
# Reply checks and motor guards (defaults shown; see docs/MOTOR-CONTROLLER.md)
#reply_check: strict
#stall_mode_check: warn
#homing_fault_check: off
#temp_poll_interval: 0
#temp_warn: 100

[k2_cfs]
# Enables loaded-path buffer feed, guarded unload/load, and explicitly
# confirmed purge/cutter routes. Every physical phase remains independently
# confirmation-gated until the complete tool-change sequence is qualified.
allow_actuation: true
# Stock F021 purge-bucket route, physically revalidated at 100 mm/s; raised
# 10-25 to Creality Print's own K2 travel speeds (chute F18000, cutter F12000).
purge_safe_y: 261
purge_entry_x: 131
purge_gate_x: 127
purge_x: 115
purge_y: 291.5
purge_return_x: 205
purge_position_tolerance: 2
purge_speed: 300
purge_min_z: 4.5
# Stock box.cfg requests 140mm, but the current wrapper clamps that baseline
# to an actual 160mm flush: 90+70. A traced 240mm flush is 90+70+80.
purge_extrude_length: 180
purge_retract_length: 2
purge_cool_time: 5
purge_extrude_speed: 6
purge_chunk_length: 90
purge_followup_chunk_length: 70
purge_minimum_actual_length: 160
purge_slow_fraction: 0.2
purge_fast_multiplier: 1.2
clean_plate_x: 155
clean_left_x: 127
clean_right_x: 137
clean_circle_left_x: 145
clean_circle_right_x: 155
clean_y: 291.5
clean_speed: 200
clean_circle_speed: 166.666667
clean_accel: 5000
# Optional extra strokes the full length of the brush after the circles, and
# a faster wipe, e.g. clean_speed 300, clean_circle_speed 250, clean_accel
# 10000 (the stock wipe often leaves a strand on the tip)
#clean_brush_strokes: 0
#clean_brush_left_x: 146
#clean_brush_right_x: 158
# F021 cutter staging point. cutter_cut_x is how far the head rams the cutter
# lever: install.sh sets it for the extruder you choose. Stock extruder: the
# printer's own Creality calibration (cut_pos_x in the stock printer.cfg),
# else -7.2. Phaetus DXC2: 0.8 mm deeper than that calibration but never
# shallower than -8.0 (the developer's DXC2 needed -8.0 at Creality's 5000
# cut acceleration; shallower left colour-change cuts incomplete). If cuts are incomplete, make
# it 0.2-0.4 more negative (allowed -10 to -5). Initial staging remains capped
# at 100 mm/s; stock cut_velocity is 500 mm/s.
cutter_x: 10
cutter_y: 150
cutter_speed: 200
cutter_cut_x: -7.2
cutter_release_x: -1.7
cutter_ram_speed: 500
cutter_release_speed: 150
cutter_ram_accel: 5000
cutter_retract_length: 2
cutter_retract_speed: 6
cutter_tip_length: 7
cutter_tip_push_speed: 9
cutter_tip_pull_speed: 5
# Stock box.cfg cutter return/hall input.
cutter_switch_pin: !nozzle_mcu:PB9
# Post-cut unload. Creality's closed wrapper applies Tn_retrude three times,
# then a fixed 10mm slow pull. Stock extruder: Tn_retrude -10, so
# 10+10+10+10 = 40mm. Phaetus DXC2: Phaetus requires Tn_retrude -20, so
# 20+20+20+10 = 70mm (install.sh sets unload_pull_length for the extruder you
# choose). Pause 300ms after entering IDLE and before the first CFS rewind
# command so the cutter/filament can settle. Standalone rewind is blocked;
# these values are reachable only after cutter completion.
unload_fast_pulls: 3
unload_pull_length: 10
unload_pull_speed: 6
unload_final_length: 10
unload_final_speed: 1
unload_rewind_pause_ms: 300
unload_bus_timeout: 150  # Creality allows 150 s for RETRUDE; the rewind took >30 s on 10-25
# Completion acknowledgements can precede the nozzle-switch callback.
unload_sensor_timeout: 10
sensor_poll_interval: 0.1
# Current-wrapper load handshake: all-idle, tension disabled, stage
# 0/4/repeated 5, nozzle-sensor engagement, E+5, stage 6, E+9, then stage 7.
# `CFS_PURGE` is the separate stock-equivalent flush phase. Neither command
# heats automatically.
load_bus_timeout: 15
load_timeout: 90
# Stock polls EXTRUDE stage 5 every 2 s
load_poll_interval: 2
# Between stage-5 sends the nozzle sensor is checked every 0.1 s (local
# sensor, no bus traffic), so the load moves on as soon as filament arrives
#load_arrival_poll_interval: 0.1
# A box BUSY (0x03) reply is retried instead of failing the step
#busy_retries: 2
#busy_retry_delay: 1
# On EXTRUDE_ERR8 (hub wheel stopped) or UNLOAD_MOTOR_BLOCKED (0x19), sweep
# the toolhead across the bed to free the PTFE tube before the retry. Off by
# default (plain retries only). Moves stay inside the bed, Y <= purge_safe_y.
#stall_retry_motion: false
#stall_retry_moves: Y255, X220, Y40, X40
# Lift (mm) before the sweep so the head clears a part mid-print
#stall_retry_z_lift: 10
load_engage_length: 5
load_engage_speed: 1
load_extrude_length: 9
load_extrude_speed: 3
load_box_finish_length: 3
# Deliberate CFS unload clears the normal runout switch. Mask only its runout
# handler during the cut/unload transaction, then restore it in `finally`.
filament_sensor_name: filament_sensor
manage_runout_sensor: true
# The options below are adapted from Jacob10383's K2 Plus custom firmware
# (https://github.com/Jacob10383/k2-plus-custom-firmware, extras/box.py), GPLv3.
# Runout refill purge between two slots of the same filament: 40 mm short
# purge after the load (0 = the full stock purge)
#runout_purge_length: 40
# The box reports mask 0 while it follows the extruder: treat the armed
# feed slot as loaded when the nozzle sensor and hub sensor agree
#path_owner_from_feed_slot: true
# Tool change purge from the print file's flush_volumes_matrix when the
# slicer passes none (off: fixed fallbacks)
#toolchange_purge_from_file: false
# Pause when the extruder feeds 80 mm while the CFS measuring wheel moves
# under 18 mm (filament not coming through). Off by default.
#clog_detection: false
#clog_extruder_length: 80
#clog_wheel_reset_length: 18
# Box poll interval while printing (0 = env_poll_interval, 2 s)
#print_poll_interval: 0

[k2_z_align]
# Stock-compatible MCU-controlled bottom optical reference on PA15. Motion
# requires KZ_ALIGN_BOTTOM CONFIRM=1. G28 invokes it automatically only while
# Z is unhomed; the standalone command remains explicitly gated.
allow_motion: true
endstop_pin: PA15
position_endstop: 263.12734375
quick_speed: 10
slow_speed: 10
rising_dist: 10
safe_dist: 40
filter_count: 10
timeout: 60
retract_dist: 10
retract_speed: 10
zd_up: 1
zes_untrig: 1

# The K2 closed-loop motor stall detector is one-shot. Each axis must be
# armed immediately before its own homing move and disarmed afterward.
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}
    {% if 'Z' in params and not home_all
          and ('x' not in printer.toolhead.homed_axes
               or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("Home X and Y before requesting Z-only homing") }
    {% endif %}
    {% if not printer.k2_motor_bus.motors_ready %}
        { action_raise_error("The X/Y/E motors did not wake up (see k2_motor_bus in klippy.log). Run MOTOR_INIT, or restart the printer.") }
    {% endif %}

    # Like stock, a normal G28 does not visit the PA15 bottom switch (stock
    # keeps it for resume; KZ_ALIGN_BOTTOM is still available). With Z
    # unknown, drop the bed 5 mm first so XY homing cannot drag the nozzle
    # across a raised bed. If Z is already homed, just keep 5 mm clearance.
    {% if home_z %}
        {% if not z_was_homed %}
            FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10
        {% elif printer.toolhead.position.z|float < 5.0 %}
            G90
            G1 Z5 F600
            M400
        {% endif %}
    {% endif %}

    M204 S500

    {% if home_all or 'Y' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 Y
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 Y10 F3600
        G90
    {% endif %}

    {% if home_all or 'X' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 X
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 X-10 F3600
        G90
    {% endif %}

    # With XY known, move from a trustworthy Z coordinate to 5 mm above the
    # nominal contact plane, perform the bounded strain-gauge search, define
    # contact as Z=0, and leave the nozzle 5 mm clear of the bed.
    {% if home_z %}
        G90
        G1 X130 Y125 F6000
        {% if printer.print_stats.state == "printing"
              and printer["filament_switch_sensor filament_sensor"].filament_detected
              and not printer["gcode_macro START_PRINT"].skip_home_wipe %}
            # Only inside a print's START_PRINT, and whether or not Z was
            # already homed: stock cleans the nozzle before measuring Z
            # (BOX_NOZZLE_CLEAN), as ooze or a hardened strand left from an
            # earlier load touches the bed first and fakes contact. Soften
            # it, wipe with the fan on, and wipe again once cooled. A manual
            # G28 just homes; the precise tap still fails safe on a blob.
            {% set target = printer.extruder.target %}
            M106 S255
            M109 S{[target, 170]|max}
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1 PARK=0
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1 PARK=0
            M104 S{[target, 140]|min if target > 0 else 140}
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1
            M107
            M104 S{target}
            G90
            G1 X130 Y125 F6000
        {% endif %}
        {% if not z_was_homed %}
            # Stock G28 Z: raise the bed at homing_speed until the strain
            # gauge triggers, retract, re-tap at second_homing_speed.
            M400
            G4 P1000
            G28 Z
        {% endif %}
        G1 Z5 F600
        M400
        G4 P1000
        M204 S20000
        PRTOUCH_HOME_Z PROBE_SPEED=1
        G1 Z5 F600
        M400
    {% endif %}

    M204 S20000

# CFS slot filament records + Fluidd/Mainsail editor (CFS_SLOTS). Data: hark_cfs_slots.json
[hark_cfs_slots]

# RUN_SAFE: run a macro, then always its cleanup (PA calibration heater/feed)
[hark_safe_run]

# Printed flow-ratio and retraction tests started from the screen or
# Mainsail (CALIBRATE_FLOW / CALIBRATE_RETRACTION SLOT=x); the pick is saved
# to the slot
[hark_calib]

# Phase 1 Kalico features as add-on modules (10-25): RELOAD_GCODE_MACROS,
# PID_PROFILE (loaded per CFS slot material by CFS_SLOT_APPLY) and
# BED_MESH_CHECK (run by START_PRINT after the mesh).
[hark_macro_reload]

[hark_pid_profiles]

[hark_mesh_check]

# Print safety watch (10-26): stock master-server paused on a dead fan and
# stock motor_control cancelled on a motor fault; both are gone on the open
# stack. Fan failure pauses, an X/Y motor fault cancels (heaters off), an
# extruder motor fault (clog or jam) pauses. SAFETY_STATUS [QUERY=1].
[hark_safety]

# Updates: offers the newest tested K2 OpenKlipper release from GitHub (a
# dialog in Mainsail, a row on the touchscreen's Machine page) and installs it
# with OKL_UPDATE CONFIRM=1, keeping printer-overrides.cfg. OKL_UPDATE_CHECK
# checks now. Set check_interval: 0 to only check on request.
[hark_update]

[gcode_macro CFS_FILAMENTS]
description: Show and edit the filament in each CFS slot
gcode:
    CFS_SLOTS

# Toolhead accelerometer. Creality's nozzle MCU firmware speaks the 2023
# lis2dw protocol, so this uses extras/lis2dw_k2.py instead of mainline's
# lis2dw. Pins and axes_map are from stock printer.cfg.
[lis2dw_k2]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw_k2
probe_points: 130, 130, 130
min_freq: 20
max_freq: 120
accel_per_hz: 100

# G10/G11 retraction. CFS_SLOT_APPLY sets the length (and speed) from the
# armed slot's record; these are the fallbacks for slots with 0 (unset).
# Orca needs "Use firmware retraction" on in the printer preset.
[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

# Bambu-style clean for a crusted nozzle, over the purge chute. Works before
# Z is homed (drops the bed 5 mm first). Heats to TEMP to soften the crust,
# flushes FLUSH mm if filament is loaded, then wipes on the silicone hot and
# again while cooling with the fan on, so leftovers freeze and strip off.
[gcode_macro NOZZLE_DEEP_CLEAN]
description: Melt, flush and wipe a crusted nozzle over the purge chute
gcode:
    {% set temp = params.TEMP|default(250)|float %}
    {% set flush = params.FLUSH|default(15)|float %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set unhomed_z = 0 if 'z' in homed else 1 %}
    {% if 'z' not in homed %}
        FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10
    {% elif printer.toolhead.position.z|float < 5.0 %}
        G90
        G1 Z5 F600
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    CFS_PURGE_POSITION CONFIRM=1 UNHOMED_Z={unhomed_z}
    M107
    M109 S{temp}
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        M83
        G1 E{flush} F300
        G1 E-2 F1800
    {% endif %}
    M106 S255
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M104 S180
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=185
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=145
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M107
    M104 S0
    RESPOND MSG="Nozzle deep clean done"

# Purge line 20 mm in front of the print area (clears a 5 mm auto brim plus
# the bead width), so the first perimeters start
# with a full nozzle. Two phases, like Bambu's prime line: a fat, slow bead
# low enough to swamp the nozzle tip and pick up residue around it, then a
# fast low drag that wipes the tip along the line. Placement adapted from
# KAMP's Line_Purge (GPLv3): from the file's EXCLUDE_OBJECT outlines, along X
# in front of the parts if there is room, else along Y to their left.
[gcode_macro _HARK_LINE_PURGE]
description: Adaptive swamp-and-drag purge line in front of the printed objects
gcode:
    {% set height = params.HEIGHT|default(0.6)|float %}
    {% set margin = params.MARGIN|default(20)|float %}
    {% set length = params.LENGTH|default(25)|float %}
    {% set amount = params.AMOUNT|default(30)|float %}
    {% set drag = params.DRAG|default(20)|float %}
    {% set flow = params.FLOW|default(12)|float %}
    {% set total = length + drag + 10 %}
    {% set pts = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% if not pts %}
        RESPOND MSG="Purge line skipped: the file has no object outlines"
    {% else %}
        {% set x_min = pts | map(attribute=0) | min %}
        {% set x_max = pts | map(attribute=0) | max %}
        {% set y_min = pts | map(attribute=1) | min %}
        {% set y_max = pts | map(attribute=1) | max %}
        {% set speed = flow / 2.405 / amount * length * 60 %}
        {% set along_x = y_min - margin >= 5 %}
        {% if along_x %}
            {% set a0 = [[(x_min + x_max) / 2 - total / 2, 5]|max, 250 - total]|min %}
            # As far from the part as the bed allows: the front edge (Y10),
            # or MARGIN in front of the part when it reaches further forward
            {% set b0 = [y_min - margin, params.EDGE|default(10)|float]|min %}
        {% else %}
            {% set a0 = [[(y_min + y_max) / 2 - total / 2, 5]|max, 250 - total]|min %}
            {% set b0 = [x_min - margin, 5]|max %}
        {% endif %}
        {% set ax = 'X' if along_x else 'Y' %}
        SAVE_GCODE_STATE NAME=HARK_LINE_PURGE
        G90
        M83
        {% if along_x %}
            G0 X{a0} Y{b0} F12000
        {% else %}
            G0 X{b0} Y{a0} F12000
        {% endif %}
        G0 Z{height} F600
        G1 {ax}{a0 + length} E{amount} F{speed}
        G1 Z0.2 F600
        G1 {ax}{a0 + length + drag} E1 F1800
        G10
        G0 {ax}{a0 + total} F12000
        G0 Z2 F600
        G11
        RESTORE_GCODE_STATE NAME=HARK_LINE_PURGE
        RESPOND MSG="Purge line done: {amount}mm swamp + {drag}mm drag along {ax} from {'%.0f'|format(a0)}"
    {% endif %}

# Screen/console slot loading while idle. Heats over the purge chute (never
# over the bed) to the hotter of the old and new filament.
[gcode_macro _CFS_SAFE_Z]
gcode:
    {% if printer.toolhead.position.z|float < 10 %}
        G90
        G1 Z10 F600
    {% endif %}

# Leave the nozzle clean after a load/purge/unload: whatever oozes while it
# cools is wiped off with the fan on, instead of hardening on the tip.
[gcode_macro _CFS_COOL_WIPE]
gcode:
    M104 S0
    M106 S255
    NOZZLE_WIPE CONFIRM=1
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1
    M107

[gcode_macro CFS_LOAD_SLOT]
description: Load a CFS slot and purge the old filament out (idle only)
gcode:
    {% set slot = params.SLOT|default("")|upper %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set active = printer.k2_cfs.active_slot %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_LOAD_SLOT is only for when nothing is printing") }
    {% endif %}
    {% if slot not in ("A", "B", "C", "D") %}
        { action_raise_error("CFS_LOAD_SLOT needs SLOT=A, B, C or D") }
    {% endif %}
    {% set new_t = (slots[slot].nozzle_temp if slot in slots else 0)|int %}
    {% set old_t = (slots[active].nozzle_temp if active and active in slots else 0)|int %}
    {% set temp = [new_t, old_t, 220]|max %}
    # Everything happens over the chute: take Z from the bottom switch (no
    # nozzle contact, so a crusted nozzle cannot fail a probe) and home X/Y
    {% if 'z' not in printer.toolhead.homed_axes %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    CFS_CHANGE_SLOT SLOT={slot} CONFIRM=1
    {% if printer["gcode_macro _PA_AUTO"].on_load|int %}
        _PA_AUTO SLOT={slot}
    {% endif %}
    NOZZLE_WIPE CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    CFS_SLOT_APPLY SLOT={slot}
    # COOL=0 (screen's load-then-calibrate) keeps the nozzle hot for the
    # PA_CAL_RUN that follows, which ends with its own cool-wipe
    {% if params.COOL|default(1)|int %}
        _CFS_COOL_WIPE
    {% endif %}
    RESPOND MSG="Slot {slot} loaded and purged"

[gcode_macro CFS_UNLOAD_ACTIVE]
description: Cut and rewind the loaded CFS filament (idle only)
gcode:
    {% set active = printer.k2_cfs.active_slot %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_UNLOAD_ACTIVE is only for when nothing is printing") }
    {% endif %}
    {% if not active %}
        { action_raise_error("No CFS slot is loaded") }
    {% endif %}
    {% set temp = [(slots[active].nozzle_temp if active in slots else 0)|int, 220]|max %}
    # Same as CFS_LOAD_SLOT: Z from the bottom switch, no nozzle contact
    {% if 'z' not in printer.toolhead.homed_axes %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    G90
    G1 Y261 F6000
    G1 X205 F6000
    CFS_CUT_UNLOAD SLOT={active} CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    _CFS_COOL_WIPE
    RESPOND MSG="Slot {active} unloaded"

# A K2 without a CFS (cfs_fitted: False) feeds one filament from the rear
# spool holder. START_PRINT primes it at the chute; LOAD_FILAMENT and
# UNLOAD_FILAMENT (Mainsail shows them as Load/Unload buttons on the extruder
# panel) load and unload it, idle or from a runout pause. Slot E's filament
# record (the external spool) is used for this spool when set.
# Stop before homing or heating when the CFS is fitted but did not answer at
# startup and still does not (unplugged, no power), instead of at the CFS step
[gcode_macro _CFS_CHECK]
gcode:
    {% set cfs = printer.k2_cfs %}
    {% if cfs.fitted and cfs.detected == False and not cfs.online %}
        { action_raise_error("The CFS is not answering. Check its cable and power, then restart. If this printer has no CFS, add cfs_fitted: False under [k2_cfs] in printer-overrides.cfg and restart.") }
    {% endif %}

[gcode_macro _SPOOL_PRINT_START]
gcode:
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("No filament at the toolhead. Load the rear spool with LOAD_FILAMENT, then start the print again.") }
    {% endif %}
    # At the chute and at print temperature (START_PRINT): push out what
    # sat in the hot zone, then the usual cool-wipe and flush follow
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    M83
    G1 E25 F300
    G1 E-2 F1800
    NOZZLE_WIPE CONFIRM=1

[gcode_macro LOAD_FILAMENT]
description: Load filament (rear spool without a CFS; SLOT=A-D with a CFS)
gcode:
    {% set state = printer.print_stats.state %}
    {% if printer.k2_cfs.fitted %}
        {% if not params.SLOT %}
            { action_raise_error("This printer loads from the CFS: LOAD_FILAMENT SLOT=A-D, or use the CFS panel") }
        {% endif %}
        CFS_LOAD_SLOT SLOT={params.SLOT}
    {% else %}
        {% set slots = printer.hark_cfs_slots.slots %}
        {% set rec_t = (slots.E.nozzle_temp if 'E' in slots and slots.E.loaded else 0)|int %}
        {% set target = printer.extruder.target|float %}
        {% set temp = params.TEMP|default(target if target >= 180 else (rec_t if rec_t >= 180 else 220))|float %}
        {% if state == "printing" %}
            { action_raise_error("LOAD_FILAMENT: pause the print first") }
        {% endif %}
        {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
            { action_raise_error("Push the filament in from the rear spool holder until it stops at the extruder, then run LOAD_FILAMENT again") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}
        _CFS_SAFE_Z
        CFS_PURGE_POSITION CONFIRM=1
        M109 S{temp}
        M83
        # Slowly at first so the gears grip, then purge the old colour out
        G1 E40 F120
        G1 E{params.PURGE|default(50)|float} F300
        G1 E-1 F1800
        NOZZLE_WIPE CONFIRM=1
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
        {% if state != "paused" and printer["gcode_macro _PA_AUTO"].on_load|int %}
            _PA_AUTO SLOT=E
        {% endif %}
        {% if state != "paused" %}
            _CFS_COOL_WIPE
        {% endif %}
        RESPOND MSG="Filament loaded{' : RESUME when ready' if state == 'paused' else ''}"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (rear spool without a CFS; the loaded slot with a CFS)
gcode:
    {% set state = printer.print_stats.state %}
    {% if printer.k2_cfs.fitted %}
        CFS_UNLOAD_ACTIVE
    {% else %}
        {% set c = printer.configfile.settings.k2_cfs %}
        {% set slots = printer.hark_cfs_slots.slots %}
        {% set rec_t = (slots.E.nozzle_temp if 'E' in slots and slots.E.loaded else 0)|int %}
        {% set target = printer.extruder.target|float %}
        {% set temp = params.TEMP|default(target if target >= 180 else (rec_t if rec_t >= 180 else 220))|float %}
        {% set accel = printer.toolhead.max_accel|float %}
        {% if state == "printing" %}
            { action_raise_error("UNLOAD_FILAMENT: pause the print first") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}
        _CFS_SAFE_Z
        CFS_PURGE_POSITION CONFIRM=1
        M109 S{temp}
        # The CFS unload's cut (k2_cfs CFS_CUT_UNLOAD): small retract, knife
        # at the cutter, tip shaping, then pull the cut end out of the gears.
        # The runout switch would see this as a runout: off until the load.
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
        M83
        G1 E-{c.cutter_retract_length} F{c.cutter_retract_speed * 60}
        G90
        G1 Y{c.cutter_y} F{c.cutter_speed * 60}
        G1 X{c.cutter_x} F{c.cutter_speed * 60}
        M400
        SET_VELOCITY_LIMIT ACCEL={c.cutter_ram_accel}
        G1 X{c.cutter_cut_x} Y{c.cutter_y} F{c.cutter_ram_speed * 60}
        G1 X{c.cutter_release_x} Y{c.cutter_y} F{c.cutter_release_speed * 60}
        M400
        SET_VELOCITY_LIMIT ACCEL={accel}
        M83
        G1 E-{c.cutter_retract_length} F{c.cutter_retract_speed * 60}
        G1 E{c.cutter_tip_length} F{c.cutter_tip_push_speed * 60}
        G1 E-{c.cutter_tip_length} F{c.cutter_tip_pull_speed * 60}
        {% for i in range(3) %}
            G1 E-{c.unload_pull_length} F{c.unload_pull_speed * 60}
        {% endfor %}
        G1 E-10 F{c.unload_pull_speed * 60}
        M400
        CFS_PURGE_POSITION CONFIRM=1
        {% if state != "paused" %}
            _CFS_COOL_WIPE
        {% endif %}
        RESPOND MSG="Filament cut and released: pull it out from the back"
    {% endif %}



# Pressure advance from nozzle force: stream the strain gauge while the
# nozzle steps between slow and fast flow over the purge chute at a range
# of PA values (CNC Kitchen PATuner method). The gauge only arrives in
# 50 ms windows, so each PA value repeats the step CYCLES times and the
# analysis overlays them. The printer analyses the log itself;
# AUTO=1 also saves a result that passes its quality checks to the slot.
# pa_cal_fetch.sh on the Mac adds diagnostic plots.
[pa_pressure_log]

[gcode_macro PA_CAL_RUN]
description: Log nozzle pressure over the chute at a range of PA values
gcode:
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set slot = (params.SLOT|default(printer.k2_cfs.active_slot or ("" if printer.k2_cfs.fitted else "E")))|upper %}
    {% set default_temp = slots[slot].nozzle_temp if slot and slot in slots else 220 %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set ks = (params.KS|default("0.02,0.04,0.06,0.08,0.10,0.12,0.14")).split(",") %}
    {% set slow = params.SLOW|default(2)|float %}
    {% set fast = params.FAST|default(12)|float %}
    {% set v = params.SPEED|default(40)|float %}
    {% set xa = params.XA|default(113)|float %}
    {% set xb = params.XB|default(127)|float %}
    {% set name = params.NAME|default("pa_cal_" ~ (slot or "x")) %}
    {% set auto = params.AUTO|default(0)|int %}
    {% set cycles = params.CYCLES|default(8)|int %}
    {% set t_seg = (xb - xa)|abs / v %}
    {% set e_slow = slow / 2.405 * t_seg %}
    {% set e_fast = fast / 2.405 * t_seg %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("PA_CAL_RUN is only for when nothing is printing") }
    {% endif %}
    {% if not slot %}
        { action_raise_error("PA_CAL_RUN needs SLOT=A-D, or E for the external spool (the slot loaded in the nozzle)") }
    {% endif %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("PA_CAL_RUN needs filament loaded (%s first)" % ("CFS_LOAD_SLOT" if printer.k2_cfs.fitted else "LOAD_FILAMENT")) }
    {% endif %}
    # Everything happens over the chute, so Z is never probed (the bed may
    # still hold a part, the nozzle may be crusted): Z comes from the bottom
    # switch when unknown, then X/Y are homed
    {% set homed = printer.toolhead.homed_axes %}
    {% set uz = 0 %}
    {% if 'z' not in homed %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    M106 S0
    G90
    M83
    G1 X{xa} F6000
    # Feed from the CFS as a print does; without it the extruder drags the
    # filament off the spool against the take-up and slips at full flow
    CFS_FEED_START SLOT={slot} CONFIRM=1
    G1 E15 F300
    # Unlogged warm-up so the melt has settled before the first PA value
    {% for c in range(2) %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_fast} F{v * 60}
        {% endfor %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
        {% endfor %}
    {% endfor %}
    G4 P2000
    SET_PRESSURE_ADVANCE ADVANCE=0
    PA_LOG_START
    G4 P1000
    PA_LOG_MARK LABEL=dry
    {% for i in range(6) %}
        G1 X{xb if i % 2 == 0 else xa} F{v * 60}
    {% endfor %}
    G4 P1500
    {% for k in ks %}
        SET_PRESSURE_ADVANCE ADVANCE={k}
        G4 P1500
        PA_LOG_MARK LABEL=k{k}
        {% for c in range(cycles) %}
            {% for i in range(4) %}
                G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
            {% endfor %}
            {% for i in range(4) %}
                G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_fast} F{v * 60}
            {% endfor %}
        {% endfor %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
        {% endfor %}
        PA_LOG_MARK LABEL=end{k}
        G4 P1500
    {% endfor %}
    PA_LOG_STOP NAME={name}
    M104 S0
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    PA_CAL_ANALYZE NAME={name} SLOT={slot} SAVE={auto}
    {% if slot %}
        CFS_SLOT_APPLY SLOT={slot}
    {% endif %}
    M106 S255
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    M107

# Pressure advance from nozzle force with the nozzle standing still over the
# chute, the way Bambu's force-sensor printers do it: the extruder steps
# between slow and fast flow (extrude-only moves) and pa_tester fits how fast
# the nozzle pressure follows. Dmitry Butyugin's pa_tester (GPLv3, from his
# Klipper branch ads131m0x-pa) with the K2 gauge as its load cell.
[pa_tester]
force_sensor: pa_pressure_log
# Fit quality limit (pa_tester's default 0.001); PLA's slowing-down steps
# fitted at 0.0011-0.0012 on 10-27 and were rejected
#max_fit_mse: 0.001
# The gauge samples in bursts: 50 ms windows with ~50 ms gaps at slow flow,
# ~5 ms bursts every ~10 ms at fast flow (10-28). Vary each step's length so
# steps land at different points of that cycle, and leave out steps whose
# first 40 ms contain a gap longer than max_start_gap (the start of their
# decay is missing)
segment_jitter: 0.1
max_start_gap: 0.015
slow_flow: 2
high_flow: 10
purge_length: 20
segment_time: 0.5
test_repetitions: 10

[gcode_macro PA_CAL_STATIC]
description: Measure pressure advance with the nozzle still over the chute
gcode:
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set slot = (params.SLOT|default(printer.k2_cfs.active_slot or printer.k2_cfs.feed_slot or ("" if printer.k2_cfs.fitted else "E")))|upper %}
    {% set default_temp = slots[slot].nozzle_temp if slot and slot in slots else 220 %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set method = params.METHOD|default("step_response") %}
    {% set high = params.HIGH_FLOW|default(10)|float %}
    {% set slow = params.SLOW_FLOW|default(2)|float %}
    # Gauge source (0 = MCU processed, 1 = raw ADC), window period and an
    # optional CSV capture for offline analysis, for this run only
    {% set src = params.SRC|default(0)|int %}
    {% set period = params.PERIOD|default(0)|float %}
    {% set capture = params.CAPTURE|default("") %}
    # Slow/fast step pairs; the gauge covers about half the time (it is read
    # back over the bus between 50 ms windows), so more pairs average better
    {% set reps = params.REPS|default(0)|int %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("PA_CAL_STATIC is only for when nothing is printing") }
    {% endif %}
    {% if not slot %}
        { action_raise_error("PA_CAL_STATIC needs SLOT=A-D, or E for the external spool (the slot loaded in the nozzle)") }
    {% endif %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("PA_CAL_STATIC needs filament loaded (%s first)" % ("CFS_LOAD_SLOT" if printer.k2_cfs.fitted else "LOAD_FILAMENT")) }
    {% endif %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'z' not in homed %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    # RUN_SAFE: the heater goes off and the feed stops even if the test fails
    RUN_SAFE RUN=_PA_STATIC_TEST FINALLY=_PA_STATIC_DONE SLOT={slot} METHOD={method} HIGH_FLOW={high} SLOW_FLOW={slow} SRC={src} SAVE={params.SAVE|default(0)|int}{(" PERIOD=%.3f" % period) if period > 0 else ""}{(" CAPTURE=" ~ capture) if capture else ""}{(" REPS=%d" % reps) if reps > 0 else ""}

# The stationary test itself, at the chute with the nozzle hot. SAVE=1 keeps
# a plausible result in the slot's filament record (_PA_STATIC_SAVE).
[gcode_macro _PA_STATIC_TEST]
gcode:
    {% set slot = params.SLOT|upper %}
    {% set src = params.SRC|default(0)|int %}
    {% set reps = params.REPS|default(0)|int %}
    M106 S0
    M83
    CFS_FEED_START SLOT={slot} CONFIRM=1
    G1 E15 F300
    M400
    PA_GAUGE_SETUP SRC={src}{(" PERIOD=" ~ params.PERIOD) if params.PERIOD else ""}{(" CAPTURE=" ~ params.CAPTURE) if params.CAPTURE else ""}
    TEST_PRESSURE_ADVANCE METHOD={params.METHOD|default("step_response")} HIGH_FLOW={params.HIGH_FLOW|default(10)} SLOW_FLOW={params.SLOW_FLOW|default(2)}{(" TEST_REPETITIONS=%d" % reps) if reps > 0 else ""}
    {% if params.SAVE|default(0)|int %}
        _PA_STATIC_SAVE SLOT={slot}
    {% endif %}

# Store the last stationary result in the slot record when it is plausible:
# within min_pa..max_pa, and the speeding-up and slowing-down steps agree
# within max_spread. A result outside that is reported and not used. The
# scale turns the stationary value into the printed one, per material (the
# slot record's type) with scale for the rest. On 10-28 the chevron pattern
# (tools/pa/pa_pattern.py) picked PLA 0.069 for 0.0514 measured (x1.34) and
# PETG 0.077 for 0.068 (x1.13); set them from your own patterns.
[gcode_macro _PA_STATIC_SAVE]
variable_scale: 1.0
variable_scale_material: {}
variable_min_pa: 0.01
variable_max_pa: 0.15
variable_max_spread: 0.05
gcode:
    {% set slot = params.SLOT|upper %}
    {% set v = printer["gcode_macro _PA_STATIC_SAVE"] %}
    {% set pt = printer.pa_tester %}
    {% set measured = pt.last_pressure_advance if 'last_pressure_advance' in pt else none %}
    {% set records = printer.hark_cfs_slots.slots %}
    {% set material = (records[slot].type if slot in records else "")|upper %}
    {% set scale = (v.scale_material[material] if material in v.scale_material else v.scale)|float %}
    {% set pa = (measured * scale) if measured is not none else none %}
    {% set steps = pt.last_measured_pressure_advance if 'last_measured_pressure_advance' in pt else [] %}
    {% set spread = (steps|max - steps|min) if steps|length > 1 else 0 %}
    {% if pa is none %}
        RESPOND TYPE=error MSG="PA calibration for slot {slot} gave no result; the slot keeps its pressure advance"
    {% elif pa < v.min_pa or pa > v.max_pa or spread > v.max_spread %}
        RESPOND TYPE=error MSG="PA calibration for slot {slot}: {'%.4f'|format(pa)} (steps {steps|join(', ')}) looks wrong, not saved"
    {% else %}
        CFS_SLOT_SET SLOT={slot} PA={'%.4f'|format(pa)}
        SET_PRESSURE_ADVANCE ADVANCE={'%.4f'|format(pa)}
        RESPOND MSG="Pressure advance for slot {slot}: {'%.4f'|format(pa)} saved{(' (measured %.4f x %.2f for %s)' % (measured, scale, material or 'this filament')) if scale != 1 else ''}"
    {% endif %}

# After the test, pass or fail: relieve the pressure the test leaves in the
# nozzle (it wept after the wipe on 10-28; at a print start the flush pushes
# this back, PRE=5, as it does the purge's), feed off (unless the caller
# keeps it for a print start) and the slot's settings applied again
[gcode_macro _PA_STATIC_END]
variable_relief: 2
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-{printer["gcode_macro _PA_STATIC_END"].relief} F1800
    {% endif %}
    {% if not params.KEEP_FEED|default(0)|int %}
        CFS_FEED_STOP
        CFS_PRELOAD ENABLE=1
    {% endif %}
    CFS_SLOT_APPLY SLOT={params.SLOT|upper}

[gcode_macro _PA_STATIC_DONE]
gcode:
    M104 S0
    _PA_STATIC_END SLOT={params.SLOT}
    M106 S255
    NOZZLE_WIPE CONFIRM=1
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1
    M107

# Automatic pressure advance: measure it (stationary, about 90 s) every time
# a slot is loaded, and save a plausible result to the slot. A failed
# measurement is reported and the load carries on. Off by default.
#   on_load: CFS_LOAD_SLOT and LOAD_FILAMENT (idle)
#   on_print_start: a print start that loads a different slot
# Not during a print (tool changes, runout refills).
[gcode_macro _PA_AUTO]
variable_on_load: 0
variable_on_print_start: 0
gcode:
    {% set slot = params.SLOT|upper %}
    RESPOND MSG="Measuring pressure advance for slot {slot} (about 90 s)"
    CFS_PURGE_POSITION CONFIRM=1
    RUN_SAFE RUN=_PA_STATIC_TEST FINALLY=_PA_STATIC_END ON_ERROR=report SLOT={slot} SAVE=1 KEEP_FEED={params.KEEP_FEED|default(0)|int}
    NOZZLE_WIPE CONFIRM=1
