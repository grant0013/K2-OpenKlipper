# Creality Hi (F018) - upstream Klipper configuration, BENCH BUILD
#
# Hand-written from Creality's Hi 1.1.0.79 configuration (printer.cfg,
# sensorless.cfg, motor_control.cfg, box.cfg, gcode_macro.cfg) and the K2
# OpenKlipper modules. Nothing here has run on a Hi yet: docs/HI-FIRST-RUN.md
# checks each part on its own before anything prints.
#
# What is different from the K2:
#   - cartesian bed-slinger, X -19..285, Y -7..273
#   - X/Y closed-loop motors on the same RS485 bus (0x81 / 0x82, same wake
#     levels as the K2), open-loop extruder on a TMC2208, no motor bus E
#   - X homes on the probe line: the nozzle MCU copies the X stall line
#     (PB0) onto PA15 -> main PC7 while X homes (hi_io_remap, HI_HOME_X)
#   - two Z motors on TMC2208 with optical switches at the TOP of Z (PB15,
#     PB14). k2_z_align drives both to them (the "bottom reference" on the
#     K2 is the far end from the nozzle, here the top), which also levels
#     the gantry, then the strain gauge taps the bed
#   - three MCUs: mcu (main), nozzle_mcu, bed_mcu (Y accelerometer)
#   - no CFS support in this build (box.cfg, filament_rack not ported)
#
# Pins and values come from the stock files unless a comment says otherwise.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 12000
minimum_cruise_ratio: 0.0  # stock runs accel_to_decel = accel
square_corner_velocity: 8.0
max_z_velocity: 20
max_z_accel: 500

# --- X/Y: closed-loop motors driven by step/dir, homed on their stall line

[stepper_x]
step_pin: PB10
dir_pin: !PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
# The X stall line, routed onto PC7 by HI_HOME_X (hi_io_remap). PC7 is also
# the probe line; nothing else may run while the remap is on.
endstop_pin: !PC7
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: -7
position_min: -7
position_max: 273
homing_speed: 100
homing_retract_dist: 10
second_homing_speed: 20

# --- Z: two lead screws (8 mm, 32 microsteps) on TMC2208

[stepper_z]
step_pin: PB4
dir_pin: PA5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# The top switches trigger at Z 301.85 (bench 11-14). 305 leaves
# KZ_ALIGN_MEASURE room to find them; stock allows 310.
position_max: 305
position_min: -5
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[tmc2208 stepper_z]
uart_pin: PC2
interpolate: true
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

[stepper_z1]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8

[tmc2208 stepper_z1]
uart_pin: PA4
interpolate: true
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

# PC7 is both the X endstop (while remapped) and the probe input
[duplicate_pin_override]
pins: PC7

[hi_io_remap]
mcu: nozzle_mcu
src_pin: PB0
remap_pin: PA15
src_pullup: 1
remap_def: 1
filter_count: 1
period_ticks: 0

[z_tilt]
# Stock values (z_positions = points, as Creality ships them)
z_positions:
    40, 130
    220, 130
points:
    40, 130
    220, 130
speed: 200
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

# Top-of-Z optical switches. The MCU drives both Z motors up until each one's
# switch triggers, so the gantry comes back level, and repeats until the two
# agree within retry_tolerance steps (stock: 7 tries, 10 steps of 1.25 um).
[k2_z_align]
allow_motion: true
endstop_pin: PB15, PB14
# Z of the switches above the bed, from KZ_ALIGN_MEASURE. Bench 11-14:
# 304.55 with a cable trapped under the right gantry bar, 301.85 once it was
# freed (both switches; on the Hi the left switch also drives the right
# input). Kept 0.25 mm low: too low is safe (the tap from Z5 searches
# max_probe_descent), too high brings the fast descent down onto the bed.
# Re-measure after any work on the Z switches or the gantry.
position_endstop: 301.6
quick_speed: 20
slow_speed: 5
rising_dist: 5
safe_dist: 15
filter_count: 10
timeout: 30
retract_dist: 10
retract_speed: 10
zd_up: 0
zes_untrig: 0
step_edges: 1
retries: 6
retry_tolerance: 10
# Stock UP_SAFE_Z: before X/Y homing with Z unknown, lift the gantry 15 mm
# (or to the switches) so the nozzle cannot drag across the bed
up_safe_dist: 15

# --- Motor bus (X 0x81, Y 0x82). No closed-loop extruder on the Hi.

[force_move]
enable_force_move: true

[hark_compat]

[k2_motor_bus]
serial: /dev/ttyS5
baud: 230400
init_motors: True
# Stock Hi motor_control.cfg: motor_x_dir !PB9,1 / motor_x_step PB10,0 /
# motor_y_dir PB7,1 / motor_y_step PB8,0 = the K2's physical levels
wake_pins: PB9=0, PB10=0, PB7=1, PB8=0
bus_motors: x=0x81, y=0x82
# No CFS in this build
cfs_detect: False
# MOTOR_CALIBRATE (electrical offset) on request; see docs/MOTOR-CONTROLLER.md
calibration: True

# --- Extruder: open loop on a TMC2208

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 80
max_extrude_only_distance: 1000.0
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04
control: pid
pid_kp: 23.565
pid_ki: 1.765
pid_kd: 78.646
min_temp: 0
min_extrude_temp: 170
max_temp: 320

[tmc2208 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
interpolate: false
run_current: 0.37
sense_resistor: 0.3
stealthchop_threshold: 0

[verify_heater extruder]

# --- Bed

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
# Stock caps the bed at 0.75 on 220-240 V mains (SAVE_CONFIG on this
# printer). On 110 V stock uses 1.0.
max_power: 0.75
control: pid
pid_kp: 20
pid_ki: 0.1
pid_kd: 0.06
min_temp: 0
max_temp: 115
# Stock corrects the bed reading (adc 53 = 50 C, 69 = 65, 108 = 110);
# mainline has no such table, so the bed runs a few degrees warmer than the
# number shown. PID_CALIBRATE HEATER=heater_bed TARGET=60 on the first run.

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# No [temperature_sensor mcu_temp]: mainline's temperature_mcu does not know
# the GD32F303 ("MCU temperature not supported on gd32f303xe", bench 11-14)

# --- Fans

# Part fan: PWM on nozzle PA11 (inverted, 25 kHz software PWM) with its
# power switched by nozzle PB6. Stock never runs it below 51/255.
[fan]
pin: !nozzle_mcu:PA11
enable_pin: nozzle_mcu:PB6
cycle_time: 0.00004
hardware_pwm: false
off_below: 0.20
kick_start_time: 0.3
shutdown_speed: 0

[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
heater: extruder
fan_speed: 1.0
heater_temp: 50.0

# Mainboard fan: kept exactly as stock (an output pin left at 0 on an
# inverted pin). Which level runs it is not known yet: check it is spinning
# on the first run (docs/HI-FIRST-RUN.md step 2).
[output_pin board_fan]
pin: !PA0
value: 0

# Logo light
[output_pin LED]
pin: nozzle_mcu:PB12
value: 1

# --- Filament

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !nozzle_mcu:PB15
debounce_delay: 1.0

# --- Accelerometers (old lis2dw protocol, like the K2 and K2 Plus)

[lis2dw_k2 x]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[lis2dw_k2 y]
cs_pin: bed_mcu:PA4
spi_speed: 5000000
axes_map: y,x,z
spi_software_sclk_pin: bed_mcu:PA5
spi_software_mosi_pin: bed_mcu:PA7
spi_software_miso_pin: bed_mcu:PA6

[resonance_tester]
accel_chip_x: lis2dw_k2 x
accel_chip_y: lis2dw_k2 y
max_freq: 90
accel_per_hz: 75
probe_points:
    130, 130, 100

# Stock SHAPER_CALIBRATE on this printer 14 Nov 2026, before the bed wheels
# were tightened: run SHAPER_CALIBRATE again.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 46.8
shaper_type_y: mzv
shaper_freq_y: 36.0

# --- Strain-gauge probe: same MCU commands and pins as the K2 (PA15 -> PC7)

[prtouch_mainline]
z_offset: 0
speed: 0.75
lift_speed: 5
samples: 1
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.5
home_samples: 1
home_start_z: 5
home_samples_tolerance: 0.10
home_settle_time: 0.5
home_followup_guard: 0.5
home_max_touches: 0
home_allowed_noisy: 0
probe_settle_time: 0.75
# The Hi's gantry comes off the top switches up to ~1.1 mm out of level
# (bench 11-14: X40 +0.28, X220 -0.80 before Z_TILT_ADJUST), and stock's
# mesh on this bed spans +0.56 to -1.02, so the K2's limits (+0.45 / -0.60)
# are too tight. Taps beyond these still stop: they are the blob and
# no-trigger guards.
probe_arm_below_z: 1.0
probe_plane_check: True
probe_plane_retries: 1
probe_minimum_z: -1.50
probe_tap_samples: 1
probe_tap_tolerance: 0.10
probe_tap_max_touches: 0
probe_tap_allowed_noisy: 0
probe_no_trigger_retries: 0
probe_no_trigger_retry_max_distance: 2.0
# Stock NOZ_CLEAR strip: clear_start 148,266, clear_lenght 14,2
scrub_x_start: 148
scrub_x_end: 162
scrub_y_min: 265
scrub_y_max: 267
pres_arm_checks: True
pres_release_timeout: 0.25
probe_fail_dump: True
probe_contact_threshold: 600
probe_contact_polls: 3
probe_max_window_p2p: 100000
probe_contact_mode: amplitude
mesh_guard_enabled: True
mesh_guard_residual: 0.08
mesh_guard_samples: 2
mesh_guard_max_points: 6
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
pres_cfg_regs: 60
prth_msg_show: true
host_probe_warmup_polls: 8
host_probe_period_ms: 80
# Stock searches 16 mm; the K2 uses 6 from Z5. 6.5 leaves room for the
# rough switch height above until KZ_ALIGN_MEASURE pins it down.
max_probe_descent: 6.5
host_probe_failure_retract: 2
host_probe_contact_threshold: 600
host_probe_contact_release_ratio: 0.75
host_probe_contact_polls: 2
# Stock Hi uses prth_tmp_comp 26,300,0,0.20 (meaning not decoded). The
# first-layer correction is START_PRINT's hot_z_comp instead.
enable_not_linear_comp: false
prth_max_chps: 8
prth_tri_zacc: 100
prth_min_fans: 0.65
need_steady_regional: 0.8
horizontal_move_z_quick: 1

[bed_mesh]
speed: 150
mesh_min: 10, 10
mesh_max: 250, 250
probe_count: 9, 9
mesh_pps: 2, 2
fade_start: 5
fade_end: 50
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 2
adaptive_margin: 5
split_delta_z: 0.01
move_check_distance: 3

# --- Housekeeping

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[gcode_arcs]
resolution: 0.1

[pause_resume]

[display_status]

[exclude_object]

[respond]

[hark_safe_run]

[hark_macro_reload]

[hark_pid_profiles]

[hark_mesh_check]

[hark_cpu]

# Fan failure pauses, an X/Y motor fault cancels (the stock motor_control
# behaviour). Fans without a tachometer in this config are not watched.
[hark_safety]

# --- Homing

# X/Y home on their motors' stall lines (one-shot: armed just before each
# axis, disarmed after). With Z unknown, stock lifts the gantry 15 mm first;
# Z then comes from the top switches (which also level the gantry) and the
# strain-gauge tap at the bed centre.
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}
    {% if 'Z' in params and not home_all
          and ('x' not in printer.toolhead.homed_axes
               or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("Home X and Y before requesting Z-only homing") }
    {% endif %}
    {% if not printer.k2_motor_bus.motors_ready %}
        { action_raise_error("The X/Y motors did not wake up (see k2_motor_bus in klippy.log). Run MOTOR_INIT, or restart the printer.") }
    {% endif %}

    # Clearance before X/Y move: lift the gantry once when nothing is homed
    # (stock lifts once per session: G28 X then G28 Y must not lift twice),
    # or keep 5 mm when Z is known. X/Y homed with Z unknown (a failed tap)
    # gets neither: the gantry was lifted earlier this session.
    {% if printer.toolhead.homed_axes == "" %}
        KZ_ALIGN_UP_SAFE CONFIRM=1
    {% elif z_was_homed and printer.toolhead.position.z|float < 5.0 %}
        G90
        G1 Z5 F600
        M400
    {% endif %}

    M204 S500

    {% if home_all or 'X' in params %}
        MOTOR_STALL_MODE DATA=1
        HI_HOME_X
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 X19 F12000
        G90
    {% endif %}

    {% if home_all or 'Y' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 Y
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 Y10 F9000
        G90
    {% endif %}

    {% if home_z %}
        G90
        G1 X130 Y130 F12000
        {% if not z_was_homed %}
            # Both Z motors to the top switches: known Z, level gantry
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        G1 Z5 F1200
        M400
        G4 P1000
        M204 S12000
        PRTOUCH_HOME_Z PROBE_SPEED=1
        G1 Z5 F600
        M400
    {% endif %}

    M204 S12000

# --- Nozzle cleaning and purge (stock box.cfg positions)

# Teflon wiper: stock wipes between X0 and X-5 at Y130
[gcode_macro HI_WIPE]
description: Wipe the nozzle on the Teflon wiper at the left (stock positions)
variable_x_left: 0
variable_x_right: -5
variable_y: 130
variable_passes: 3
gcode:
    {% set w = printer["gcode_macro HI_WIPE"] %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("HI_WIPE: home X and Y first") }
    {% endif %}
    G90
    G1 X{w.x_left} Y{w.y} F12000
    {% for i in range(w.passes|int) %}
        G1 X{w.x_right} F12000
        G1 X{w.x_left} F12000
    {% endfor %}

# Purge over the chute (stock extrude_pos -18.5,130): Creality's flush
# block as on the K2 (five fast pushes, each followed by a 1 mm/s pause, so
# the strand comes out in beads that drop), a full-fan blast so the last of
# it sets and snaps off, a retract, then the wipe. PRE pushes back an
# earlier retraction first.
[gcode_macro HI_PURGE]
description: Purge LENGTH mm over the chute, blast, retract and wipe
variable_x: -18.5
variable_y: 130
gcode:
    {% set p = printer["gcode_macro HI_PURGE"] %}
    {% set length = params.LENGTH|default(30)|float %}
    {% set pre = params.PRE|default(0)|float %}
    {% set speed = params.SPEED|default(5)|float %}
    {% set retract = params.RETRACT|default(1)|float %}
    {% if printer.extruder.temperature < 170 %}
        { action_raise_error("HI_PURGE: heat the nozzle first") }
    {% endif %}
    G90
    G1 X{p.x} Y{p.y} F12000
    M400
    M83
    M106 S30
    G1 E{"%.3f"|format(length * 0.18 + pre)} F{speed * 60}
    G1 E{"%.3f"|format(length * 0.02)} F60
    {% for pulse in range(4) %}
        G1 E{"%.3f"|format(length * 0.18)} F{speed * 60}
        G1 E{"%.3f"|format(length * 0.02)} F60
    {% endfor %}
    M400
    M106 S255
    G4 P4000
    M107
    G1 E-{retract} F1800
    HI_WIPE

# Rear-strip nozzle clean: a step-for-step port of Creality's NOZ_CLEAR
# (klippy/extras/nozzle_clear.py as installed on the Hi 1.1.0.79, with this
# printer's [nozzle_clear]: start_pos 98,266, touch_cnt 3, clear_start
# 148,266, probe_pos_diff 0,0, clear_lenght 14,2, upraise 0.2, clear_cnt 10,
# clear_temp 170, enable_clear true, and the module defaults clear_speed
# 6000, start_clear_temp 175, pumpback_mm 3, closure_temp 120):
#   1. Z home on the strip at start_pos (moved 0-3 mm each time, as stock)
#   2. heat to 175, retract 3 mm, 10 touches stepping right along the strip
#      (3 x 3, X+2 between, X+3 between groups, Z+3 lift) to squash the ooze
#   3. fan half, cool to 170, heater off, fan off; re-zero at X128; drag to
#      X148, 0.2 mm up, 10 rounds of a 14 x 2 mm rectangle at F6000
#   4. re-zero at X128 and cool there to 120 with the fan on (seals the tip)
# Only difference: stock touches at 15 mm/s because its MCU decides
# contact; ours is checked by the host every 80 ms, so it touches at the
# normal probe speed (0.75 mm/s) instead of pressing ~1 mm into the strip.
# Leaves the Z frame on the strip (as stock): G28 Z afterwards.
[gcode_macro NOZZLE_CLEAR]
description: Creality's NOZ_CLEAR: squash, scrub and seal on the rear strip
variable_start_x: 98
variable_start_y: 266
variable_touch_cnt: 3
variable_start_clear_temp: 175
variable_pumpback: 3
gcode:
    {% set n = printer["gcode_macro NOZZLE_CLEAR"] %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes
          or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("NOZZLE_CLEAR needs X, Y and Z homed (G28)") }
    {% endif %}
    # Stock moves the start point 0-3 mm each time (random.uniform)
    {% set t = printer.toolhead.estimated_print_time|float %}
    {% set dx = (t * 7.31) % 3 %}
    {% set dy = (t * 3.17) % 3 %}
    {% set sx = n.start_x - dy %}
    {% set sy = n.start_y + dx %}
    M204 S10000
    M104 S0
    M107
    BED_MESH_CLEAR
    G90
    G1 Z5 F600
    G1 X{sx} Y{sy} F12000
    M400
    # Stock ZHOME: Z zero on the strip. Stock searches down from far above;
    # ours searches from START_Z to the -1.5 probe floor, and the strip sits
    # 1-2 mm below the bed (whose rear is ~0.5 low), so claim 3 mm more
    # height first: the search then reaches ~4.5 mm below the bed plane.
    SET_KINEMATIC_POSITION Z=8
    PRTOUCH_HOME_Z PROBE_SPEED=1 START_Z=8
    G90
    G1 Z10 F3000
    G1 X{sx} Y{sy} F18000
    M109 S{n.start_clear_temp}
    M83
    G1 E-{n.pumpback} F1800
    G91
    G1 X2 F6000
    {% for cnt in range(n.touch_cnt|int) %}
        {% for cnt2 in range(3) %}
            G90
            PROBE
            G91
            {% if cnt2 == 2 %}
                G1 X2 F6000
            {% endif %}
            G1 Z3 X2 F3000
        {% endfor %}
        G91
        G1 X3 F6000
    {% endfor %}
    G90
    PROBE
    _NOZZLE_CLEAR_SCRUB

[gcode_macro _NOZZLE_CLEAR_SCRUB]
variable_clear_x: 148
variable_clear_y: 266
variable_diff_x: 0
variable_diff_y: 0
variable_len_x: 14
variable_len_y: 2
variable_upraise: 0.2
variable_clear_cnt: 10
variable_clear_temp: 170
variable_clear_speed: 6000
variable_closure_temp: 120
gcode:
    {% set s = printer["gcode_macro _NOZZLE_CLEAR_SCRUB"] %}
    {% set f = s.clear_speed|float %}
    # Coarse wipe (stock "粗擦")
    G90
    M106 S127
    M109 S{s.clear_temp}
    M104 S0
    M107
    G1 Z3 F300
    G1 X{s.clear_x - 20} Y{s.clear_y} F{f}
    PROBE
    SET_KINEMATIC_POSITION Z=0
    G1 X{s.clear_x} Y{s.clear_y} F{f}
    G91
    {% if s.diff_x|float != 0 or s.diff_y|float != 0 %}
        G1 X{s.diff_x} Y{s.diff_y} F{f}
    {% endif %}
    G1 Z{s.upraise} F300
    G1 F{f}
    {% for i in range(s.clear_cnt|int) %}
        G1 X{s.len_x}
        G1 Y{s.len_y}
        G1 X{0 - s.len_x|float}
        G1 Y{0 - s.len_y|float}
    {% endfor %}
    G1 Z5 F300
    G90
    G1 X{s.clear_x - 20} Y{s.clear_y} F{f}
    PROBE
    SET_KINEMATIC_POSITION Z=0
    # Seal: cool to 120 on the strip with the fan on (stock "封嘴冷却")
    M106 S127
    M109 S{s.closure_temp}
    M107
    G90
    G1 Z10 F300
    G1 X130 Y130 Z10 F6000
    M400
    RESPOND MSG="Nozzle cleaned on the strip (Creality NOZ_CLEAR sequence)"

# --- Print start / end

[gcode_macro START_PRINT]
description: Heat, home, level the gantry, mesh, purge
# First-layer height correction (mm, positive lowers the nozzle). Z is
# tapped at 140 C and the print runs hotter. Tune on the first run with the
# first-layer test (docs/HI-FIRST-RUN.md step 9); the K2 settled on 0.02-0.04.
variable_hot_z_comp: 0.0
# YOUR first-layer adjustment, like Creality's Z offset: negative = nozzle
# closer to the bed
variable_z_offset: 0
# Scrub the nozzle on the rear strip before measuring Z (stock NOZ_CLEAR)
variable_nozzle_clear: 1
# Probe both sides and level the gantry on every print (stock relies on the
# top switches only)
variable_z_tilt: 1
# Adaptive mesh over the print area
variable_adaptive_mesh: 1
# Still homed from the last print: skip the switch trip and X/Y homing
variable_warm_start: True
variable_warm_ready: 0
gcode:
    CLEAR_PAUSE
    {% set sp = printer["gcode_macro START_PRINT"] %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|float %}
    {% set warm = sp.warm_start|string|lower in ("true", "1")
                  and sp.warm_ready|int == 1
                  and printer.toolhead.homed_axes == "xyz"
                  and printer.k2_motor_bus.motors_ready %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=0
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    M107
    M140 S{bed_temp}
    M104 S140
    {% if warm %}
        RESPOND MSG="Warm start: X/Y homed from the last print"
        G28 Z
    {% else %}
        G28
    {% endif %}
    {% if sp.nozzle_clear|int %}
        # Stock order: strip clean while the bed heats, then measure Z with
        # the clean nozzle (ooze on the tip fakes contact)
        NOZZLE_CLEAR
        G28 Z
    {% endif %}
    RESPOND MSG="Heating the bed"
    M190 S{bed_temp}
    M109 S140
    {% if sp.z_tilt|int %}
        Z_TILT_ADJUST
        G28 Z
    {% endif %}
    {% if sp.adaptive_mesh|int %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    {% set offset = 0.0 - sp.hot_z_comp|float + sp.z_offset|float %}
    SET_GCODE_OFFSET Z={offset}
    RESPOND MSG="Heating the nozzle to {extruder_temp|int} C"
    # Stock end of START_PRINT: to the corner at Z3, heat over the chute
    # (BOX_GO_TO_EXTRUDE_POS) so the ooze drops there, then wipe it off
    # (3 passes). The slicer's prime line follows.
    G90
    G1 X0 Y0 Z3 F12000
    M104 S{extruder_temp}
    G1 X-18.5 Y130 F12000
    M109 S{extruder_temp}
    HI_WIPE
    M220 S100
    M221 S100
    G21
    M83
    G92 E0

[gcode_macro END_PRINT]
description: Retract, present the bed, heaters and fans off (motors stay on)
gcode:
    {% set z = printer.toolhead.position.z|float %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    M400
    M83
    {% if printer.extruder.can_extrude %}
        G1 E-2 F2400
    {% endif %}
    G91
    G1 Z{[10, zmax - z]|min} F1200
    G90
    G1 X130 Y260 F12000
    M104 S0
    M140 S0
    M107
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=1
    M400

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    END_PRINT

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Already paused"
    {% else %}
        {% set z = printer.toolhead.position.z|float %}
        {% set zmax = printer.toolhead.axis_maximum.z|float %}
        PAUSE_BASE
        M83
        {% if printer.extruder.can_extrude %}
            G1 E-1 F2400
        {% endif %}
        G91
        G1 Z{[10, zmax - z]|min} F1200
        G90
        G1 X-5 Y130 F12000
        M400
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Not paused"
    {% else %}
        {% if printer.extruder.temperature < 170 %}
            { action_raise_error("RESUME: heat the nozzle to print temperature first") }
        {% endif %}
        HI_WIPE
        M83
        G1 E1 F2400
        RESUME_BASE
    {% endif %}

# Creality Print / Orca send M106 P1 / P2 for fans the Hi does not have
[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% if params.P is not defined or params.P|int == 0 %}
        M106.1 S{params.S|default(255)}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% if params.P is not defined or params.P|int == 0 %}
        M107.1
    {% endif %}

# --- Filament load / unload (at the chute)

[gcode_macro LOAD_FILAMENT]
description: Heat, feed and purge new filament at the chute
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    G1 X-18.5 Y130 F12000
    M109 S{temp}
    M83
    G1 E60 F300
    HI_PURGE LENGTH=30
    M104 S0

[gcode_macro UNLOAD_FILAMENT]
description: Heat, tip-form and pull the filament out of the extruder
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    G1 X-18.5 Y130 F12000
    M109 S{temp}
    M83
    G1 E5 F300
    G1 E-15 F2400
    G4 P2000
    G1 E-60 F1200
    M104 S0
    RESPOND MSG="Pull the filament out of the toolhead now"
