# Creality Hi (F018) - upstream Klipper configuration, BENCH BUILD
#
# Hand-written from Creality's Hi 1.1.0.79 configuration (printer.cfg,
# sensorless.cfg, motor_control.cfg, box.cfg, gcode_macro.cfg) and the K2
# OpenKlipper modules. Nothing here has run on a Hi yet: docs/HI-FIRST-RUN.md
# checks each part on its own before anything prints.
#
# What is different from the K2:
#   - cartesian bed-slinger, X -19..285, Y -7..273
#   - X/Y closed-loop motors on the same RS485 bus (0x81 / 0x82, same wake
#     levels as the K2), open-loop extruder on a TMC2208, no motor bus E
#   - X homes on the probe line: the nozzle MCU copies the X stall line
#     (PB0) onto PA15 -> main PC7 while X homes (hi_io_remap, HI_HOME_X)
#   - two Z motors on TMC2208 with optical switches at the TOP of Z (PB15,
#     PB14). k2_z_align drives both to them (the "bottom reference" on the
#     K2 is the far end from the nozzle, here the top), which also levels
#     the gantry, then the strain gauge taps the bed
#   - three MCUs: mcu (main), nozzle_mcu, bed_mcu (Y accelerometer)
#   - CFS: load, cut/unload, purge and print start ported 16 Nov 2026
#     ([k2_cfs] below: cutter on the right, chute on the left); filament_rack
#     and mid-print colour changes are not bench-proven yet
#
# Pins and values come from the stock files unless a comment says otherwise.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 12000
minimum_cruise_ratio: 0.0  # stock runs accel_to_decel = accel
square_corner_velocity: 8.0
max_z_velocity: 20
max_z_accel: 500
# The bed (Y) is heavy: at 12000 mm/s^2 (stock) its stops shift the whole
# printer (Grant, 15 Nov 2026). Cap only the bed; X keeps max_accel. 2500 is
# just above the Y shaper's limit (mzv 30.4 Hz: <= 2300). Change it live with
# SET_KINEMATICS_LIMIT Y_ACCEL=..., or for good in printer-overrides.cfg.
max_y_accel: 2500

# --- X/Y: closed-loop motors driven by step/dir, homed on their stall line

[stepper_x]
step_pin: PB10
dir_pin: !PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
# The X stall line, routed onto PC7 by HI_HOME_X (hi_io_remap). PC7 is also
# the probe line; nothing else may run while the remap is on.
endstop_pin: !PC7
position_endstop: -19
position_min: -19
position_max: 285
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: -7
position_min: -7
position_max: 273
# Stock 100 / 20. Halved (Grant, 15 Nov 2026): the bed is heavy and the
# stall stop at 100 mm/s hit hard enough to shift the printer.
homing_speed: 50
homing_retract_dist: 10
second_homing_speed: 10

# --- Z: two lead screws (8 mm, 32 microsteps) on TMC2208

[stepper_z]
step_pin: PB4
dir_pin: PA5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# The top switches trigger at Z 301.85 (bench 11-14). 305 leaves
# KZ_ALIGN_MEASURE room to find them; stock allows 310.
position_max: 305
position_min: -5
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[tmc2208 stepper_z]
uart_pin: PC2
interpolate: true
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

[stepper_z1]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8

[tmc2208 stepper_z1]
uart_pin: PA4
interpolate: true
run_current: 0.51
sense_resistor: 0.10
stealthchop_threshold: 999999999

# PC7 is both the X endstop (while remapped) and the probe input
[duplicate_pin_override]
pins: PC7

[hi_io_remap]
mcu: nozzle_mcu
src_pin: PB0
remap_pin: PA15
src_pullup: 1
remap_def: 1
filter_count: 1
period_ticks: 0

[z_tilt]
# Stock values (z_positions = points, as Creality ships them)
z_positions:
    40, 130
    220, 130
points:
    40, 130
    220, 130
speed: 200
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

# Top-of-Z optical switches. The MCU drives both Z motors up until each one's
# switch triggers, so the gantry comes back level, and repeats until the two
# agree within retry_tolerance steps (stock: 7 tries, 10 steps of 1.25 um).
[k2_z_align]
allow_motion: true
endstop_pin: PB15, PB14
# Z of the switches above the bed, from KZ_ALIGN_MEASURE. Bench 11-14:
# 304.55 with a cable trapped under the right gantry bar, 301.85 once it was
# freed (both switches; on the Hi the left switch also drives the right
# input). Kept 0.25 mm low: too low is safe (the tap from Z5 searches
# max_probe_descent), too high brings the fast descent down onto the bed.
# Re-measure after any work on the Z switches or the gantry.
position_endstop: 301.6
# Stock quick 20. Halved (Grant, 15 Nov 2026): the gantry met the top
# switches too hard. A full climb from the bed at 10 mm/s takes ~30 s, so
# the timeout is 60 (stock 30).
quick_speed: 10
slow_speed: 5
rising_dist: 5
safe_dist: 15
filter_count: 10
timeout: 60
retract_dist: 10
retract_speed: 10
zd_up: 0
zes_untrig: 0
step_edges: 1
retries: 6
retry_tolerance: 10
# Stock UP_SAFE_Z: before X/Y homing with Z unknown, lift the gantry 15 mm
# (or to the switches) so the nozzle cannot drag across the bed
up_safe_dist: 15

# --- Motor bus (X 0x81, Y 0x82). No closed-loop extruder on the Hi.

[force_move]
enable_force_move: true

[hark_compat]

[k2_motor_bus]
serial: /dev/ttyS5
baud: 230400
init_motors: True
# Stock Hi motor_control.cfg: motor_x_dir !PB9,1 / motor_x_step PB10,0 /
# motor_y_dir PB7,1 / motor_y_step PB8,0 = the K2's physical levels
wake_pins: PB9=0, PB10=0, PB7=1, PB8=0
bus_motors: x=0x81, y=0x82
# The CFS shares this bus (address 1). Without one plugged in the printer
# feeds from the spool holder as before ([k2_cfs] cfs_fitted: auto).
cfs_detect: True
# MOTOR_CALIBRATE (electrical offset) on request; see docs/MOTOR-CONTROLLER.md
calibration: True

# --- Extruder: open loop on a TMC2208

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 80
max_extrude_only_distance: 1000.0
heater_pin: nozzle_mcu:PB8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04
control: pid
pid_kp: 23.565
pid_ki: 1.765
pid_kd: 78.646
min_temp: 0
min_extrude_temp: 170
max_temp: 320

[tmc2208 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
# Stock false. On (Grant, 15 Nov 2026): 16 microsteps without interpolation
# made the extruder buzz. SpreadCycle kept (no stealthChop on an extruder
# with pressure advance).
interpolate: true
run_current: 0.37
sense_resistor: 0.3
stealthchop_threshold: 0

[verify_heater extruder]

# --- Bed

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
# Stock caps the bed at 0.75 on 220-240 V mains (SAVE_CONFIG on this
# printer). On 110 V stock uses 1.0.
max_power: 0.75
control: pid
pid_kp: 20
pid_ki: 0.1
pid_kd: 0.06
min_temp: 0
max_temp: 115
# Creality's bed correction, as stock 1.1.0.79 (ported to adc_temperature.py):
# the EPCOS table reads this bed high below ~98 C, so stock heats until the
# sensor shows 83 for a real 80 (53 for 50, 69 for 65; 108 is a real 110).
# Without it the bed sat ~3 C below the number shown at 80 (11-14 to 11-15).
temp_offset_flag: True
adc_temp_list: 25,40,53,69,83,108
actual_temp_list: 25,38,50,65,80,110

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# No [temperature_sensor mcu_temp]: mainline's temperature_mcu does not know
# the GD32F303 ("MCU temperature not supported on gd32f303xe", bench 11-14)

# --- Fans

# Part fan: PWM on nozzle PA11 (inverted, 25 kHz software PWM) with its
# power switched by nozzle PB6. Stock never runs it below 51/255.
[fan]
pin: !nozzle_mcu:PA11
enable_pin: nozzle_mcu:PB6
cycle_time: 0.00004
hardware_pwm: false
off_below: 0.20
kick_start_time: 0.3
shutdown_speed: 0

[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
heater: extruder
fan_speed: 1.0
heater_temp: 50.0

# Mainboard fan: kept exactly as stock (an output pin left at 0 on an
# inverted pin). Which level runs it is not known yet: check it is spinning
# on the first run (docs/HI-FIRST-RUN.md step 2).
[output_pin board_fan]
pin: !PA0
value: 0

# Logo light
[output_pin LED]
pin: nozzle_mcu:PB12
value: 1

# --- Filament

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !nozzle_mcu:PB15
debounce_delay: 1.0

# --- Accelerometers (old lis2dw protocol, like the K2 and K2 Plus)

[lis2dw_k2 x]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[lis2dw_k2 y]
cs_pin: bed_mcu:PA4
spi_speed: 5000000
axes_map: y,x,z
spi_software_sclk_pin: bed_mcu:PA5
spi_software_mosi_pin: bed_mcu:PA7
spi_software_miso_pin: bed_mcu:PA6

[resonance_tester]
accel_chip_x: lis2dw_k2 x
accel_chip_y: lis2dw_k2 y
max_freq: 90
accel_per_hz: 75
probe_points:
    130, 130, 100

# Stock SHAPER_CALIBRATE on this printer 14 Nov 2026, before the bed wheels
# were tightened: run SHAPER_CALIBRATE again.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 46.8
shaper_type_y: mzv
shaper_freq_y: 36.0

# --- Strain-gauge probe: same MCU commands and pins as the K2 (PA15 -> PC7)

[prtouch_mainline]
z_offset: 0
speed: 0.75
lift_speed: 5
samples: 1
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.5
home_samples: 1
home_start_z: 5
home_samples_tolerance: 0.10
home_settle_time: 0.5
home_followup_guard: 0.5
home_max_touches: 0
home_allowed_noisy: 0
probe_settle_time: 0.75
# The Hi's gantry comes off the top switches up to ~1.1 mm out of level
# (bench 11-14: X40 +0.28, X220 -0.80 before Z_TILT_ADJUST), and stock's
# mesh on this bed spans +0.56 to -1.02, so the K2's limits (+0.45 / -0.60)
# are too tight. Taps beyond these still stop: they are the blob and
# no-trigger guards.
probe_arm_below_z: 1.0
probe_plane_check: True
probe_plane_retries: 1
probe_minimum_z: -1.50
probe_tap_samples: 1
probe_tap_tolerance: 0.10
probe_tap_max_touches: 0
probe_tap_allowed_noisy: 0
probe_no_trigger_retries: 0
probe_no_trigger_retry_max_distance: 2.0
# Stock NOZ_CLEAR strip: clear_start 148,266, clear_lenght 14,2
scrub_x_start: 148
scrub_x_end: 162
scrub_y_min: 265
scrub_y_max: 267
pres_arm_checks: True
pres_release_timeout: 0.25
probe_fail_dump: True
probe_contact_threshold: 600
probe_contact_polls: 3
probe_max_window_p2p: 100000
probe_contact_mode: amplitude
mesh_guard_enabled: True
mesh_guard_residual: 0.08
mesh_guard_samples: 2
mesh_guard_max_points: 6
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
pres_cfg_regs: 60
prth_msg_show: true
host_probe_warmup_polls: 8
host_probe_period_ms: 80
# Stock searches 16 mm; the K2 uses 6 from Z5. 6.5 leaves room for the
# rough switch height above until KZ_ALIGN_MEASURE pins it down.
max_probe_descent: 6.5
host_probe_failure_retract: 2
host_probe_contact_threshold: 600
host_probe_contact_release_ratio: 0.75
host_probe_contact_polls: 2
# Stock Hi uses prth_tmp_comp 26,300,0,0.20 (meaning not decoded). The
# first-layer correction is START_PRINT's hot_z_comp instead.
enable_not_linear_comp: false
prth_max_chps: 8
prth_tri_zacc: 100
prth_min_fans: 0.65
need_steady_regional: 0.8
horizontal_move_z_quick: 1

[bed_mesh]
speed: 150
mesh_min: 10, 10
mesh_max: 250, 250
probe_count: 9, 9
mesh_pps: 2, 2
fade_start: 5
fade_end: 50
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 2
adaptive_margin: 5
split_delta_z: 0.01
move_check_distance: 3

# --- Housekeeping

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[gcode_arcs]
resolution: 0.1

[pause_resume]

[display_status]

[exclude_object]

[respond]

[hark_safe_run]

[hark_macro_reload]

[hark_pid_profiles]

[hark_mesh_check]

[hark_cpu]

# Fan failure pauses, an X/Y motor fault cancels (the stock motor_control
# behaviour). Fans without a tachometer in this config are not watched.
[hark_safety]

# --- Homing

# X/Y home on their motors' stall lines (one-shot: armed just before each
# axis, disarmed after). With Z unknown, stock lifts the gantry 15 mm first;
# Z then comes from the top switches (which also level the gantry) and the
# strain-gauge tap at the bed centre.
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}
    {% if 'Z' in params and not home_all
          and ('x' not in printer.toolhead.homed_axes
               or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("Home X and Y before requesting Z-only homing") }
    {% endif %}
    {% if not printer.k2_motor_bus.motors_ready %}
        { action_raise_error("The X/Y motors did not wake up (see k2_motor_bus in klippy.log). Run MOTOR_INIT, or restart the printer.") }
    {% endif %}

    # Clearance before X/Y move: lift the gantry once when nothing is homed
    # (stock lifts once per session: G28 X then G28 Y must not lift twice),
    # or keep 5 mm when Z is known. X/Y homed with Z unknown (a failed tap)
    # gets neither: the gantry was lifted earlier this session.
    {% if printer.toolhead.homed_axes == "" %}
        KZ_ALIGN_UP_SAFE CONFIRM=1
    {% elif z_was_homed and printer.toolhead.position.z|float < 5.0 %}
        G90
        G1 Z5 F600
        M400
    {% endif %}

    M204 S500

    {% if home_all or 'X' in params %}
        MOTOR_STALL_MODE DATA=1
        HI_HOME_X
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 X19 F12000
        G90
    {% endif %}

    {% if home_all or 'Y' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 Y
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 Y10 F9000
        G90
    {% endif %}

    {% if home_z %}
        G90
        G1 X130 Y130 F12000
        {% if not z_was_homed %}
            # Both Z motors to the top switches: known Z, level gantry
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        G1 Z5 F1200
        M400
        G4 P1000
        M204 S12000
        PRTOUCH_HOME_Z PROBE_SPEED=1
        G1 Z5 F600
        M400
    {% endif %}

    M204 S12000

# --- Nozzle cleaning and purge (stock box.cfg positions)

# Teflon wiper: stock wipes between X0 and X-5 at Y130
[gcode_macro HI_WIPE]
description: Wipe the nozzle on the Teflon wiper at the left (stock positions)
variable_x_left: 0
variable_x_right: -5
variable_y: 130
variable_passes: 3
gcode:
    {% set w = printer["gcode_macro HI_WIPE"] %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("HI_WIPE: home X and Y first") }
    {% endif %}
    G90
    G1 X{w.x_left} Y{w.y} F12000
    {% for i in range(w.passes|int) %}
        G1 X{w.x_right} F12000
        G1 X{w.x_left} F12000
    {% endfor %}

# Purge over the chute: stock's EXTRUDE_BEFORE_CLEAR (master-server sends it
# after BOX_GO_TO_EXTRUDE_POS and M109, captured 11-14): 60 mm at 3 mm/s,
# then the wipe (stock BOX_NOZZLE_CLEAN), heater off.
[gcode_macro HI_PURGE]
description: Stock purge over the chute (60 mm at 3 mm/s) and wipe
variable_x: -18.5
variable_y: 130
gcode:
    {% set p = printer["gcode_macro HI_PURGE"] %}
    {% set length = params.LENGTH|default(60)|float %}
    {% set feed = params.F|default(180)|float %}
    {% if printer.extruder.temperature < 170 %}
        { action_raise_error("HI_PURGE: heat the nozzle first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=hi_purge
    G90
    G1 X{p.x} Y{p.y} F12000
    G91
    G1 E{length} F{feed}
    M400
    HI_WIPE
    {% if params.HEATER_OFF|default(1)|int %}
        M104 S0
    {% endif %}
    RESTORE_GCODE_STATE NAME=hi_purge

# Strain-gauge pressure advance: stock's AiStrainGaugeFlowPaDetectRun_
# EmptyPrint (captured 11-14) replayed number for number over the chute:
# Auto_strain_gauge_pa_config.gcode (accel 2000, square corner 8, E-.8) then
# Auto_strain_gauge_pa_empty_print.gcode: G91, E5 F2400, G4 P500, and 31
# rounds of SET_PRESSURE_ADVANCE (0.010 + 0.002 n), E-.8/E.8 F2400 with
# 100/50 ms dwells, Y20 E.92643 slow, Y-40 E1.853 fast, Y20 E.92643 slow,
# extruding in the air while the bed moves. Stock takes the speeds from the
# slicer (outer wall 9000, slow a tenth); FAST/SLOW set them here. The raw
# gauge is logged (pa_pressure_log) and HI_PA_COMPUTE runs the Hi's own
# pa_compute on it. PURGE=1 runs stock's purge first, as stock's start
# sequence does. SET=1 applies the result.
[gcode_macro HI_PA_CAL]
description: Creality's strain-gauge PA sweep over the chute, analysed by pa_compute
variable_start: 0.010
variable_step: 0.002
variable_count: 31
gcode:
    {% set c = printer["gcode_macro HI_PA_CAL"] %}
    {% set temp = params.TEMP|default(220)|float %}
    {% set bed = params.BED|default(60)|float %}
    {% set fast = params.FAST|default(9000)|float %}
    {% set slow = params.SLOW|default(fast / 10)|float %}
    {% set material = params.MATERIAL|default("PLA")|upper %}
    {% set start = c.start|float %}
    {% set step = c.step|float %}
    {% set count = c.count|int %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("HI_PA_CAL: home first (G28)") }
    {% endif %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("HI_PA_CAL is not for use during a print") }
    {% endif %}
    {% set old_pa = printer.extruder.pressure_advance %}
    {% set old_accel = printer.toolhead.max_accel %}
    {% set old_scv = printer.toolhead.square_corner_velocity %}
    {% set old_mcr = printer.toolhead.minimum_cruise_ratio %}
    SAVE_GCODE_STATE NAME=hi_pa_cal
    G90
    G1 Z5 F600
    G1 X-18.5 Y130 F12000
    M104 S{temp}
    M140 S{bed}
    # Bed: wait for 'reached', not 'settled' (M190 also waits out an
    # overshoot until it cools back within 1 C)
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    M109 S{temp}
    {% if params.PURGE|default(1)|int %}
        HI_PURGE HEATER_OFF=0
        G90
        G1 X-18.5 Y130 F12000
    {% endif %}
    M83
    G92 E0
    G1 E-.8 F2400
    # Stock: ACCEL=2000 ACCEL_TO_DECEL=500 SQUARE_CORNER_VELOCITY=8. Mainline
    # has no accel_to_decel; its equivalent is minimum_cruise_ratio
    # 1 - 500/2000 = 0.75 (without it the fast stroke spikes the pressure
    # and pa_compute picks ~0.02 higher: bench 11-14, 0.056 vs stock 0.038)
    SET_VELOCITY_LIMIT ACCEL=2000 MINIMUM_CRUISE_RATIO=0.75 SQUARE_CORNER_VELOCITY=8
    M400
    PA_LOG_START SRC=1 HIGH_HOLD=1
    G91
    G1 E5 F2400
    G4 P500
    {% for i in range(count) %}
        SET_PRESSURE_ADVANCE ADVANCE={"%.5f"|format(start + i * step)}
        G1 E-.8 F2400
        G4 P100
        G1 E.8 F2400
        G4 P50
        G1 F{slow}
        G1 Y20 E.92643
        G1 F{fast}
        G1 Y-40 E1.853
        G1 F{slow}
        G1 Y20 E.92643
    {% endfor %}
    G90
    M400
    PA_LOG_STOP NAME=hi_pa_sweep
    SET_PRESSURE_ADVANCE ADVANCE={old_pa}
    SET_VELOCITY_LIMIT ACCEL={old_accel} MINIMUM_CRUISE_RATIO={old_mcr} SQUARE_CORNER_VELOCITY={old_scv}
    RESTORE_GCODE_STATE NAME=hi_pa_cal
    HI_WIPE
    HI_PA_COMPUTE NAME=hi_pa_sweep MATERIAL={material} START={start} STEP={step} COUNT={count} SET={params.SET|default(1)|int}

[pa_pressure_log]

[hi_pa_compute]

# Rear-strip nozzle clean: a step-for-step port of Creality's NOZ_CLEAR
# (klippy/extras/nozzle_clear.py as installed on the Hi 1.1.0.79, with this
# printer's [nozzle_clear]: start_pos 98,266, touch_cnt 3, clear_start
# 148,266, probe_pos_diff 0,0, clear_lenght 14,2, upraise 0.2, clear_cnt 10,
# clear_temp 170, enable_clear true, and the module defaults clear_speed
# 6000, start_clear_temp 175, pumpback_mm 3, closure_temp 120):
#   1. Z home on the strip at start_pos (moved 0-3 mm each time, as stock)
#   2. heat to 175, retract 3 mm, 10 touches stepping right along the strip
#      (3 x 3, X+2 between, X+3 between groups, Z+3 lift) to squash the ooze
#   3. fan half, cool to 170, heater off, fan off; re-zero at X128; drag to
#      X148, 0.2 mm up, 10 rounds of a 14 x 2 mm rectangle at F6000
#   4. re-zero at X128 and cool there to 120 with the fan on (seals the tip)
# Only difference: stock touches at 15 mm/s because its MCU decides
# contact; ours is checked by the host every 80 ms, so it touches at the
# normal probe speed (0.75 mm/s) instead of pressing ~1 mm into the strip.
# Leaves the Z frame on the strip (as stock): G28 Z afterwards.
[gcode_macro NOZZLE_CLEAR]
description: Creality's NOZ_CLEAR: squash, scrub and seal on the rear strip
variable_start_x: 98
variable_start_y: 266
variable_touch_cnt: 3
variable_start_clear_temp: 175
variable_pumpback: 3
# Per-material temperatures [squash, scrub, seal] in C (16 Nov 2026, Grant:
# PETG hotter). Stock uses 175 / 170 / 120 for everything, which suits PLA,
# but PETG at 170 is a sticky gum that smears and builds up instead of
# wiping off. Matched by prefix of MATERIAL= (START_PRINT passes the
# slicer's filament type), so 'PETG' also covers PETG-CF. Anything not
# listed keeps stock.
variable_material_temps: {'PETG': [215, 210, 120]}
# No MATERIAL= (older gcode): a print at or above this nozzle temperature
# uses hot_guess's temperatures, below it stock.
variable_hot_guess_temp: 235
variable_hot_guess: 'PETG'
gcode:
    {% set n = printer["gcode_macro NOZZLE_CLEAR"] %}
    {% set sc = printer["gcode_macro _NOZZLE_CLEAR_SCRUB"] %}
    {% set mat = params.MATERIAL|default("")|upper %}
    {% set et = params.EXTRUDER_TEMP|default(0)|float %}
    {% set pick = namespace(k="") %}
    {% for k in n.material_temps %}
        {% if mat.startswith(k|upper) %}{% set pick.k = k %}{% endif %}
    {% endfor %}
    {% if not pick.k and not mat and et >= n.hot_guess_temp|float %}
        {% set pick.k = n.hot_guess %}
    {% endif %}
    {% if pick.k %}
        {% set tl = n.material_temps[pick.k] %}
        {% set squash_t, clear_t, seal_t = tl[0]|float, tl[1]|float, tl[2]|float %}
    {% else %}
        {% set squash_t, clear_t, seal_t = n.start_clear_temp|float, sc.clear_temp|float, sc.closure_temp|float %}
    {% endif %}
    RESPOND MSG="Nozzle clean temps for {mat or ('%d C print' % et)}: squash {squash_t|int}, scrub {clear_t|int}, seal {seal_t|int} ({pick.k or 'stock'})"
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes
          or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("NOZZLE_CLEAR needs X, Y and Z homed (G28)") }
    {% endif %}
    # Stock moves the start point 0-3 mm each time (random.uniform)
    {% set t = printer.toolhead.estimated_print_time|float %}
    {% set dx = (t * 7.31) % 3 %}
    {% set dy = (t * 3.17) % 3 %}
    {% set sx = n.start_x - dy %}
    {% set sy = n.start_y + dx %}
    M204 S10000
    M104 S0
    M107
    BED_MESH_CLEAR
    G90
    G1 Z5 F600
    G1 X{sx} Y{sy} F12000
    M400
    # Stock ZHOME: Z zero on the strip. Stock searches down from far above;
    # ours searches from START_Z to the -1.5 probe floor, and the strip sits
    # 1-2 mm below the bed (whose rear is ~0.5 low), so claim 3 mm more
    # height first: the search then reaches ~4.5 mm below the bed plane.
    SET_KINEMATIC_POSITION Z=8
    PRTOUCH_HOME_Z PROBE_SPEED=1 START_Z=8
    G90
    G1 Z10 F3000
    G1 X{sx} Y{sy} F18000
    M109 S{squash_t}
    M83
    G1 E-{n.pumpback} F1800
    G91
    G1 X2 F6000
    {% for cnt in range(n.touch_cnt|int) %}
        {% for cnt2 in range(3) %}
            G90
            PROBE
            G91
            {% if cnt2 == 2 %}
                G1 X2 F6000
            {% endif %}
            G1 Z3 X2 F3000
        {% endfor %}
        G91
        G1 X3 F6000
    {% endfor %}
    G90
    PROBE
    _NOZZLE_CLEAR_SCRUB CLEAR_TEMP={clear_t} CLOSURE_TEMP={seal_t}

[gcode_macro _NOZZLE_CLEAR_SCRUB]
variable_clear_x: 148
variable_clear_y: 266
variable_diff_x: 0
variable_diff_y: 0
variable_len_x: 14
variable_len_y: 2
# Stock 0.2. Lowered 15 Nov 2026 (Grant: ooze left on the tip pulled the
# first layer off the bed). The strip rises ~0.003 mm/mm to the right, so at
# the scrub (X148-162) 0.1 above the X128 re-zero is about touching.
# Lowered again 16 Nov 2026 to 0 (Grant: PETG clumps; scrub the whole tip,
# not just the end, so nothing is pushed up the nozzle to melt and drop):
# about 0.06-0.1 mm into the strip over the scrub. The K2 scrubs 0.32 below
# its tap.
variable_upraise: 0
variable_clear_cnt: 10
variable_clear_temp: 170
variable_clear_speed: 6000
variable_closure_temp: 120
gcode:
    {% set s = printer["gcode_macro _NOZZLE_CLEAR_SCRUB"] %}
    {% set f = s.clear_speed|float %}
    {% set clear_t = params.CLEAR_TEMP|default(s.clear_temp)|float %}
    {% set seal_t = params.CLOSURE_TEMP|default(s.closure_temp)|float %}
    # Coarse wipe (stock "粗擦")
    G90
    M106 S127
    M109 S{clear_t}
    M104 S0
    M107
    G1 Z3 F300
    G1 X{s.clear_x - 20} Y{s.clear_y} F{f}
    PROBE
    SET_KINEMATIC_POSITION Z=0
    G1 X{s.clear_x} Y{s.clear_y} F{f}
    G91
    {% if s.diff_x|float != 0 or s.diff_y|float != 0 %}
        G1 X{s.diff_x} Y{s.diff_y} F{f}
    {% endif %}
    G1 Z{s.upraise} F300
    G1 F{f}
    {% for i in range(s.clear_cnt|int) %}
        G1 X{s.len_x}
        G1 Y{s.len_y}
        G1 X{0 - s.len_x|float}
        G1 Y{0 - s.len_y|float}
    {% endfor %}
    G1 Z5 F300
    G90
    G1 X{s.clear_x - 20} Y{s.clear_y} F{f}
    PROBE
    SET_KINEMATIC_POSITION Z=0
    # Seal: cool to 120 on the strip with the fan on (stock "封嘴冷却")
    M106 S127
    M109 S{seal_t}
    M107
    G90
    G1 Z10 F300
    G1 X130 Y130 Z10 F6000
    M400
    RESPOND MSG="Nozzle cleaned on the strip (Creality NOZ_CLEAR sequence)"

# --- Print start / end

[gcode_macro START_PRINT]
description: Heat, home, clean, level, mesh, prime: the whole print start
# Everything the print start does lives here, so the slicer sends one line
# and never needs editing (orca/Creality Hi OpenKlipper.json):
#   START_PRINT EXTRUDER_TEMP= BED_TEMP= MATERIAL= TOTAL_LAYER= VOLUMETRIC=
# MATERIAL   filament type, picks the nozzle-clean temperatures
# TOTAL_LAYER layer count for the screen / Moonraker
# VOLUMETRIC  filament max volumetric speed (mm3/s), sets the prime speed
# PRIME      1 = draw the prime line here. Defaults to 1 when TOTAL_LAYER
#            is sent (the one-line start) and 0 otherwise, so gcode sliced
#            with the old start (prime line in the slicer) is not primed
#            twice.
# First-layer height correction (mm, positive lowers the nozzle). Z is
# tapped at 140 C and the print runs hotter. Tune on the first run with the
# first-layer test (docs/HI-FIRST-RUN.md step 9); the K2 settled on 0.02-0.04.
variable_hot_z_comp: 0.0
# YOUR first-layer adjustment, like Creality's Z offset: negative = nozzle
# closer to the bed
variable_z_offset: 0
# Scrub the nozzle on the rear strip before measuring Z (stock NOZ_CLEAR)
variable_nozzle_clear: 1
# Probe both sides and level the gantry on every print (stock relies on the
# top switches only)
variable_z_tilt: 1
# Adaptive mesh over the print area
variable_adaptive_mesh: 1
# Nozzle temperature to cool to while parked at the chute before the prime
# line (stock box.cfg Tn_extrude_temp). Captured 16 Nov 2026: after the CFS
# flush and wipes stock parks at the chute, drops to 220 and waits for it,
# then the slicer's M104 (no wait) heats back up during the prime line, so
# the ooze sets instead of hanging on the tip. Prints at or below this
# temperature skip the cool-down.
variable_park_temp: 220
# Still homed from the last print: skip the switch trip and X/Y homing
variable_warm_start: True
variable_warm_ready: 0
gcode:
    CLEAR_PAUSE
    {% set sp = printer["gcode_macro START_PRINT"] %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|float %}
    {% set prime = params.PRIME|default(1 if params.TOTAL_LAYER is defined else 0)|int %}
    {% set volumetric = params.VOLUMETRIC|default(12)|float %}
    {% if params.TOTAL_LAYER is defined %}
        SET_PRINT_STATS_INFO TOTAL_LAYER={params.TOTAL_LAYER|int}
    {% endif %}
    {% set warm = sp.warm_start|string|lower in ("true", "1")
                  and sp.warm_ready|int == 1
                  and printer.toolhead.homed_axes == "xyz"
                  and printer.k2_motor_bus.motors_ready %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=0
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    M107
    M140 S{bed_temp}
    M104 S140
    {% if warm %}
        RESPOND MSG="Warm start: X/Y homed from the last print"
        G28 Z
    {% else %}
        G28
    {% endif %}
    {% if sp.nozzle_clear|int %}
        # Stock order: strip clean while the bed heats, then measure Z with
        # the clean nozzle (ooze on the tip fakes contact)
        NOZZLE_CLEAR MATERIAL="{params.MATERIAL|default('')}" EXTRUDER_TEMP={extruder_temp}
        G28 Z
    {% endif %}
    RESPOND MSG="Heating the bed"
    M140 S{bed_temp}
    # 'Reached', not 'settled': M190 also waits out an overshoot
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1}
    M109 S140
    {% if sp.z_tilt|int %}
        Z_TILT_ADJUST
        G28 Z
    {% endif %}
    {% if sp.adaptive_mesh|int %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    {% set offset = 0.0 - sp.hot_z_comp|float + sp.z_offset|float %}
    SET_GCODE_OFFSET Z={offset}
    RESPOND MSG="Heating the nozzle to {extruder_temp|int} C"
    # Stock end of START_PRINT: to the corner at Z3, heat over the chute
    # (BOX_GO_TO_EXTRUDE_POS) so the ooze drops there, then wipe it off
    # (3 passes), then the prime line.
    G90
    G1 X0 Y0 Z3 F12000
    M104 S{extruder_temp}
    G1 X-18.5 Y130 F12000
    M109 S{extruder_temp}
    {% set cfs = printer.k2_cfs %}
    {% set cfs_slot = (params.SLOT|default(printer.hark_cfs_slots.tool_map.T0))|upper %}
    {% if cfs.fitted and cfs.online and cfs_slot in ("A", "B", "C", "D") %}
        # Stock (master-server, before the file runs): load the slot at the
        # chute and flush 70 + 70 mm with the strip wipes. A slot already in
        # the nozzle is just purged. CFS moves need Z >= purge_min_z.
        RESPOND MSG="CFS: slot {cfs_slot} to the nozzle, then purge"
        G1 Z6 F600
        CFS_PRINT_START SLOT={cfs_slot} CONFIRM=1
        G90
        G1 X-18.5 Y130 F12000
    {% endif %}
    HI_WIPE
    # Stock: cool to park_temp at the chute, then heat back to the print
    # temperature WITHOUT waiting and go straight to the prime line (stock
    # primed at 221-226 C and reached 250 a few seconds into the part)
    {% set park = [sp.park_temp|float, extruder_temp]|min %}
    {% if park < extruder_temp %}
        RESPOND MSG="Cooling the nozzle to {park|int} C at the chute so the ooze sets"
        M104 S{park}
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={park + 2}
    {% endif %}
    M104 S{extruder_temp}
    M220 S100
    M221 S100
    G21
    M83
    G92 E0
    {% if prime %}
        _HI_PRIME_LINE VOLUMETRIC={volumetric}
    {% endif %}
    RESPOND MSG="Print start done"

# Creality's Hi prime line along the front-left edge (it was in the slicer's
# start gcode): 150 mm up the left edge and 150 mm along the front, 9 mm of
# filament each, at the speed Creality picks from the filament's max
# volumetric speed (0.3 = their divisor).
[gcode_macro _HI_PRIME_LINE]
gcode:
    {% set f = params.VOLUMETRIC|default(12)|float / 0.3 * 60 %}
    M204 S2000
    G90
    G1 Z3 F600
    M83
    G1 Y150 F12000
    G1 X0 F12000
    G1 Z0.2 F600
    G1 X0 Y150 F6000
    G1 E0.8 F300
    G1 X0 Y0 E9 F{f}
    G1 X150 Y0 E9 F{f}
    G92 E0
    G1 Z1 F600

[gcode_macro END_PRINT]
description: Retract, lift, present the bed, heaters and fans off, reset what the print changed (motors stay on)
# Stock lifts Z 50 mm (to 305 at most), parks at X0 Y260, heaters, fan and
# motors off. Ours keeps the motors on so the next print can warm-start
# (X/Y stay homed), and parks mid-X so the part comes off easily.
variable_lift: 50
gcode:
    {% set e = printer["gcode_macro END_PRINT"] %}
    {% set z = printer.toolhead.position.z|float %}
    {% set zmax = printer.toolhead.axis_maximum.z|float %}
    M400
    M83
    {% if printer.extruder.can_extrude %}
        # Pull the melt back out of the tip so it does not ooze while cooling
        G1 E-2 F2400
    {% endif %}
    G91
    G1 Z{[e.lift|float, zmax - z]|min} F1200
    G90
    G1 X130 Y260 F12000
    M104 S0
    M140 S0
    M107
    {% if printer.k2_cfs.fitted %}
        # Stock idle state between prints: the box stops following the
        # extruder and draws in a spool pushed into an empty slot
        CFS_FEED_STOP
        CFS_PRELOAD ENABLE=1
    {% endif %}
    # The slicer's SET_PRESSURE_ADVANCE, M220/M221 and SET_VELOCITY_LIMIT last
    # until changed: put this printer's own values back for the next job
    SET_PRESSURE_ADVANCE ADVANCE={printer.configfile.settings.extruder.pressure_advance}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity|default(5)}
    M220 S100
    M221 S100
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=1
    M400
    RESPOND MSG="Print finished: bed presented, heaters off"

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    END_PRINT

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
# Heater targets at the pause: RESUME brings them back if the idle timeout
# (or you) switched a heater off while the print waited. k2_cfs sets them
# too when a colour change fails and it pauses the print itself.
variable_extruder_target: 0
variable_bed_target: 0
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Already paused"
    {% else %}
        {% set z = printer.toolhead.position.z|float %}
        {% set zmax = printer.toolhead.axis_maximum.z|float %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=extruder_target VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=bed_target VALUE={printer.heater_bed.target}
        PAUSE_BASE
        M83
        {% if printer.extruder.can_extrude %}
            G1 E-1 F2400
        {% endif %}
        G91
        G1 Z{[10, zmax - z]|min} F1200
        G90
        G1 X-5 Y130 F12000
        M400
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Not paused"
    {% else %}
        {% set saved = printer["gcode_macro PAUSE"] %}
        {% set bed_t = printer.heater_bed.target if printer.heater_bed.target > 0 else saved.bed_target %}
        {% set nozzle_t = printer.extruder.target if printer.extruder.target > 0 else saved.extruder_target %}
        {% if nozzle_t == 0 and printer.extruder.temperature < 170 %}
            { action_raise_error("RESUME: heat the nozzle to print temperature first") }
        {% endif %}
        {% if bed_t > 0 and printer.heater_bed.target == 0 %}
            M140 S{bed_t}
        {% endif %}
        {% if nozzle_t > 0 and printer.extruder.target == 0 %}
            RESPOND MSG="Reheating the nozzle to {nozzle_t|int} C before resuming"
            M104 S{nozzle_t}
        {% endif %}
        {% if bed_t > 0 and printer.heater_bed.temperature < bed_t - 3 %}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_t - 1}
        {% endif %}
        {% if nozzle_t > 0 and printer.extruder.temperature < nozzle_t - 3 %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={nozzle_t - 2}
        {% endif %}
        {% if printer.k2_cfs.change_pending %}
            # Paused by a failed colour change: try the change again. If it
            # fails again the print stays paused (CFS_CHANGE_RETRY raises).
            CFS_CHANGE_RETRY
        {% else %}
            HI_WIPE
            M83
            G1 E1 F2400
        {% endif %}
        RESUME_BASE
    {% endif %}

# Creality Print / Orca send M106 P1 / P2 for fans the Hi does not have.
# Part fan scaled like the stock Hi firmware (gcode_macro.cfg M106 with
# Rmode off, which stock START_PRINT forces): half the asked speed, and
# never under 51/255 (20 %) once it is on. The slicer profiles are tuned for
# that: CR-PETG asks 40-80 % = 20-40 % real. Sending the raw value ran the
# fan twice as hard as stock (PETG clumping on the nozzle, weak layers).
[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% if params.P is not defined or params.P|int == 0 %}
        {% set s = params.S|default(255)|float %}
        {% if s > 0 %}
            M106.1 S{[s / 2, 51]|max}
        {% else %}
            M106.1 S0
        {% endif %}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% if params.P is not defined or params.P|int == 0 %}
        M107.1
    {% endif %}

# --- Filament load / unload (at the chute)

[gcode_macro LOAD_FILAMENT]
description: Heat, feed and purge new filament at the chute
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    G1 X-18.5 Y130 F12000
    M109 S{temp}
    M83
    G1 E60 F300
    HI_PURGE LENGTH=30
    M104 S0

[gcode_macro UNLOAD_FILAMENT]
description: Heat, tip-form and pull the filament out of the extruder
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G90
    G1 X-18.5 Y130 F12000
    M109 S{temp}
    M83
    G1 E5 F300
    G1 E-15 F2400
    G4 P2000
    G1 E-60 F1200
    M104 S0
    RESPOND MSG="Pull the filament out of the toolhead now"

# --- CFS (Creality Filament System) ----------------------------------------
# Same box and RS485 protocol as the K2 (klippy/extras/k2_cfs.py); what
# differs is where things are. Stock Hi box.cfg (1.1.0.79): cutter lever on
# the RIGHT (pre_cut_pos_x 240, cut at this printer's calibrated cut_pos_x),
# chute on the LEFT at X-18.5 Y130 with a PTFE strip at X-5..0 between the
# chute and the bed, and a Y detour to 261 between the cutter and the chute
# so the oozing nozzle crosses along the back edge, not over the part.
[k2_cfs]
allow_actuation: true
# --- chute / purge route: staging point (purge_return_x, purge_safe_y),
# then X to purge_entry_x, bed to purge_y, in over the strip to purge_x
purge_safe_y: 261
purge_return_x: 240
purge_entry_x: 10
purge_gate_x: 0
purge_x: -18.5
purge_y: 130
# stock travels F12000
purge_speed: 200
# Stock flush: 140 mm as 70 + 70 at 6 mm/s (box_first_clean_length 70),
# part fan 20 % while flushing and 50 % for the wipes (the Hi's M106 halves
# what it is given, so the full-fan blast here is stock's 50 %)
purge_extrude_length: 140
purge_minimum_actual_length: 140
purge_chunk_length: 70
purge_extrude_speed: 6
purge_fans: fan
# --- wipe: 7 passes X-18.5 <-> X-5 over the PTFE strip (stock)
wipe_style: strip
clean_passes: 7
clean_right_x: -5
clean_left_x: 0
clean_y: 130
clean_speed: 200
clean_accel: 5000
# --- cutter: stage at X240, ram right to the cut position at stock
# cut_velocity 15000 mm/min, back to the staging point. cutter_cut_x is THIS
# printer's stock calibration ([box] cut_pos_x, 279.60 on Grant's Hi,
# CALIBRATE_CUT_POS 16 Nov 2026: stall at 280.0 less 0.4). Another Hi:
# read it from the stock printer.cfg SAVE_CONFIG block, or run
# CFS_CUTTER_CALIBRATE CONFIRM=1 with the toolhead empty.
cutter_side: right
cutter_x: 240
cutter_y: 130
cutter_cut_x: 279.6
cutter_release_x: 240
cutter_speed: 200
cutter_ram_speed: 250
cutter_release_speed: 150
cutter_ram_accel: 5000
cutter_switch_pin: !nozzle_mcu:PB1
# A blade that stays in is pinched by the filament. After each cut: wait
# cutter_return_timeout for the knife sensor; still in -> push the stub down
# cutter_free_push mm, wait; still in -> pull it back past where it was,
# wait; still in -> cut again, up to cutter_cut_attempts cuts (stock jogs the
# extruder and cuts again too). Around the cut the K2 wrapper's own moves
# are kept (2 mm retract before and after, 7 mm tip push/pull: the module
# defaults); stock box.cfg says retract_len_before_cut 0, but with no
# retract the first colour change in a print (16 Nov) left the blade in.
# CFS_CUTTER_TEST CONFIRM=1 does dry cuts with the toolhead empty (16 Nov:
# 5 of 5 seen, blade back within 0.2 s), and CFS_CUTTER_CALIBRATE CONFIRM=1
# finds where the knife sensor trips (X272.3 on Grant's Hi). The end-stop
# search (METHOD=STALL, stock CALIBRATE_CUT_POS) does NOT work on the Hi
# yet: rams up to X280.4 reported no motor stall in mode 2 or with
# MODE=3 (stock's mode for it), so cutter_cut_x stays the stock value.
cutter_return_timeout: 2
cutter_free_push: 1.5
cutter_cut_attempts: 3
# --- unload: stock log 16 Nov 20:07: one RETRUDE start, the extruder pulls
# 15 mm at 6 mm/s, RETRUDE finish (the rewind took 16 s)
unload_fast_pulls: 1
unload_pull_length: 15
unload_pull_speed: 6
unload_final_length: 0
unload_rewind_pause_ms: 300
unload_bus_timeout: 150
unload_sensor_timeout: 10
# --- load: the K2 handshake (the same box firmware); the extruder takes
# 5 + 9 = 14 mm at 3 mm/s as stock's E+14
load_bus_timeout: 15
load_timeout: 90
load_poll_interval: 2

# CFS slot filament records (CFS_SLOTS, the KlipperScreen CFS page, Orca's
# lane sync). On a host PC hostlink.cfg points these at the host's folders.
[hark_cfs_slots]

# Mainsail / Fluidd: a macro button that opens the slot editor (material
# type, filament profile, colour). KlipperScreen has Edit on its CFS page.
[gcode_macro CFS_FILAMENTS]
description: Show and edit the filament in each CFS slot
gcode:
    CFS_SLOTS

# Part fan (0-255, before the Hi's M106 halving) while the purge comes out:
# stock flushes every material at 20 %
[gcode_macro _PURGE_FAN]
variable_default: 51
variable_material: {}
gcode:

[gcode_macro _CFS_CHECK]
gcode:
    {% set cfs = printer.k2_cfs %}
    {% if cfs.fitted and cfs.detected == False and not cfs.online %}
        { action_raise_error("The CFS is not answering. Check its cable and power, then restart. If this printer has no CFS, add cfs_fitted: False under [k2_cfs] in printer-overrides.cfg and restart.") }
    {% endif %}

[gcode_macro _CFS_SAFE_Z]
gcode:
    {% if printer.toolhead.position.z|float < 10 %}
        G90
        G1 Z10 F600
    {% endif %}

# Leave the nozzle clean after a load/purge/unload: whatever oozes while it
# cools is wiped off with the fan on, instead of hardening on the tip.
[gcode_macro _CFS_COOL_WIPE]
gcode:
    M104 S0
    M106 S255
    NOZZLE_WIPE CONFIRM=1 PARK=0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1
    M107

# Screen / console slot loading while idle. Heats over the chute (never over
# the bed) to the hotter of the old and new filament.
[gcode_macro CFS_LOAD_SLOT]
description: Load a CFS slot and purge the old filament out (idle only)
gcode:
    {% set slot = params.SLOT|default("")|upper %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set active = printer.k2_cfs.active_slot %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_LOAD_SLOT is only for when nothing is printing") }
    {% endif %}
    {% if slot not in ("A", "B", "C", "D") %}
        { action_raise_error("CFS_LOAD_SLOT needs SLOT=A, B, C or D") }
    {% endif %}
    {% set new_t = (slots[slot].nozzle_temp if slot in slots else 0)|int %}
    {% set old_t = (slots[active].nozzle_temp if active and active in slots else 0)|int %}
    {% set temp = [new_t, old_t, 220]|max %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    RESPOND MSG="Heating to {temp} C at the chute, then loading slot {slot}"
    M109 S{temp}
    CFS_CHANGE_SLOT SLOT={slot} CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    {% if params.COOL|default(1)|int %}
        _CFS_COOL_WIPE
    {% endif %}
    RESPOND MSG="Slot {slot} loaded and purged"

[gcode_macro CFS_UNLOAD_ACTIVE]
description: Cut and rewind the loaded CFS filament (idle only)
gcode:
    {% set active = printer.k2_cfs.active_slot %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set c = printer.configfile.settings.k2_cfs %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_UNLOAD_ACTIVE is only for when nothing is printing") }
    {% endif %}
    {% if not active %}
        { action_raise_error("No CFS slot is loaded") }
    {% endif %}
    {% set temp = [(slots[active].nozzle_temp if active in slots else 0)|int, 220]|max %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    RESPOND MSG="Heating to {temp} C at the chute, then unloading slot {active}"
    M109 S{temp}
    # out of the chute, along the back of the bed, to the cut staging point
    G90
    G1 X{c.purge_entry_x} F{c.purge_speed * 60}
    G1 Y{c.purge_safe_y} F{c.purge_speed * 60}
    G1 X{c.purge_return_x} F{c.purge_speed * 60}
    CFS_CUT_UNLOAD SLOT={active} CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    _CFS_COOL_WIPE
    RESPOND MSG="Slot {active} unloaded"

# The file's T0-T3 print from the slot the tool map gives (A-D by default,
# CFS_TOOL_MAP changes it). M8800-M8803 are k2_cfs's own T0-T3. START_PRINT
# has already loaded T0's slot, so the file's first T0 has nothing to do.
# A different slot mid-print is a colour change (CFS_TOOLCHANGE): the moves
# are the same cut / load / purge as above, but a colour change during a
# print has NOT been bench-proven on the Hi yet.
[gcode_macro _HI_TOOL]
gcode:
    {% set t = params.T|int %}
    {% set cfs = printer.k2_cfs %}
    {% if cfs.fitted and cfs.online %}
        {% set slot = printer.hark_cfs_slots.tool_map["T%d" % t] %}
        {% set now = cfs.active_slot or cfs.feed_slot %}
        {% if slot == now or slot == "E" %}
            # already feeding the nozzle (or the external spool)
        {% elif printer.print_stats.state == "printing" and now %}
            CFS_TOOLCHANGE SLOT={slot}
        {% else %}
            { action_raise_error("T%d asks for CFS slot %s, which is not in the nozzle. Load it first: CFS_LOAD_SLOT SLOT=%s" % (t, slot, slot)) }
        {% endif %}
    {% elif t != 0 %}
        { action_raise_error("No CFS answering: only T0 (the spool holder) can print") }
    {% endif %}

[gcode_macro T0]
rename_existing: M8800
gcode:
    _HI_TOOL T=0

[gcode_macro T1]
rename_existing: M8801
gcode:
    _HI_TOOL T=1

[gcode_macro T2]
rename_existing: M8802
gcode:
    _HI_TOOL T=2

[gcode_macro T3]
rename_existing: M8803
gcode:
    _HI_TOOL T=3
