# Creality K2 / F021 - upstream Klipper recovery configuration
# Sensor-only Stage 1. This configuration deliberately has no kinematics,
# steppers, heaters, homing, or extrusion.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[thermistor k2_nozzle_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[thermistor k2_bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 27586
temperature3: 100
resistance3: 6610

[temperature_sensor nozzle_temperature]
sensor_type: k2_nozzle_thermistor
sensor_pin: nozzle_mcu:PA0
min_temp: -30
max_temp: 390

[temperature_sensor bed_temperature]
sensor_type: k2_bed_thermistor
sensor_pin: PC4
min_temp: -30
max_temp: 115

[temperature_sensor chamber_temperature]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[multi_pin chamber_led_pins]
pins: PB0, PA12

[output_pin chamber_led]
pin: multi_pin:chamber_led_pins
pwm: true
cycle_time: 0.010
value: 1
shutdown_value: 0

[fan_generic part_fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
shutdown_speed: 0

[hark_compat]

