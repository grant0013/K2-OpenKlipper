# Creality K2 Plus / F008 - upstream Klipper CoreXY configuration (BETA)
# GENERATED by tools/k2plus/make_k2plus_cfg.py from mainline_stage2.cfg (the
# K2 config). Do not edit this file: change the K2 config or the script.
# Untested on a real K2 Plus. Read docs/K2-PLUS-BETA.md before using it.
#
# Stage 2: X/Y motion and homing were validated on 2026-07-07.
# Mainline X/Y/Z Home All and the open PRTouch contact-abort path were validated
# repeatedly on 2026-07-28. After a restart, Z has no trustworthy position, so
# Home All first uses the PA15 bottom reference and approaches the nozzle from
# a known coordinate. Re-homing within the same session can skip that phase.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
minimum_cruise_ratio: 0.0  # stock runs accel_to_decel = accel; mainline ignores ACCEL_TO_DECEL from Orca
square_corner_velocity: 10
max_z_velocity: 20  # stock K2 Plus allows 30; K2 limit kept for the beta
max_z_accel: 500  # stock K2

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 352.5
position_min: -10
position_max: 352.5
homing_speed: 100
homing_retract_dist: 10

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.2
position_min: -6.2
position_max: 400
homing_speed: 100
homing_retract_dist: 10

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 360
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

# Second Z motor (right side). Z_TILT_ADJUST levels the two.
[stepper_z1]
step_pin: PB15
dir_pin: PA1
enable_pin: !PA9
microsteps: 16
rotation_distance: 8

[z_tilt]
z_positions:
    -15, 175
    375, 175
points:
    5, 175
    345, 175
speed: 300
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

[thermistor k2_nozzle_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: k2_nozzle_thermistor
sensor_pin: nozzle_mcu:PA0
control: pid
# Stock K2 Plus PID (its set below 280C; above that Creality switched to
# 16.443 / 1.370 / 49.329). PID_CALIBRATE at your usual temperature to tune it.
pid_kp: 14.296
pid_ki: 1.271
pid_kd: 40.206
# A second set of gains above high_temp_value, as Creality's firmware
# switches to for 290 C+ materials (stock K2 values, tuned with its own
# base set; NOZZLE_PID_HIGH tuned them at 290 C with the part fan on)
#high_temp_value: 280
#pid_Kp_high_temp: 32.827
#pid_Ki_high_temp: 3.367
#pid_Kd_high_temp: 80.016
pressure_advance: 0.038
pressure_advance_smooth_time: 0.06
min_temp: -30
# Stock K2 value (Creality rates the hotend to 300 C); was 390 until 10-26
max_temp: 350

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[thermistor k2_bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 27586
temperature3: 100
resistance3: 6610

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 37
pid_ki: 0.18
pid_kd: 280
min_temp: -30
max_temp: 120

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# Mains voltage for the bed heater. Creality's config carries a 220 V set
# (half power, the PID above) and a 110 V set (full power, its own PID)
# and picks one by heating the bed 30 C at half power: at or under
# 0.35 C/s is 110 V. voltage: auto runs that once before the first print
# (_BED_POWER_AUTO) and keeps the answer in hark_bed_power.json; 110 or
# 220 forces a set. BED_POWER_CALIBRATE / BED_POWER_STATUS / BED_POWER_SET.
# (K2 Plus: no 110 V / 220 V bed sets in Creality's config, so no
# hark_bed_power here)
[gcode_macro _BED_POWER_AUTO]
variable_on_first_print: 0
gcode:
    RESPOND MSG="Bed power check: not on the K2 Plus (one bed set)"

# The tachometers are the K2's own fan-feedback inputs (stock fan_feedback
# fan2 = part fan, fan1 = hotend fan): Mainsail shows the rpm and
# hark_safety watches it for a stopped fan. The fans are powered through
# their PWM, so the tach only reads true at full speed (part fan 7500,
# hotend fan 8000 rpm on Grant's K2, 11-03); at part speed the count is
# whatever pulses fall in the on time, and 0 means stopped.


[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
shutdown_speed: 0
tachometer_pin: nozzle_mcu:PC13
tachometer_ppr: 2

[multi_pin hotend_fan_pins]
pins: nozzle_mcu:PB7, PB1

[heater_fan hotend_fan]
pin: multi_pin:hotend_fan_pins
heater: extruder
heater_temp: 50
tachometer_pin: nozzle_mcu:PA12
tachometer_ppr: 2

[multi_pin auxiliary_fan_pins]
pins: PB4, PB3

[fan_generic auxiliary_fan]
pin: multi_pin:auxiliary_fan_pins
cycle_time: 0.010
shutdown_speed: 0

# K2 Plus: the chamber fan is PA0. The PTC chamber heater is at the end of
# this file ([hark_chamber]).
[multi_pin exhaust_fan_pins]
pins: PA0

[fan_generic exhaust_fan]
pin: multi_pin:exhaust_fan_pins
cycle_time: 0.010
shutdown_speed: 0

[temperature_sensor chamber_temperature]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[multi_pin chamber_led_pins]
pins: PB0, PA12

[output_pin chamber_led]
pin: multi_pin:chamber_led_pins
pwm: true
cycle_time: 0.010
value: 1
shutdown_value: 0

[gcode_macro _LIGHT_IDLE]
description: Start the chamber light's idle switch-off countdown
# Seconds the chamber light stays on after a print ends, is cancelled, or
# the printer starts up, before it switches itself off. 0 = stays on (as
# before). A print switches it back on. In printer-overrides.cfg:
# [gcode_macro _LIGHT_IDLE] variable_off_after: 600
variable_off_after: 0
gcode:
    UPDATE_DELAYED_GCODE ID=_LIGHT_AUTO_OFF DURATION={printer["gcode_macro _LIGHT_IDLE"].off_after|int}

[delayed_gcode _LIGHT_AUTO_OFF]
gcode:
    {% if printer.print_stats.state not in ("printing", "paused") %}
        SET_PIN PIN=chamber_led VALUE=0
    {% endif %}

[delayed_gcode _LIGHT_STARTUP]
initial_duration: 2
gcode:
    _LIGHT_IDLE

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: ^!nozzle_mcu:PA11
# Klipper pauses and parks first (our PAUSE macro), then this runs
runout_gcode:
    _RUNOUT_REFILL

# Runout auto-refill, like stock: if another CFS slot holds the same material
# and colour, CFS_RUNOUT_REFILL pushes the old tail through at the chute,
# loads and purges that slot and resumes. Otherwise (or if the refill fails)
# the print stays paused for you to load filament and RESUME. Set
# variable_enabled: 0 in printer-overrides.cfg to always just pause.
[gcode_macro _RUNOUT_REFILL]
variable_enabled: 1
gcode:
    {% set cfs = printer.k2_cfs %}
    {% set slots = printer.hark_cfs_slots.slots %}
    # The box deselects a slot that has run out, so fall back to the slot
    # that was feeding the print
    {% set old = cfs.active_slot or cfs.feed_slot or cfs.last_loaded_slot %}
    {% set state = printer.print_stats.state %}
    {% set ns = namespace(pick="") %}
    {% if old and old in slots %}
        {% set want_type = (slots[old].type or "")|upper %}
        {% set want_colour = (slots[old].color or "")|upper %}
        {% for s in ["A", "B", "C", "D"] %}
            {% if not ns.pick and s != old and s in slots and slots[s].loaded
                  and (slots[s].type or "")|upper == want_type and want_type
                  and (slots[s].color or "")|upper == want_colour
                  and (not cfs.slots_loaded or cfs.slots_loaded[loop.index0]) %}
                {% set ns.pick = s %}
            {% endif %}
        {% endfor %}
    {% endif %}
    # A print from the external spool (CFS_TOOL_MAP ...=E) has no slot to
    # refill from: the rear spool is replaced by hand
    {% set external = cfs.fitted and printer.hark_cfs_slots.tool_map_external %}
    {% if state != "paused" %}
        RESPOND MSG="Filament runout detected (not printing)"
    {% elif external %}
        RESPOND TYPE=error MSG="The external spool ran out. Fit a new spool on the rear holder, run UNLOAD_FILAMENT SLOT=E then LOAD_FILAMENT SLOT=E, then RESUME."
    {% elif printer["gcode_macro _RUNOUT_REFILL"].enabled|int == 1 and cfs.online and ns.pick %}
        RESPOND MSG="Slot {old} ran out: refilling from slot {ns.pick} (same material and colour)"
        _STAGE TEXT="Runout: refilling from slot {ns.pick}"
        CFS_RUNOUT_REFILL SLOT={ns.pick} CONFIRM=1
        _STAGE CLEAR=1
    {% elif not cfs.fitted %}
        RESPOND TYPE=error MSG="Filament ran out. Fit a new spool on the rear holder, run UNLOAD_FILAMENT then LOAD_FILAMENT, then RESUME."
    {% else %}
        RESPOND TYPE=error MSG="Filament ran out{(' in slot ' ~ old) if old else ''} and no other slot has the same filament. Put a new spool in{(' slot ' ~ old) if old else ''}, then RESUME: it loads and purges first."
    {% endif %}

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 54.8  # SHAPER_CALIBRATE 10-25 (lis2dw_k2): X peak 53.9 Hz, Y peak 43.5 Hz
shaper_type_y: mzv
shaper_freq_y: 45.4

[prtouch_mainline]
z_offset: 0
speed: 0.75
lift_speed: 5
samples: 1
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.5
home_samples: 1
home_start_z: 5
home_samples_tolerance: 0.10
home_settle_time: 0.5
home_followup_guard: 0.5
# Multi-tap Z home (K2 Plus firmware method): keep tapping until the tightest
# home_samples taps among the last home_samples + home_allowed_noisy agree
# within home_samples_tolerance, up to home_max_touches taps (0 = same as
# home_samples). The K2 Plus ships 3 / 3 noisy / 10 touches / 0.010 mm. These
# defaults keep today's single tap; try PRTOUCH_HOME_Z SAMPLES=3
# ALLOWED_NOISY=3 MAX_TOUCHES=10 SAMPLES_TOLERANCE=0.01 first.
home_max_touches: 0
home_allowed_noisy: 0
# Standard PROBE / bed-mesh moves run only after Z home has established the
# contact plane. Settle XY vibration, reject triggers above that plane, and
# never search far enough below it to reproduce the v27 bed-flex incident.
probe_settle_time: 0.75
# Bed-mesh taps that trigger above this Z (the Z home contact plane is 0)
# are a blob or a false trigger, not the bed: re-probed probe_plane_retries
# times, then the mesh stops. Applies only while the Z frame is still the
# one PRTOUCH_HOME_Z set. Real K2 meshes stay well inside +-0.35 mm.
probe_arm_below_z: 0.45
probe_plane_check: True
probe_plane_retries: 1
probe_minimum_z: -0.60
# Multi-tap per probe point (PROBE, PROBE_ACCURACY, bed mesh), same rules as
# the Z home. 1 = today's single tap. Per command: TAP_SAMPLES=, TAP_TOLERANCE=,
# TAP_MAX_TOUCHES=, TAP_NOISY= (e.g. on BED_MESH_CALIBRATE).
probe_tap_samples: 1
probe_tap_tolerance: 0.10
probe_tap_max_touches: 0
probe_tap_allowed_noisy: 0
# One retry from the start Z after a clean no-trigger probe, for moves up to
# the max distance (a mesh tap is 1.6 mm, the Z home tap 5.6 mm). Off (0).
probe_no_trigger_retries: 0
probe_no_trigger_retry_max_distance: 2.0
# PRTOUCH_SCRUB (K2 Plus firmware method; used only by NOZZLE_CLEAR
# METHOD=detect and START_PRINT variable_scrub_method: 'detect'). The line is
# the strip the stock-style scrub uses. Taps 3x normal and 3x with the MCU
# hold thresholds x scrub_detect_hold_ratio at the line centre; a median
# difference above scrub_detect_deflection is a flexible tab. Defaults:
# K2 Plus: stock prth_clr_pose 185,355.5 (the K2 defaults are mid-bed here)
scrub_x_start: 185
scrub_x_end: 195
scrub_y_min: 354.5
scrub_y_max: 356.5
#scrub_detect_hold_ratio: 1.5
#scrub_detect_deflection: 0.035
#scrub_tab_depth: 0.15
#scrub_no_tab_depth: 0.05
#scrub_speed: 10
#scrub_max_passes: 3
#scrub_shorten_done: 0.01
#scrub_start_z: 5
#scrub_travel_speed: 100
#scrub_min_temp: 130
# Fail-closed arming: refuse a probe if an MCU acks start with an error or
# PC7 already reads contact after arming; warn if PC7 does not release.
pres_arm_checks: True
pres_release_timeout: 0.25
# Log the MCU's 64-sample pressure buffer when a probe never triggers.
probe_fail_dump: True
# The next four belong to the experimental host classifier. The active path
# lets the pressure MCU decide contact, so they have no effect on it.
probe_contact_threshold: 600
# Live v51 centre contact stayed at 607-1230 for nine consecutive windows.
# Print-time vibration produced only one- or two-window bursts. Three fresh
# 80ms windows therefore identify sustained nozzle load without a Z-plane gate
# and limit added physical press to about 0.19mm at the 0.8mm/s probe speed.
probe_contact_polls: 3
probe_max_window_p2p: 100000
# The stock cascade requires a 4000-count dynamic tap and missed a confirmed
# light contact at this speed. Use measured sustained load instead.
probe_contact_mode: amplitude
# Creality confirms spatially abnormal mesh points instead of averaging every
# location. Keep the fast single-tap path, then take two extra taps only for a
# point whose orthogonal-neighbour residual exceeds 0.08mm. The median of the
# original and two repeats rejects one bad read without flattening real edges.
mesh_guard_enabled: True
mesh_guard_residual: 0.08
mesh_guard_samples: 2
mesh_guard_max_points: 6
step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold: 4000, 10000, 500
pres_cfg_regs: 60
prth_msg_show: true
host_probe_warmup_polls: 8
host_probe_period_ms: 80
max_probe_descent: 6
host_probe_failure_retract: 2
# Rear-left live mesh contact was sustained at 728-732 while settled idle
# noise remained below ~340. Two consecutive windows plus the Z-plane gate
# make 600 conservative without losing that lower-sensitivity corner.
host_probe_contact_threshold: 600
# Schmitt-style hold threshold = entry threshold * ratio. Contact must first
# cross 600, then remain above 450 for the configured sustained-contact count.
host_probe_contact_release_ratio: 0.75
host_probe_contact_polls: 2
enable_not_linear_comp: true
temp_non_linaer_a: -0.00000000
temp_non_linaer_b: 0.00000000
temp_non_linaer_c: 0.04500000
prth_max_chps: 8
prth_tri_zacc: 100
prth_min_fans: 0.6
need_steady_regional: 0.8
horizontal_move_z_quick: 1
slot_left_pos: 195
slot_mid_pos: 170

[bed_mesh]
speed: 150
mesh_min: 5, 5
mesh_max: 345, 345
probe_count: 9, 9
mesh_pps: 2, 2
fade_start: 5
fade_end: 50
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 1
adaptive_margin: 5
split_delta_z: 0.01
move_check_distance: 3

[idle_timeout]
# Heaters and motors off after 30 minutes idle, as a safety net when a macro
# stops partway (e.g. a failed calibration left the nozzle hot). Never while
# printing. A job paused that long (runout, safety watch) loses only its
# hotend heat: the bed stays on so the part stays stuck, and homing is
# kept, so it can still be resumed after reheating.
# Motors off releases the bed (the K2 Plus bed drops) and the next print
# homes in full. Stock never times out; to change it, in
# printer-overrides.cfg: [idle_timeout] timeout: 3600 (seconds).
timeout: 1800
gcode:
    {% set state = printer.print_stats.state %}
    # The timeout in force (the touchscreen's Settings page can change it)
    {% set mins = (printer.idle_timeout.idle_timeout / 60)|round|int %}
    {% if state == "paused" %}
        M104 S0
        RESPOND TYPE=error MSG="Paused for {mins} minutes: hotend off (bed kept on). RESUME reheats it first"
    {% elif state != "printing" %}
        TURN_OFF_HEATERS
        M107
        M84
        RESPOND MSG="Idle for {mins} minutes: heaters and motors off"
    {% endif %}

[virtual_sdcard]
path: /mnt/UDISK/printer_data_mainline/gcodes

[gcode_arcs]
# Arcs are cut by accuracy (Hark Tech gcode_arcs.py): no segment strays more
# than max_deviation from the true curve, and resolution is the longest a
# segment may be. Upstream cuts every arc into equal resolution-long pieces
# and rounded the count down: at 0.5mm a small half circle (fillets, letters,
# small holes) became one straight line, up to 0.30mm off on real K2 prints.
# 0.1mm fixed starved the K2's move queue on an arc-heavy model (10-25).
# On 564k arcs from six real prints: worst miss 0.01mm, 11% fewer moves
# than 0.5mm.
resolution: 2.0
max_deviation: 0.01

[pause_resume]

# Mainsail detects pause/resume support through explicit macros. Keep upstream
# Klipper's native semantics while exposing the standard named wrappers.
[gcode_macro PAUSE]
description: Pause the current print, nozzle lifted and parked off the part
rename_existing: PAUSE_BASE
# Heater targets at the pause: RESUME brings them back if the idle timeout
# (or you) switched a heater off while the print waited
variable_extruder_target: 0
variable_bed_target: 0
gcode:
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=extruder_target VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=bed_target VALUE={printer.heater_bed.target}
    PAUSE_BASE
    # A hot nozzle left on the part oozes and scorches it. Lift 2 mm and park
    # behind the bed; RESUME restores the saved position.
    {% if printer.toolhead.homed_axes == "xyz" %}
        {% set z = [printer.toolhead.position.z + 2, printer.toolhead.axis_maximum.z]|min %}
        G90
        G1 Z{z} F600
        G1 X225 Y345 F12000
    {% endif %}

[gcode_macro RESUME]
description: Resume the current print
rename_existing: RESUME_BASE
gcode:
    # A pause longer than the idle timeout leaves the hotend off (the bed
    # stays on so the part keeps its grip). Resuming cold would fail the
    # first extrusion with "Extrude below minimum temp" and end the job, so
    # bring the heaters back to the print's targets and wait for them.
    {% set saved = printer['gcode_macro PAUSE'] %}
    {% set bed_t = printer.heater_bed.target if printer.heater_bed.target > 0 else saved.bed_target %}
    {% set nozzle_t = printer.extruder.target if printer.extruder.target > 0 else saved.extruder_target %}
    {% if bed_t > 0 and printer.heater_bed.target == 0 %}
        M140 S{bed_t}
    {% endif %}
    {% if nozzle_t > 0 and printer.extruder.target == 0 %}
        RESPOND MSG="Reheating the nozzle to {nozzle_t|int} C before resuming"
        M104 S{nozzle_t}
    {% endif %}
    {% if bed_t > 0 and printer.heater_bed.temperature < bed_t - 3 %}
        M190 S{bed_t}
    {% endif %}
    {% if nozzle_t > 0 and printer.extruder.temperature < nozzle_t - 3 %}
        M109 S{nozzle_t}
    {% endif %}
    # Paused by a failed colour change: try the change again first. If it
    # fails again the print stays paused (CFS_CHANGE_RETRY raises).
    {% if printer.k2_cfs is defined and printer.k2_cfs.change_pending %}
        CFS_CHANGE_RETRY
    {% else %}
        _RESUME_LOAD
    {% endif %}
    RESUME_BASE

# After a runout with no matching slot the spool is replaced by hand, and
# RESUME_BASE alone would print with nothing at the toolhead: load and purge
# first. A failure raises, so the print stays paused.
[gcode_macro _RESUME_LOAD]
description: Before a resume: load and purge if the toolhead has no filament
gcode:
    {% set sensor = printer["filament_switch_sensor filament_sensor"] %}
    {% set cfs = printer.k2_cfs %}
    {% set slot = cfs.active_slot or cfs.feed_slot or cfs.last_loaded_slot %}
    {% if printer.print_stats.state == "paused" and sensor.enabled and not sensor.filament_detected %}
        {% if not cfs.fitted %}
            { action_raise_error("No filament at the toolhead. Fit a new spool on the rear holder, run UNLOAD_FILAMENT then LOAD_FILAMENT, then RESUME.") }
        {% elif printer.hark_cfs_slots.tool_map_external %}
            { action_raise_error("No filament at the toolhead. Fit a new spool on the rear holder, run UNLOAD_FILAMENT SLOT=E then LOAD_FILAMENT SLOT=E, then RESUME.") }
        {% elif not slot %}
            { action_raise_error("No filament at the toolhead and no slot to load it from. Run LOAD_FILAMENT, then RESUME.") }
        {% endif %}
        RESPOND MSG="No filament at the toolhead: loading slot {slot} and purging before resuming"
        _STAGE TEXT="Loading slot {slot} and purging"
        CFS_RUNOUT_REFILL SLOT={slot} CONFIRM=1 RESUME=0
        _STAGE CLEAR=1
    {% endif %}

[display_status]

[exclude_object]

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set fan_index = params.P|default(0)|int %}
    {% set requested = params.S|default(255)|float %}
    {% set speed = [[requested / 255.0, 0.0]|max, 1.0]|min %}
    # A part fan told to run must turn: FAN_MIN_CAL measured where it stops
    {% set min_duty = printer.hark_fans.min_duty if printer.hark_fans is defined else none %}
    {% if fan_index == 0 and min_duty and 0 < speed < min_duty %}
        {% set requested = (min_duty * 255.0)|round(0, 'ceil') %}
    {% endif %}
    {% if fan_index == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif fan_index == 1 %}
        # The slicer or you set the exhaust fan: automatic chamber control
        # leaves it alone for the rest of this print.
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=1
        SET_FAN_SPEED FAN=exhaust_fan SPEED={speed}
    {% else %}
        M106.1 S{requested}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% set fan_index = params.P|default(0)|int %}
    {% if fan_index == 2 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
    {% elif fan_index == 1 %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=1
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        M107.1
    {% endif %}

[gcode_macro M141]
description: Set the chamber target for automatic exhaust-fan control (S0 = default)
gcode:
    {% set target = params.S|default(0)|float %}
    {% set default = printer["gcode_macro _CHAMBER_FAN"].default_target|float %}
    {% set use = target if target > 0 else default %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={use}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=slicer_set VALUE={1 if target > 0 else 0}
    RESPOND MSG="Chamber target {use|int}C: the exhaust fan vents above {(use + 2)|int}C while printing"
    # K2 Plus: a target over min_heat_target (40C) also runs the PTC
    # heater, 40C and under switches it off (stock M141)
    CHAMBER_HEAT TARGET={target}

# Automatic chamber control, like stock's [temperature_fan chamber_fan]: while
# printing, the exhaust fan (PB1+PB3) runs when the chamber is 2C over the
# target and stops 2C under it (stock watermark, 35C). The slicer's M141 sets
# the target (S0 = default), e.g. a higher one for ABS keeps the heat in. An
# explicit M106 P1 / M107 P1 from the slicer or you wins for that print. The
# K2 has no chamber heater, so the fan only ever vents.
#
# Without a slicer M141, START_PRINT takes the target from the loaded slot's
# material (material_targets); prefer_material: 1 uses the table even when
# the slicer sends one (OrcaSlicer's K2 filaments all send M191 S35). end_vent
# runs the exhaust fan at full for that
# many seconds after a print (0 = off) to clear fumes and cool the chamber.
[gcode_macro _CHAMBER_FAN]
variable_default_target: 35
variable_material_targets: {'PLA': 35, 'TPU': 35, 'PETG': 40, 'ABS': 50, 'ASA': 50, 'PC': 50, 'PA': 50}
variable_prefer_material: 0
variable_end_vent: 0
variable_target: 35
variable_slicer_set: 0
variable_manual: 0
variable_on: 0
variable_vent: 0
gcode:

# End-of-print vent: exhaust fan at full for end_vent seconds
[gcode_macro _CHAMBER_VENT]
gcode:
    {% set seconds = printer["gcode_macro _CHAMBER_FAN"].end_vent|int %}
    {% if seconds > 0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=1
        UPDATE_DELAYED_GCODE ID=_CHAMBER_VENT_END DURATION={seconds}
        RESPOND MSG="Venting the chamber for {seconds} s"
    {% endif %}

[delayed_gcode _CHAMBER_VENT_END]
gcode:
    {% if printer["gcode_macro _CHAMBER_FAN"].vent|int %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=0
        {% if printer.print_stats.state not in ("printing", "paused") %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
    {% endif %}

[delayed_gcode _CHAMBER_FAN_LOOP]
gcode:
    {% set v = printer["gcode_macro _CHAMBER_FAN"] %}
    {% set state = printer.print_stats.state %}
    {% if v.vent|int %}
        # End-of-print vent running: leave the fan alone, check again later
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    {% elif state in ("printing", "paused") %}
        {% if v.manual|int == 0 %}
            {% set temp = printer["temperature_sensor chamber_temperature"].temperature|float %}
            {% if temp >= v.target|float + 2 and v.on|int == 0 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=1
                SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=1
            {% elif temp <= v.target|float - 2 and v.on|int == 1 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=0
                SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
            {% endif %}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    {% else %}
        # Print over: stop venting and go back to the default target
        {% if v.on|int == 1 and v.manual|int == 0 %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={v.default_target}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=slicer_set VALUE=0
    {% endif %}

# Console messages from macros (RESPOND)
[respond]

# Stock NOZZLE_CLEAR (inside Creality's closed prtouch_v3): scrub the hot
# nozzle on the textured strip at the back of the bed, where stock's
# prth_clr_pose (160, 265.5) puts it. Height is measured first at stock's
# prth_clr_probe_pos (85, 265.5), left of the scrub tab. PRESS (0.32 mm) goes
# below that tap: the two tabs are nearly level, so that is about 0.3 mm into
# the scrub tab, which cleaned the tip on a K2 (0.1 did not). Stock presses
# 0.6 mm below the average of three taps (prth_clr_zpre).
# UNTIL_CLEAN=1 (opt-in, adapted from the K2 Plus firmware's PRTOUCH_SCRUB):
# after each scrub, probe the strip again at the same X85 point and scrub
# again until the measured contact drops by less than CLEAN_TOL (0.01 mm),
# up to MAX_PASSES (3). Debris under the tip reads as a higher contact, so a
# contact that stops dropping means the tip is clean. The depth stays PRESS
# below the probed strip, as stock.
# Portions adapted from Jacob10383's K2 Plus custom firmware (https://github.com/Jacob10383/k2-plus-custom-firmware, extras/prtouch.py), GPLv3.
# METHOD=detect (opt-in, the K2 Plus firmware's full PRTOUCH_SCRUB): heat to
# HOT, then PRTOUCH_SCRUB taps the strip centre normally and with a firmer
# press to tell a flexible tab from a solid strip, scrubs the strip line
# (X160-170 by default) at the measured contact minus scrub_tab_depth or
# scrub_no_tab_depth, and repeats until the end contacts stop dropping, up
# to MAX_PASSES (default scrub_max_passes; settings in [prtouch_mainline]). The
# nozzle stays at HOT for every tap and only goes to COOL afterwards, so the
# contacts are not shifted by a cooling nozzle. UNTIL_CLEAN and PRESS do not
# apply. METHOD=fixed (the default) is the scrub above.
[gcode_macro NOZZLE_CLEAR]
description: Scrub the nozzle on the bed's rear cleaning strip, like stock
gcode:
    {% set hot = params.HOT|default(200)|float %}
    {% set method = params.METHOD|default("fixed")|lower %}
    _STAGE TEXT="Scrubbing the nozzle on the strip"

    {% set until_clean = params.UNTIL_CLEAN|default(0)|int %}
    {% set passes = params.MAX_PASSES|default(3)|int %}
    {% if method not in ("fixed", "detect") %}
        { action_raise_error("NOZZLE_CLEAR METHOD must be fixed or detect") }
    {% endif %}
    {% if passes < 1 or passes > 6 %}
        { action_raise_error("NOZZLE_CLEAR MAX_PASSES must be 1-6") }
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("NOZZLE_CLEAR needs X, Y and Z homed") }
    {% endif %}
    BED_MESH_CLEAR
    G90
    G1 Z5 F600
    {% if method == "detect" %}
        M109 S{hot}
        PRTOUCH_SCRUB{% if params.MAX_PASSES %} MAX_PASSES={passes}{% endif %}
        M104 S{params.COOL|default(140)|float}
    {% else %}
        G1 X150 Y355 F6000
        M400
        PROBE
        G1 Z5 F600
        M109 S{hot}
        {% if until_clean %}
            SET_GCODE_VARIABLE MACRO=_NOZZLE_CLEAN_PASS VARIABLE=done VALUE=0
            {% for n in range(1, passes + 1) %}
                _NOZZLE_CLEAN_PASS PASS={n} MAX={passes} TOL={params.CLEAN_TOL|default(0.01)} HOT={hot} COOL={params.COOL|default(140)} PRESS={params.PRESS|default(0.32)}
            {% endfor %}
        {% else %}
            _NOZZLE_CLEAR_SCRUB HOT={hot} COOL={params.COOL|default(140)} PRESS={params.PRESS|default(0.32)}
        {% endif %}
    {% endif %}

# One NOZZLE_CLEAR UNTIL_CLEAN=1 pass: scrub at the last measured strip
# contact, re-probe the strip, then let _NOZZLE_CLEAN_CHECK decide. Passes
# after the clean one do nothing. (Klipper macros cannot call themselves, so
# NOZZLE_CLEAR unrolls the passes.)
[gcode_macro _NOZZLE_CLEAN_PASS]
variable_done: 0
gcode:
    {% if not printer["gcode_macro _NOZZLE_CLEAN_PASS"].done %}
        {% set before = printer.probe.last_z_result %}
        _NOZZLE_CLEAR_SCRUB HOT={params.HOT} COOL={params.COOL} PRESS={params.PRESS}
        G90
        G1 X150 Y355 F6000
        M400
        PROBE
        G1 Z5 F600
        _NOZZLE_CLEAN_CHECK PASS={params.PASS} MAX={params.MAX} TOL={params.TOL} BEFORE={before}
    {% endif %}

[gcode_macro _NOZZLE_CLEAN_CHECK]
gcode:
    {% set before = params.BEFORE|float %}
    {% set after = printer.probe.last_z_result %}
    {% set dropped = before - after %}
    {% if dropped < params.TOL|float %}
        SET_GCODE_VARIABLE MACRO=_NOZZLE_CLEAN_PASS VARIABLE=done VALUE=1
        RESPOND MSG="Nozzle clean after {params.PASS} scrub pass(es): strip contact {"%.4f"|format(after)}, moved {"%.4f"|format(dropped)} mm"
    {% elif params.PASS|int >= params.MAX|int %}
        RESPOND MSG="Nozzle scrub: strip contact still dropping {"%.4f"|format(dropped)} mm after {params.MAX} passes (contact {"%.4f"|format(after)}); check the nozzle"
    {% else %}
        RESPOND MSG="Nozzle scrub pass {params.PASS}: strip contact dropped {"%.4f"|format(dropped)} mm, scrubbing again"
    {% endif %}

[gcode_macro _NOZZLE_CLEAR_SCRUB]
gcode:
    {% set z = printer.probe.last_z_result - params.PRESS|float %}
    {% set hot = params.HOT|float %}
    {% set cool = params.COOL|float %}
    {% set accel = printer.toolhead.max_accel %}
    G90
    M106 S0
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
    M109 S{hot}
    # Stock order, traced from Creality's prtouch_v3: hot strokes start at
    # prth_clr_pose 185,355.5,10 (the smooth right tab) and run right, then fans on,
    # cool strokes further right with Y fixed, then stay down on the tab while
    # the nozzle cools so whatever is left sets flat and comes away with it
    G1 X185 Y355.5 F6000
    G1 Z{z + 1} F600
    G1 Z{z} F300
    SET_VELOCITY_LIMIT ACCEL=5000
    {% for i in range(6) %}
        G1 X195 F12000
        G1 X185 F12000
    {% endfor %}
    M400
    M106 S127
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=1
    G1 Z5 F300
    M109 S{[hot, 170]|min}
    G1 X205 Y355.5 F6000
    G1 Z{z + 1} F600
    G1 Z{z} F300
    {% for i in range(6) %}
        G1 X200 F12000
        G1 X205 F12000
    {% endfor %}
    M400
    M109 S{cool}
    M106 S0
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
    G1 Z5 F300
    SET_VELOCITY_LIMIT ACCEL={accel}
    M400
    RESPOND MSG="Nozzle scrubbed on the bed strip (strip Z {"%.3f"|format(z + params.PRESS|float)})"

[gcode_macro _HEAT_SOAK]
description: Wait for the bed to settle, counting down in the status line
gcode:
    {% set seconds = params.SECONDS|default(120)|int %}
    _STAGE TEXT="Heat soak ({seconds} s)"
    {% for left in range(seconds, 0, -1) %}
        M117 Heat soak: {"%d:%02d"|format(left // 60, left % 60)} left
        {% if left == seconds or left % 15 == 0 %}
            RESPOND MSG="Heat soak: {left}s left"
        {% endif %}
        G4 P1000
    {% endfor %}
    M117
    RESPOND MSG="Heat soak done"

# Bambu P2S start: wipe on the silicone while the nozzle cools to probing
# temperature with the part fan on full, so ooze freezes and gets stripped off
# instead of reaching the bed under the probe.
[gcode_macro _COOL_WIPE]
description: Wipe the nozzle while cooling it to probing temperature, fan on
gcode:
    {% set probe_temp = params.PROBE_TEMP|default(140)|float %}
    {% set uz = params.UNHOMED_Z|default(0)|int %}
    _STAGE TEXT="Cooling nozzle to {probe_temp|int}C and wiping"
    G90
    {% if not uz %}
        G1 Z5 F600
    {% endif %}
    M83
    # A mesh retry arrives here already at probing temperature: Klipper
    # refuses a cold retract and the error would stop the print.
    {% if printer.extruder.can_extrude %}
        G1 E-3 F1800
    {% endif %}
    M106 S255
    M104 S180
    # Wipes 1-3 stay over the chute (PARK=0); only the last one parks.
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=185
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz} PARK=0
    M104 S{probe_temp}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={probe_temp + 5}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    M107
    M109 S{probe_temp}

# Creality Print's K2 flush block (its start and change-filament G-code,
# 10-25): at the chute, part fan low, five fast pushes each followed by a
# 1 mm/s pause, a 5 s full-fan blast so the strand sets and snaps off, the
# retract, then the full wipe. PRE pushes back earlier retractions first.
[gcode_macro _CREALITY_FLUSH]
description: One Creality K2 flush block over the chute with blast and wipe
gcode:
    {% set length = params.LENGTH|default(90)|float %}
    {% set pre = params.PRE|default(0)|float %}
    {% set speed = params.SPEED|default(6)|float %}
    {% set retract = params.RETRACT|default(2)|float %}
    {% set fan_after = params.FAN_AFTER|default(30)|int %}
    {% set fan = params.FAN|default(30)|int %}
    M83
    M106 S{fan}
    G1 E{"%.3f"|format(length * 0.18 + pre)} F{speed * 60}
    G1 E{"%.3f"|format(length * 0.02)} F60
    {% for pulse in range(4) %}
        G1 E{"%.3f"|format(length * 0.18)} F{speed * 60}
        G1 E{"%.3f"|format(length * 0.02)} F60
    {% endfor %}
    M400
    M106 S255
    G4 P5000
    M106 S{fan_after}
    G1 E-{retract} F1800
    NOZZLE_WIPE CONFIRM=1

# Creality Print's K2 start prime line, on the front edge of the plate
# (Y-1, X105-160): a thick lead-in, alternating slow/fast thin segments,
# then a drag down to Z0 that wipes the tip. FLOW is the outer-wall
# volumetric speed (mm3/s); PRIME the retraction it pushes back first.
[gcode_macro _CREALITY_PRIME_LINE]
description: Creality K2 start prime line along the front edge
gcode:
    {% set flow = params.FLOW|default(12)|float %}
    {% set prime = params.PRIME|default(0.8)|float %}
    G90
    M83
    M204 S2000
    G1 Z3 F600
    G1 X105 Y-1 F30000
    G1 E{prime} F300
    G1 Z0.3 F1200
    G1 X130 E9 F{flow / 1.2 * 60}
    G1 X135 E0.3742 F{flow / 0.15 / 4 * 60}
    G1 X140 E0.3742 F{flow / 0.15 * 60}
    G1 X145 E0.3742 F{flow / 0.15 / 4 * 60}
    G1 X150 E0.3742 F{flow / 0.15 * 60}
    G1 X155 E0.3742 F{flow / 0.15 / 4 * 60}
    G91
    G1 X1 Z-0.3
    G1 X4
    # Lift off the bed: the slicer's first move is a fast travel to the
    # part before it sets Z, which dragged the nozzle across the plate at Z0
    G1 Z1 F600
    G90
    G92 E0

# What the printer is doing during a print start, load, tool change or
# calibration, for the touchscreen (and printer.gcode_macro _STAGE.text for
# anything else). _STAGE TEXT="..." sets it, _STAGE CLEAR=1 clears it.
[gcode_macro _STAGE]
variable_text: ''
gcode:
    {% if params.CLEAR|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=_STAGE VARIABLE=text VALUE="''"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_STAGE VARIABLE=text VALUE="'{(params.TEXT|default(''))|replace("'", '')}'"
    {% endif %}

[gcode_macro START_PRINT]
description: Heat, clean, precision-home, adaptive-mesh, and prepare the CFS slot
# Set when the slicer gave no TOOL: the first T0-T3 command loads that slot.
variable_cfs_pending: 0
# Set around START_PRINT's own Z home: the nozzle was just cool-wiped, so
# homing_override skips its in-print re-wipe.
variable_skip_home_wipe: 0
# BED_MESH_CHECK limits after the mesh (mm, and mm per mm between points)
variable_mesh_max_deviation: 0.35
variable_mesh_max_slope: 0.006
# A mesh over those limits is usually debris on the nozzle tip touching
# first: clean the nozzle, measure Z and the mesh again, this many times,
# before the print stops and asks you to clean the nozzle and the plate.
variable_dirty_retries: 2
# First-layer height correction (mm, lowers the nozzle). Z is measured with
# the nozzle at 140C but the print runs hotter; stock prtouch applies
# temp_non_linaer_c 0.045 for this and the open driver does not. The 9-pad
# test on 10-26 lifted off at 0 and stuck at 0.05; the 60C motor-mount run
# then showed the nozzle ploughing first-layer infill at 0.05; at 0.03 the
# infill lines sat slightly apart, and 0.03 and 0.04 looked the same on the
# textured plate (10-27), so 0.04.
# K2 Plus: Creality's own correction, 0.050 mm at 220 C and 0.079 at
# 250 C (tapped at 140 C), with hot_z_quad below.
variable_hot_z_comp: 0.017316
# Opt-in print-temperature scaling of hot_z_comp (from the K2 Plus firmware's
# thermal_expansion, which ships 0.00083 mm/C). Their model: the nozzle grows
# toward the bed as it heats, so a hotter print needs the nozzle HIGHER. Ours
# taps at a fixed 140C, so only the print temperature varies: the offset used
# is hot_z_comp - hot_z_rate * (EXTRUDER_TEMP - hot_z_ref_temp), with
# hot_z_ref_temp the print temperature hot_z_comp was tuned at. 0 = today.
variable_hot_z_rate: 0
variable_hot_z_ref_temp: 220
# Stock prtouch's non-linear form (temp_non_linaer_a/_c): hot_z_quad
# (mm per C squared) x (EXTRUDER_TEMP - hot_z_tap_temp)^2 is added, so a
# hotter print gets the nozzle a little lower. 0 on the K2 (stock gives it a
# flat 0.045); the K2 Plus uses Creality's 5.1e-6 with 0.017316.
variable_hot_z_quad: 0.0000051
variable_hot_z_tap_temp: 140
# YOUR first-layer adjustment, like Creality's Z offset and Mainsail's live
# Z offset buttons: negative = nozzle closer to the bed, positive = further
# away, e.g. -0.02. Added on top of the built-in correction above, which
# stays the model's own value (keep this small: hundredths of a mm).
variable_z_offset: 0
# Per-material first-layer correction added to hot_z_comp (mm, positive
# lowers the nozzle), after the K2 Plus firmware's offset_<MATERIAL>, e.g.
# variable_hot_z_material: {'PLA': -0.01, 'PETG': 0.0}. The material comes
# from START_PRINT MATERIAL= if the slicer sends it, else from the loaded
# slot's filament record (slot E without a CFS).
variable_hot_z_material: {}
# Opt-in: after the Z tap, scrub the strip until the measured contact stops
# moving (NOZZLE_CLEAR UNTIL_CLEAN=1), then tap Z again with the clean
# nozzle. 0 = today's single scrub after the tap.
variable_scrub_until_clean: 0
# Opt-in: 'detect' scrubs with NOZZLE_CLEAR METHOD=detect (the K2 Plus
# firmware's PRTOUCH_SCRUB) after the cool-wipe and BEFORE the Z tap, like
# the K2 Plus, so the Z tap and the mesh use the scrubbed nozzle and no
# second tap is needed; scrub_until_clean is then ignored. 'fixed' = today.
variable_scrub_method: 'fixed'
# K2 Plus: False skips the rear cleaning strip scrub
variable_scrub_strip: True
# Still homed from the previous print (it finished or was cancelled from
# Mainsail, the screen or the slicer, and the motors stayed on): skip the
# trip to the bottom switch and the X/Y homing, like stock. Z is still
# measured by the nozzle tap as on every print. Anything else (a restart,
# motors off, idle timeout, a safety-watch stop, a print that failed or
# stopped in START_PRINT) homes in full. False = always home in full.
variable_warm_start: True
# Set by END_PRINT (and so a normal cancel), cleared as START_PRINT begins.
variable_warm_ready: 0
gcode:
    # No flow cap carried over from the last print (_FLOW_AUTO sets one)
    SET_MAX_FLOW FLOW=0
    {% if printer["gcode_macro _FAN_AUTO"].on_print_start|int %}
        # Part fan health: a 3 s blast at full while everything else heats
        _FAN_AUTO FAN=part SPIN=1
    {% endif %}
    # First print only: is the bed on 110 V or 220 V mains (hark_bed_power)
    _BED_POWER_AUTO
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_PAUSE VARIABLE=done VALUE=0
    {% set sp0 = printer["gcode_macro START_PRINT"] %}
    {% set warm = sp0.warm_start|string|lower in ("true", "1")
                  and sp0.warm_ready|int == 1
                  and printer.toolhead.homed_axes == "xyz"
                  and printer.k2_motor_bus.motors_ready %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|float %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool < -1 or tool > 3 %}
        { action_raise_error("START_PRINT TOOL must be 0, 1, 2, or 3") }
    {% endif %}
    # The slot each of the file's tools prints from: A-D for T0-T3 unless
    # CFS_TOOL_MAP (the touchscreen's filament step) set others, or E, the
    # external spool on the rear holder
    {% set hs = printer.hark_cfs_slots %}
    {% set tmap = hs.tool_map %}
    {% set cfs_fitted = printer.k2_cfs.fitted %}
    # From the external spool: always without a CFS (cfs_fitted: False), or
    # mapped to it with one. One filament for the whole print, primed at
    # the chute here instead of loaded from a slot; every tool prints it.
    {% set external = hs.tool_map_external %}
    {% if not cfs_fitted %}
        {% if tool > 0 and tmap["T%d" % tool] != "E" %}
            { action_raise_error("This printer has no CFS, but the file asks for T%d. Slice it for one filament (T0), or map it to the external spool (CFS_TOOL_MAP T%d=E)." % (tool, tool)) }
        {% endif %}
        {% set tool = [tool, 0]|max %}
    {% elif external %}
        {% set tool = [tool, 0]|max %}
    {% endif %}
    {% set slot = tmap["T%d" % tool] if tool >= 0 else "" %}
    {% if hs.tool_map_set %}
        RESPOND MSG="Filament map: T0 {tmap.T0 or '-'}, T1 {tmap.T1 or '-'}, T2 {tmap.T2 or '-'}, T3 {tmap.T3 or '-'}{' (E = external spool)' if 'E' in tmap.values() else ''}"
    {% endif %}
    {% if external and cfs_fitted %}
        # The CFS cannot feed while the rear spool is in the toolhead, and
        # the rear spool cannot go in while a slot is: stop before heating
        {% if printer.k2_cfs.active_slot %}
            { action_raise_error("This print uses the external spool, but CFS slot %s is loaded in the toolhead. Run LOAD_FILAMENT SLOT=E: it unloads slot %s, then push the rear spool in and run it again." % (printer.k2_cfs.active_slot, printer.k2_cfs.active_slot)) }
        {% endif %}
        {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
            { action_raise_error("This print uses the external spool, but there is no filament at the toolhead. Push the rear spool in until it stops at the extruder, run LOAD_FILAMENT SLOT=E, then start the print again.") }
        {% endif %}
    {% endif %}
    # The print's material: START_PRINT MATERIAL= if the slicer sends it,
    # else the loaded slot's filament record (slot E for the external
    # spool). Used for the chamber target and the first-layer offset.
    {% set material = (params.MATERIAL|default(""))|upper %}
    {% if not material %}
        {% set records = hs.slots %}
        {% set rec_slot = slot %}
        {% if rec_slot and rec_slot in records and records[rec_slot].loaded %}
            {% set material = (records[rec_slot].type or "")|upper %}
        {% endif %}
    {% endif %}
    # Soft filaments (_SOFT_FILAMENT) slip in the gears when pushed fast: their
    # prime-out, flush and prime line run at the material's flow cap
    {% set soft = printer["gcode_macro _SOFT_FILAMENT"].max_flow %}
    {% set sf = namespace(cap=0.0) %}
    {% for k in soft %}
        {% if material.startswith(k) %}{% set sf.cap = soft[k]|float %}{% endif %}
    {% endfor %}
    # Part fan while the start flush comes out (_PURGE_FAN)
    {% set pf = printer["gcode_macro _PURGE_FAN"] %}
    {% set flush = namespace(fan=pf.default|int) %}
    {% for k in pf.material %}
        {% if material.startswith(k) %}{% set flush.fan = pf.material[k]|int %}{% endif %}
    {% endfor %}
    _CFS_CHECK
    # Bed temperature as the job arrives (Jinja renders before M140 runs).
    # A bed already held at temperature has a settled plate and frame, so
    # the soak only has to cover however far it had cooled.
    {% set bed_gap = bed_temp - printer.heater_bed.temperature %}
    {% if bed_gap <= 3 %}
        {% set soak = 0 %}
    {% elif bed_gap < 15 %}
        {% set soak = (30 + 90 * (bed_gap - 3) / 12)|int %}
    {% else %}
        {% set soak = 120 %}
    {% endif %}
    {% if bed_temp < 0 or bed_temp > 110 %}
        { action_raise_error("START_PRINT BED_TEMP must be 0-110C") }
    {% endif %}
    {% if extruder_temp < 170 or extruder_temp > 350 %}
        { action_raise_error("START_PRINT EXTRUDER_TEMP must be 170-350C") }
    {% endif %}
    {% set scrub_method = printer["gcode_macro START_PRINT"].scrub_method|string|lower %}
    {% if scrub_method not in ("fixed", "detect") %}
        { action_raise_error("START_PRINT scrub_method must be 'fixed' or 'detect'") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_HARK_TOOL VARIABLE=current VALUE={tool}
    UPDATE_DELAYED_GCODE ID=_LIGHT_AUTO_OFF DURATION=0
    {% if printer["gcode_macro _LIGHT_IDLE"].off_after|int > 0 %}
        SET_PIN PIN=chamber_led VALUE=1
    {% endif %}
    # Clear any old offset so homing and probing moves are not shifted.
    SET_GCODE_OFFSET Z=0
    M107
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    # Automatic chamber control for this print. The target is whatever the
    # slicer's M191/M141 set before this macro, else the material's
    # (material_targets), else 35C; it goes back to the default when the
    # print ends. A previous print's end vent stops here.
    {% set cf = printer["gcode_macro _CHAMBER_FAN"] %}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_VENT_END DURATION=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=vent VALUE=0
    {% if (not cf.slicer_set|int or cf.prefer_material|int) and material in cf.material_targets %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=target VALUE={cf.material_targets[material]}
        RESPOND MSG="Chamber target {cf.material_targets[material]}C for {material}: the exhaust fan vents above {cf.material_targets[material] + 2}C"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=manual VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN VARIABLE=on VALUE=0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10
    M107 P2
    M140 S{bed_temp}
    M104 S140

    # One heat cycle before probing. No Z contact yet (a crusted nozzle
    # cannot fake one), load and purge at print temperature over the
    # chute while the bed heats and soaks, wipe while cooling to probing
    # temperature, then the clean nozzle measures Z, scrapes on the bed
    # strip and goes straight to the mesh.
    # Absolute Z from the PA15 bottom switch on every print, so the precise
    # tap below always starts from a known 5 mm whatever happened to Z since
    # the last home (a stale Z made the tap miss the bed, 10-25). The bed
    # waits at the bottom through the load and purge.
    {% if warm %}
        # Warm start (warm_start): X, Y and Z kept from the last print,
        # which left the bed at least half way down (END_PRINT). The Z tap
        # below still measures Z.
        _STAGE TEXT="Still homed: skipping the bed park and X/Y homing"
        RESPOND MSG="Still homed since the last print: bed park and X/Y homing skipped (Z is measured as usual)"
        {% if printer.toolhead.position.z|float < 5.0 %}
            G90
            G1 Z5 F600
        {% endif %}
    {% else %}
        _STAGE TEXT="Homing"
        KZ_ALIGN_BOTTOM CONFIRM=1
        G28 X Y
    {% endif %}
    CFS_PURGE_POSITION CONFIRM=1 UNHOMED_Z=1
    {% if tool >= 0 %}
        M104 S{extruder_temp}
        # Wait only while the bed is still heating. M190 also waits for a
        # hotter bed to cool to target and for the PID to settle within 1C,
        # which cost 2-5 min on 10-26. The bed keeps soaking through the
        # load, purge and wipes before the Z tap.
        _STAGE TEXT="Heating: bed to {bed_temp|int}C, nozzle to {extruder_temp|int}C"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
        M109 S{extruder_temp}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        # The load and purge, then the cool-down, give the bed its soak
        {% if not external %}
            _STAGE TEXT="Loading slot {slot} and purging"
            CFS_PRINT_START SLOT={slot} CONFIRM=1 UNHOMED_Z=1
        {% else %}
            {% if cfs_fitted %}
                # The box stays idle: the extruder pulls the rear spool
                CFS_FEED_STOP
            {% endif %}
            _STAGE TEXT="Priming the external spool"
            _SPOOL_PRINT_START{(" FEED=%.1f" % (sf.cap / 2.405 * 60)) if sf.cap else ""}
        {% endif %}
        {% if printer["gcode_macro _PA_AUTO"].on_print_start|int and not external and not sf.cap
              and printer.k2_cfs.active_slot != slot %}
            # Still at print temperature at the chute; the feed stays armed
            # for the flush that follows
            _PA_AUTO SLOT={slot} KEEP_FEED=1
        {% endif %}
        {% if printer["gcode_macro _FLOW_AUTO"].on_print_start|int and not external and not sf.cap %}
            # Same place: find this filament's melt limit at the print
            # temperature and cap this print's flow to it
            _FLOW_AUTO SLOT={slot} KEEP_FEED=1
        {% endif %}
        {% if printer["gcode_macro _FAN_AUTO"].on_print_start|int %}
            # Hotend fan health: it runs at full now the nozzle is hot
            _FAN_AUTO FAN=hotend
        {% endif %}
    {% else %}
        # Creality Print and stock Orca K2 jobs omit TOOL and send Tn next.
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=1
        { action_respond_info("START_PRINT: CFS slot load deferred to the first T command") }
        _STAGE TEXT="Heating bed to {bed_temp|int}C"
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
        {% if soak > 0 %}
            _HEAT_SOAK SECONDS={soak}
        {% else %}
            RESPOND MSG="Heat soak skipped: bed was already at {bed_temp|int}C"
        {% endif %}
    {% endif %}
    _COOL_WIPE PROBE_TEMP=140 UNHOMED_Z=1
    {% if tool >= 0 and bed_gap >= 15 %}
        # Cold start: the plate edges warm after the centre and keep rising.
        # On 10-26 a 28C start reached the Z tap 221 s after the bed hit
        # temperature and the right edge printed a little close; runs
        # with 260+ s were right. Top the soak up to about 5 minutes.
        _HEAT_SOAK SECONDS=90
    {% endif %}

    {% if scrub_method == "detect"
          and printer["gcode_macro START_PRINT"].scrub_strip %}
        # Scrub before the Z tap. Z is known from KZ_ALIGN_BOTTOM (within
        # about 0.06 mm of the tap) and every scrub depth is relative to
        # contacts measured on the strip. If the first strip tap misses,
        # the scrub stops and reports, and the Z tap runs as usual. Go to
        # the bed centre first, as the Z home does, before the bed comes up
        # to 5 mm.
        G90
        G1 X175 Y175 F6000
        NOZZLE_CLEAR METHOD=detect HOT=140 COOL=140
    {% endif %}
    _STAGE TEXT="Measuring Z (nozzle tap)"
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=1
    G28 Z
    # K2 Plus: level the two Z motors on two taps across X, then measure
    # Z again on the levelled bed
    _STAGE TEXT="Levelling the bed (Z tilt)"
    _Z_TILT_START
    G28 Z
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    {% if not printer["gcode_macro START_PRINT"].scrub_strip %}
        # K2 Plus beta: strip scrub off (scrub_strip)
    {% elif scrub_method == "detect" %}
        # Already scrubbed before the tap.
    {% elif printer["gcode_macro START_PRINT"].scrub_until_clean %}
        NOZZLE_CLEAR HOT=180 COOL=140 UNTIL_CLEAN=1
        # The tip is now clean: measure the contact plane again with it.
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=1
        G28 Z
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
    {% else %}
        NOZZLE_CLEAR HOT=180 COOL=140
    {% endif %}
    # Mesh taps at 3 mm/s (Z home stays at 1 mm/s). 0.75/3/5 mm/s read the
    # same bed shape on 10-26 (sd < 3 um, 3 mm/s within 0.005 of 0.75),
    # and 3 mm/s saves about 1 s per point.
    # Adaptive mesh over the model AND the prime tower. The plain adaptive
    # mesh only probes under the objects, so the tower printed on the mesh
    # edge stretched outwards and came loose (10-25). Orca passes the tower
    # with TOWER_X/TOWER_Y (front-left corner) and TOWER_W (0 = no tower).
    {% set tower_w = params.TOWER_W|default(0)|float %}
    {% set objs = printer.exclude_object.objects %}
    {% if tower_w > 0 and objs %}
        {% set bm = printer.configfile.settings.bed_mesh %}
        {% set xs = [] %}
        {% set ys = [] %}
        {% for o in objs %}
            {% for pt in o.polygon %}
                {% set _ = xs.append(pt[0]) %}
                {% set _ = ys.append(pt[1]) %}
            {% endfor %}
        {% endfor %}
        {% set tx = params.TOWER_X|default(0)|float %}
        {% set ty = params.TOWER_Y|default(0)|float %}
        {% set _ = xs.extend([tx, tx + tower_w]) %}
        {% set _ = ys.extend([ty, ty + tower_w]) %}
        {% set m = bm.adaptive_margin %}
        {% set x0 = [xs|min - m, bm.mesh_min[0]]|max %}
        {% set y0 = [ys|min - m, bm.mesh_min[1]]|max %}
        {% set x1 = [xs|max + m, bm.mesh_max[0]]|min %}
        {% set y1 = [ys|max + m, bm.mesh_max[1]]|min %}
        {% set sx = (bm.mesh_max[0] - bm.mesh_min[0]) / (bm.probe_count[0] - 1) %}
        {% set sy = (bm.mesh_max[1] - bm.mesh_min[1]) / (bm.probe_count[1] - 1) %}
        {% set cx = [[((x1 - x0) / sx)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[0]]|min %}
        {% set cy = [[((y1 - y0) / sy)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[1]]|min %}
        RESPOND MSG="Mesh covers the model and prime tower: X{x0|round(1)}-{x1|round(1)} Y{y0|round(1)}-{y1|round(1)}, {cx}x{cy} points"
        SET_GCODE_VARIABLE MACRO=_MESH_ATTEMPT VARIABLE=area VALUE="'MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={cx},{cy}'"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_MESH_ATTEMPT VARIABLE=area VALUE="'ADAPTIVE=1'"
    {% endif %}
    # Probe and check the mesh. Normal adaptive meshes read ~0.04mm and a
    # slope under 0.001; the full bed read 0.254mm on 10-24. A mesh over the
    # limits (a tap the mesh guard could not fix, usually debris on the
    # nozzle tip, 10-31) gets the nozzle cleaned and Z and the mesh measured
    # again, dirty_retries times, before the print stops.
    SET_GCODE_VARIABLE MACRO=_MESH_ATTEMPT VARIABLE=cleans VALUE=0
    _MESH_ATTEMPT
    {% for i in range(printer["gcode_macro START_PRINT"].dirty_retries|int) %}
        _MESH_RETRY_IF_BAD
    {% endfor %}
    _MESH_STOP_IF_BAD

    # Leave the probed surface before final heating so nozzle ooze falls into
    # the purge bucket instead of onto the just-measured bed.
    G90
    G1 Z5 F600
    M400
    _STAGE TEXT="Heating nozzle to {extruder_temp|int}C"
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{extruder_temp}
    {% if tool >= 0 %}
        # Creality's last start flush block at print temperature: push back
        # the purge (2) and cool-wipe (3) retractions, pulsed flush, 5 s
        # blast so the strand snaps off, retract, full wipe.
        _STAGE TEXT="Purging"
        _CREALITY_FLUSH LENGTH={40 if sf.cap else 90} PRE=5 FAN={flush.fan} FAN_AFTER=0{(" SPEED=%.3f" % (sf.cap / 2.405)) if sf.cap else ""}
    {% endif %}

    M220 S100
    M221 S100
    {% if tool >= 0 %}
        _STAGE TEXT="Prime line"
        _CREALITY_PRIME_LINE{(" FLOW=%.1f" % sf.cap) if sf.cap else ""}
    {% endif %}
    # Stock runs accel_to_decel = accel; 0.5 here made curves stutter.
    SET_VELOCITY_LIMIT ACCEL=20000 MINIMUM_CRUISE_RATIO=0.0
    # Applied after the prime line; the slicer's first move takes it up.
    # Written as 0 - x: a leading "{-" is Jinja whitespace control, not a
    # minus, and set +0.05 on 10-26.
    {% set sp = printer["gcode_macro START_PRINT"] %}
    {% set mat_comp = (sp.hot_z_material[material] if material in sp.hot_z_material else 0)|float %}
    {% set hot_dt = [extruder_temp - sp.hot_z_tap_temp, 0]|max %}
    {% set hot_comp = sp.hot_z_comp + mat_comp - sp.hot_z_rate * (extruder_temp - sp.hot_z_ref_temp) + sp.hot_z_quad * hot_dt * hot_dt - sp.z_offset %}
    {% if hot_comp|abs > 0.3 %}
        { action_raise_error("START_PRINT: hot Z comp %.3f mm is implausible; check z_offset/hot_z_comp/hot_z_material/hot_z_rate/hot_z_ref_temp" % hot_comp) }
    {% endif %}
    {% if sp.hot_z_rate != 0 or mat_comp != 0 or sp.hot_z_quad != 0 or sp.z_offset != 0 %}
        RESPOND MSG="First-layer Z comp {"%.4f"|format(hot_comp)} mm: {sp.hot_z_comp}{(" %+.3f (%s)" % (mat_comp, material)) if mat_comp else ""}{(" - %s mm/C x (%d - %d) C" % (sp.hot_z_rate, extruder_temp, sp.hot_z_ref_temp)) if sp.hot_z_rate != 0 else ""}{(" + %s x %d^2" % (sp.hot_z_quad, hot_dt)) if sp.hot_z_quad != 0 else ""}{(", your z_offset %+.3f" % sp.z_offset) if sp.z_offset != 0 else ""}"
    {% endif %}
    SET_GCODE_OFFSET Z={0 - hot_comp}
    G90
    M83
    G92 E0
    _STAGE CLEAR=1

# Print-start bed mesh with clean-and-retry (START_PRINT dirty_retries).
# Klipper renders a macro once when it starts, and a macro cannot call
# itself, so each step is its own macro and reads the last check fresh.
[gcode_macro _MESH_ATTEMPT]
description: Probe the print-start bed mesh and check it (no stop on a bad mesh)
# MESH_MIN/MAX/PROBE_COUNT for this print, or ADAPTIVE=1 (set by START_PRINT)
variable_area: 'ADAPTIVE=1'
variable_cleans: 0
gcode:
    {% set sp = printer["gcode_macro START_PRINT"] %}
    _STAGE TEXT="Bed mesh"
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE {printer["gcode_macro _MESH_ATTEMPT"].area} PROBE_SPEED=3
    # Nothing queued while a dense mesh is checked (GitHub issue #4)
    M400
    BED_MESH_CHECK MAX_DEVIATION={sp.mesh_max_deviation} MAX_SLOPE={sp.mesh_max_slope} REPORT=1
    M400

[gcode_macro _MESH_RETRY_IF_BAD]
description: After a failed mesh check: clean the nozzle, measure Z and the mesh again
gcode:
    {% if not printer.hark_mesh_check.ok %}
        {% set sp = printer["gcode_macro START_PRINT"] %}
        {% set n = printer["gcode_macro _MESH_ATTEMPT"].cleans + 1 %}
        SET_GCODE_VARIABLE MACRO=_MESH_ATTEMPT VARIABLE=cleans VALUE={n}
        RESPOND TYPE=error MSG="Bed mesh over the limit ({printer.hark_mesh_check.summary}): likely debris on the nozzle tip. Cleaning the nozzle and measuring again ({n} of {sp.dirty_retries|int})"
        _STAGE TEXT="Nozzle dirty? Cleaning and measuring again ({n}/{sp.dirty_retries|int})"
        _COOL_WIPE PROBE_TEMP=140
        {% if sp.get('scrub_strip', True) %}
            NOZZLE_CLEAR HOT=180 COOL=140
        {% endif %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=1
        G28 Z
        {% if 'z_tilt' in printer.configfile.settings %}
            Z_TILT_ADJUST
            G28 Z
        {% endif %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=skip_home_wipe VALUE=0
        _MESH_ATTEMPT
    {% endif %}

[gcode_macro _MESH_STOP_IF_BAD]
description: Stop the print when the mesh is still over the limit after cleaning
gcode:
    {% if not printer.hark_mesh_check.ok %}
        {% set n = printer["gcode_macro _MESH_ATTEMPT"].cleans %}
        {% set why = printer.hark_mesh_check.summary %}
        RESPOND TYPE=error MSG="Bed mesh still over the limit after {n} nozzle clean(s): heaters off, stopping the print"
        TURN_OFF_HEATERS
        M107
        _STAGE TEXT="Nozzle tip or plate dirty: clean both, then start again"
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Nozzle tip or plate dirty"
        RESPOND TYPE=command MSG="action:prompt_text The bed mesh is still over the limit after {n} nozzle clean(s): {why}."
        RESPOND TYPE=command MSG="action:prompt_text Something on the nozzle tip or the plate touches first. Let the nozzle cool, clean the tip and the plate, then start the print again."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
        # The error goes in its own macro: an error raised here would stop
        # this macro before any line above ran (Klipper renders it first).
        _MESH_ABORT
    {% endif %}

[gcode_macro _MESH_ABORT]
description: Stop the print with the failed-mesh reason (heaters already off)
gcode:
    {action_raise_error("Print stopped: bed mesh still over the limit after %d nozzle clean(s) (%s). Clean the nozzle tip and the plate, then start again." % (printer["gcode_macro _MESH_ATTEMPT"].cleans, printer.hark_mesh_check.summary))}

# Stock K2 slicer compatibility (2026-10-24). START_PRINT already purges into
# the bucket and wipes, so the stock adaptive purge line is not needed.
[gcode_macro LINE_PURGE]
description: Stock K2 purge line; START_PRINT already purged into the bucket
gcode:
    { action_respond_info("LINE_PURGE skipped: START_PRINT purged into the bucket") }

[gcode_macro M191]
description: Set the chamber target and wait for the PTC heater (over 40C)
gcode:
    {% set target = params.S|default(0)|float %}
    M141 S{target}
    {% if printer.hark_chamber.enabled
          and target > printer.hark_chamber.min_heat_target %}
        CHAMBER_HEAT TARGET={target} WAIT=1
    {% endif %}

# Mid-print slot change. The chute purge is the slicer's own per-change
# length: Orca's change-filament G-code sets next_purge to {flush_length}
# (mm) just before the T command. That is the flush matrix times the flush
# multiplier, less what Orca already flushes into infill, objects or
# support, so it is used for every change: as is between two slots of the
# same material (30-360 mm), and at least the stock purge for a change of
# material (FLUSH=). When the slicer passes nothing, the print file's own
# flush_volumes_matrix sets the length ([k2_cfs] toolchange_purge_from_file,
# on by default), and only a file without one falls back to pla_purge (PLA
# to PLA) or the stock purge. A file printed by object always gets at least
# the stock purge, because nothing else clears the old colour.
[gcode_macro _CFS_TC]
variable_pla_purge: 70
variable_next_purge: 0
gcode:
    {% set new = params.SLOT|upper %}
    # The file's tools, for its flush matrix (they differ from the slots
    # when CFS_TOOL_MAP moved them)
    {% set tools = (" TOOL=%d OLD_TOOL=%d" % (params.TOOL|int, params.OLD_TOOL|int)) if params.TOOL is defined and params.OLD_TOOL is defined else "" %}
    # The box can report no active slot while it follows the extruder
    {% set old = printer.k2_cfs.active_slot or printer.k2_cfs.feed_slot %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set t_new = (slots[new].type if new in slots else "")|upper %}
    {% set t_old = (slots[old].type if old and old in slots else "")|upper %}
    {% set flush = printer["gcode_macro _CFS_TC"].next_purge|float %}
    SET_GCODE_VARIABLE MACRO=_CFS_TC VARIABLE=next_purge VALUE=0
    _STAGE TEXT="Changing filament: slot {old or '-'} to {new}"
    {% if t_new and t_new == t_old and flush > 0 %}
        CFS_TOOLCHANGE SLOT={new} PURGE={"%.1f"|format([[flush, 30]|max, 360]|min)}{tools}
    {% elif flush > 0 %}
        CFS_TOOLCHANGE SLOT={new} FLUSH={"%.1f"|format([flush, 360]|min)}{tools}
    {% elif t_new == "PLA" and t_old == "PLA" %}
        CFS_TOOLCHANGE SLOT={new} PURGE_FALLBACK={printer["gcode_macro _CFS_TC"].pla_purge}{tools}
    {% else %}
        CFS_TOOLCHANGE SLOT={new}{tools}
    {% endif %}
    _STAGE CLEAR=1

# The file's tools T0-T3 print from the slot hark_cfs_slots.tool_map gives:
# A-D by default, or what CFS_TOOL_MAP (the touchscreen's filament step) set
# for this print, including E, the external spool on the rear holder. Two
# tools mapped to one slot share it (no change between them). Without a CFS
# the rear spool is T0 and uses slot E's filament record (pressure advance,
# retraction) when one is set; T1-T3 print from it only when mapped to E.
[gcode_macro _NO_CFS_TOOL]
gcode:
    {% if printer.hark_cfs_slots.tool_map["T%d" % params.T|int] != "E" %}
        { action_raise_error("This printer has no CFS: the file asks for T%s but only T0 (the rear spool) exists. Slice it for one filament, or map it to the rear spool (CFS_TOOL_MAP T%s=E)." % (params.T, params.T)) }
    {% endif %}

# T0-T3 body. M8800-M8803 are k2_cfs's own T0-T3 (arm the slot already
# selected for A-D). `current` is the tool last selected, for the flush
# matrix lookup of a mid-print change.
[gcode_macro _HARK_TOOL]
variable_current: -1
gcode:
    {% set t = params.T|int %}
    {% set slot = printer.hark_cfs_slots.tool_map["T%d" % t] %}
    {% set old_tool = printer["gcode_macro _HARK_TOOL"].current|int %}
    {% set cfs = printer.k2_cfs %}
    {% set state = printer.print_stats.state %}
    {% if not cfs.fitted %}
        _NO_CFS_TOOL T={t}
    {% elif slot == "E" %}
        # The external spool feeds the whole print (START_PRINT primed it)
        {% if printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
            SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        {% endif %}
    {% elif printer["gcode_macro START_PRINT"].cfs_pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
        CFS_PRINT_START SLOT={slot} CONFIRM=1
        M880{"ABCD".index(slot)}
    {% elif state == "printing" %}
        _CFS_TC SLOT={slot}{(" TOOL=%d OLD_TOOL=%d" % (t, old_tool)) if old_tool >= 0 else ""}
    {% else %}
        M880{"ABCD".index(slot)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_HARK_TOOL VARIABLE=current VALUE={t}
    CFS_SLOT_APPLY SLOT={slot or "E"}

[gcode_macro T0]
description: Print filament 1: CFS slot A, or the slot CFS_TOOL_MAP gives (loads it at print start, changes to it mid-print)
rename_existing: M8800
gcode:
    _HARK_TOOL T=0

[gcode_macro T1]
description: Print filament 2: CFS slot B, or the slot CFS_TOOL_MAP gives (loads it at print start, changes to it mid-print)
rename_existing: M8801
gcode:
    _HARK_TOOL T=1

[gcode_macro T2]
description: Print filament 3: CFS slot C, or the slot CFS_TOOL_MAP gives (loads it at print start, changes to it mid-print)
rename_existing: M8802
gcode:
    _HARK_TOOL T=2

[gcode_macro T3]
description: Print filament 4: CFS slot D, or the slot CFS_TOOL_MAP gives (loads it at print start, changes to it mid-print)
rename_existing: M8803
gcode:
    _HARK_TOOL T=3

[gcode_macro CANCEL_PRINT]
description: Cancel the print: lift and park like the end of a print, staying homed (SAFE=1: no motion, motors off)
rename_existing: CANCEL_PRINT_BASE
gcode:
    # Stop virtual-SD execution before changing machine state.
    CANCEL_PRINT_BASE
    _STAGE CLEAR=1
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=cfs_pending VALUE=0
    SET_MAX_FLOW FLOW=0
    CFS_TOOL_MAP RESET=1 QUIET=1
    {% if not params.SAFE|default(0)|int %}
        # Like stock (END_PRINT then CANCEL_PRINT_BASE): heaters off, lift,
        # park, motors kept on so the next print can skip homing
        END_PRINT
    {% else %}
        # SAFE=1 (the safety watch, after a motor fault): do not move, since
        # motion or the toolhead may be what is unsafe; motors off, and the
        # next print homes in full.
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=0
        TURN_OFF_HEATERS
        M107
        M107 P1
        M107 P2
        CFS_FEED_STOP
        # Stock idle state between prints
        CFS_PRELOAD ENABLE=1
        BED_MESH_CLEAR
        EXCLUDE_OBJECT RESET=1
        EXCLUDE_OBJECT_DEFINE RESET=1
        M220 S100
        M221 S100
        M84
        _CHAMBER_VENT
        _LIGHT_IDLE
    {% endif %}

[gcode_macro END_PRINT]
description: Heaters off, lift and park after a print (also a normal cancel); motors stay on
gcode:
    M400
    # The filament map (CFS_TOOL_MAP) was for this print only
    CFS_TOOL_MAP RESET=1 QUIET=1
    # A flow cap measured for this print (_FLOW_AUTO) ends with it
    SET_MAX_FLOW FLOW=0
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G92 E0
        G1 E-1 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M107 P1
    M107 P2

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% set z_hop = [[max_z - act_z, 0.0]|max, 2.0]|min %}
        G91
        G1 Z{z_hop} F600
        G90
    {% endif %}
    {% if "x" in printer.toolhead.homed_axes
          and "y" in printer.toolhead.homed_axes %}
        G90
        G1 Y345 F12000
        G1 X225 F12000
    {% endif %}
    {% if "z" in printer.toolhead.homed_axes and act_z + 2.0 < max_z / 2 %}
        # Stock END_PRINT_POINT: the bed goes half way down to hand the
        # print over (and gives the next print's purge room)
        G90
        G1 Z{max_z / 2} F600
    {% endif %}

    BED_MESH_CLEAR
    EXCLUDE_OBJECT RESET=1
    EXCLUDE_OBJECT_DEFINE RESET=1
    M220 S100
    M221 S100
    # No M84, like stock: the motors hold the bed and keep homing, so the
    # next print skips the bottom park and X/Y homing (warm_start). The
    # idle timeout switches them off.
    CFS_FEED_STOP
    # Stock idle state between prints
    CFS_PRELOAD ENABLE=1
    _CHAMBER_VENT
    {% if printer.toolhead.homed_axes == "xyz" %}
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=warm_ready VALUE=1
    {% endif %}
    _LIGHT_IDLE

[force_move]
enable_force_move: true

[hark_compat]

# [fan_feedback] (Creality's fancheck reader, for master-server's
# get_cx_fan_status webhook) is gone since 11-03: the same tachometer pins
# are now the fans' own tachometer_pin, so Klipper reports rpm itself.

[k2_motor_bus]
serial: /dev/ttyS5
baud: 230400
# Wake the closed-loop X/Y/E motors ourselves instead of relying on stock
# Klipper having run first (2026-10-24)
init_motors: True
extruder_motor_mcu: nozzle_mcu
# Step/dir levels held while the motors wake (PB7 high = Y driver; the
# extruder needs its dir line low, which a print can leave high)
wake_pins: PB9=0, PB10=0, PB7=1, PB8=0, PB5=0, PB6=1, PA1=1, PB15=1, nozzle_mcu:PB4=0, nozzle_mcu:PB5=0
bus_motors: x=0x81, y=0x82, z=0x83, z1=0x84
extruder_addr: 0x85, 0x81
# The CFS loses its bus address at power-off. At ready the driver finds it
# with the stock discover broadcast and gives it back; cfs_uniid (this CFS's
# id, shown by CFS_QUERY CMD=BOX_STATE) is optional and tried first.
#cfs_uniid:
# Reply checks and motor guards (defaults shown; see docs/MOTOR-CONTROLLER.md)
#reply_check: strict
#stall_mode_check: warn
# console_frames: True shows the raw bus frames in console messages
# (they always go to klippy.log)
#console_frames: False
#homing_fault_check: off
#temp_poll_interval: 0
#temp_warn: 100

[k2_cfs]
# console_frames: True adds the raw bus frames to console messages (they
# always go to klippy.log)
#console_frames: False
# Enables loaded-path buffer feed, guarded unload/load, and explicitly
# confirmed purge/cutter routes. Every physical phase remains independently
# confirmation-gated until the complete tool-change sequence is qualified.
allow_actuation: true
# Stock F021 purge-bucket route, physically revalidated at 100 mm/s; raised
# 10-25 to Creality Print's own K2 travel speeds (chute F18000, cutter F12000).
purge_safe_y: 345
purge_entry_x: 139
purge_gate_x: 135
purge_x: 133
purge_y: 378
purge_return_x: 225
purge_position_tolerance: 2
purge_speed: 300
purge_min_z: 4.5
# Stock box.cfg requests 140mm, but the current wrapper clamps that baseline
# to an actual 160mm flush: 90+70. A traced 240mm flush is 90+70+80.
purge_extrude_length: 180
purge_retract_length: 2
purge_cool_time: 5
purge_extrude_speed: 6
purge_chunk_length: 90
purge_followup_chunk_length: 70
purge_minimum_actual_length: 160
purge_slow_fraction: 0.2
purge_fast_multiplier: 1.2
clean_plate_x: 170
clean_left_x: 135
clean_right_x: 160
clean_circle_left_x: 160
clean_circle_right_x: 170
clean_brush_left_x: 161
clean_brush_right_x: 169
clean_y: 374
clean_speed: 200
clean_circle_speed: 166.666667
clean_accel: 5000
# Optional extra strokes the full length of the brush after the circles, and
# a faster wipe, e.g. clean_speed 300, clean_circle_speed 250, clean_accel
# 10000 (the stock wipe often leaves a strand on the tip)
#clean_brush_strokes: 0
#clean_brush_left_x: 146
#clean_brush_right_x: 158
# F021 cutter staging point. cutter_cut_x is how far the head rams the cutter
# lever: install.sh sets it for the extruder you choose. Stock extruder: the
# printer's own Creality calibration (cut_pos_x in the stock printer.cfg),
# else -7.2. Phaetus DXC2: 0.8 mm deeper than that calibration but never
# shallower than -8.0 (the developer's DXC2 needed -8.0 at Creality's 5000
# cut acceleration; shallower left colour-change cuts incomplete). If cuts are incomplete, make
# it 0.2-0.4 more negative (allowed -10 to -5). Initial staging remains capped
# at 100 mm/s; stock cut_velocity is 500 mm/s.
cutter_x: 10
cutter_y: 200
cutter_speed: 200
cutter_cut_x: -7.2
cutter_release_x: -1.7
cutter_ram_speed: 500
cutter_release_speed: 150
cutter_ram_accel: 5000
cutter_retract_length: 2
cutter_retract_speed: 6
cutter_tip_length: 7
cutter_tip_push_speed: 9
cutter_tip_pull_speed: 5
# Stock box.cfg cutter return/hall input.
cutter_switch_pin: !nozzle_mcu:PB9
# Post-cut unload. Creality's closed wrapper applies Tn_retrude three times,
# then a fixed 10mm slow pull. Stock extruder: Tn_retrude -10, so
# 10+10+10+10 = 40mm. Phaetus DXC2: Phaetus requires Tn_retrude -20, so
# 20+20+20+10 = 70mm (install.sh sets unload_pull_length for the extruder you
# choose). Pause 300ms after entering IDLE and before the first CFS rewind
# command so the cutter/filament can settle. Standalone rewind is blocked;
# these values are reachable only after cutter completion.
unload_fast_pulls: 3
unload_pull_length: 10
unload_pull_speed: 6
unload_final_length: 10
unload_final_speed: 1
unload_rewind_pause_ms: 300
unload_bus_timeout: 150  # Creality allows 150 s for RETRUDE; the rewind took >30 s on 10-25
# Completion acknowledgements can precede the nozzle-switch callback.
unload_sensor_timeout: 10
sensor_poll_interval: 0.1
# Current-wrapper load handshake: all-idle, tension disabled, stage
# 0/4/repeated 5, nozzle-sensor engagement, E+5, stage 6, E+9, then stage 7.
# `CFS_PURGE` is the separate stock-equivalent flush phase. Neither command
# heats automatically.
load_bus_timeout: 15
load_timeout: 90
# Stock polls EXTRUDE stage 5 every 2 s
load_poll_interval: 2
# Each stage-5 send waits this long for a reply. CFS firmware 1.5.0 does not
# answer stage 5 while it feeds, so no reply means "still feeding"; the load
# moves on when the nozzle sensor sees the filament (was 15 s per send)
#load_stage5_timeout: 1
# Between stage-5 sends the nozzle sensor is checked every 0.1 s (local
# sensor, no bus traffic), so the load moves on as soon as filament arrives
#load_arrival_poll_interval: 0.1
# A box BUSY (0x03) reply is retried instead of failing the step
#busy_retries: 2
#busy_retry_delay: 1
# On EXTRUDE_ERR8 (hub wheel stopped) or UNLOAD_MOTOR_BLOCKED (0x19), sweep
# the toolhead across the bed to free the PTFE tube before the retry. Off by
# default (plain retries only). Moves stay inside the bed, Y <= purge_safe_y.
#stall_retry_motion: false
#stall_retry_moves: Y255, X220, Y40, X40
# Lift (mm) before the sweep so the head clears a part mid-print
#stall_retry_z_lift: 10
load_engage_length: 5
load_engage_speed: 1
load_extrude_length: 9
load_extrude_speed: 3
load_box_finish_length: 3
# Deliberate CFS unload clears the normal runout switch. Mask only its runout
# handler during the cut/unload transaction, then restore it in `finally`.
filament_sensor_name: filament_sensor
manage_runout_sensor: true
stall_retry_moves: Y340, X300, Y40, X40
# The options below are adapted from Jacob10383's K2 Plus custom firmware
# (https://github.com/Jacob10383/k2-plus-custom-firmware, extras/box.py), GPLv3.
# Runout refill purge between two slots of the same filament: 40 mm short
# purge after the load (0 = the full stock purge)
#runout_purge_length: 40
# The box reports mask 0 while it follows the extruder: treat the armed
# feed slot as loaded when the nozzle sensor and hub sensor agree
#path_owner_from_feed_slot: true
# Tool change purge from the print file's flush_volumes_matrix when the
# slicer passes none (false: the fixed fallbacks)
#toolchange_purge_from_file: true
# Pause when the extruder feeds 80 mm while the CFS measuring wheel moves
# under 18 mm (filament not coming through). Off by default.
#clog_detection: false
#clog_extruder_length: 80
#clog_wheel_reset_length: 18
# Box poll interval while printing (0 = env_poll_interval, 2 s)
#print_poll_interval: 0

[k2_z_align]
# Stock-compatible MCU-controlled bottom optical reference on PA15. Motion
# requires KZ_ALIGN_BOTTOM CONFIRM=1. G28 invokes it automatically only while
# Z is unhomed; the standalone command remains explicitly gated.
allow_motion: true
endstop_pin: PA15, PA8
# First K2 Plus measured 349.85 / 350.10 (KZ_ALIGN_MEASURE); stock puts the
# bottom at position_max - zmax_safe_pox_diff = 350. Kept a little low: too
# low is safe, too high drives the bed into the nozzle.
position_endstop: 349.5
quick_speed: 10
slow_speed: 10
rising_dist: 10
safe_dist: 40
filter_count: 10
timeout: 90
retract_dist: 10
retract_speed: 10
zd_up: 0
zes_untrig: 1

# The K2 closed-loop motor stall detector is one-shot. Each axis must be
# armed immediately before its own homing move and disarmed afterward.
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_z = home_all or 'Z' in params %}
    {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}
    # K2 Plus: outside a print, homing Z first sets it from the bottom
    # switches (KZ_ALIGN_BOTTOM), then taps from 5 mm. A Z kept from an
    # earlier tap that fired early, or a 350 mm climb with the gauge armed,
    # could otherwise leave Z wrong by the whole bed travel (10-31). A print
    # already parks on the switches in START_PRINT and keeps that Z.
    {% set z_from_bottom = home_z and printer.print_stats.state not in ("printing", "paused") %}
    {% if 'Z' in params and not home_all
          and ('x' not in printer.toolhead.homed_axes
               or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("Home X and Y before requesting Z-only homing") }
    {% endif %}
    {% if not printer.k2_motor_bus.motors_ready %}
        { action_raise_error("The X/Y/E motors did not wake up (see k2_motor_bus in klippy.log). Run MOTOR_INIT, or restart the printer.") }
    {% endif %}

    # Like stock, a normal G28 does not visit the PA15 bottom switch (stock
    # keeps it for resume; KZ_ALIGN_BOTTOM is still available). With Z
    # unknown, drop the bed 5 mm first so XY homing cannot drag the nozzle
    # across a raised bed. If Z is already homed, just keep 5 mm clearance.
    {% if home_z %}
        {% if z_from_bottom %}
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% elif not z_was_homed %}
            {% if not printer.k2_z_align.endstop_triggered %}
                FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10
                FORCE_MOVE STEPPER=stepper_z1 DISTANCE=5 VELOCITY=10
            {% endif %}
        {% elif printer.toolhead.position.z|float < 5.0 %}
            G90
            G1 Z5 F600
            M400
        {% endif %}
    {% endif %}

    M204 S500

    {% if home_all or 'Y' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 Y
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 Y10 F3600
        G90
    {% endif %}

    {% if home_all or 'X' in params %}
        MOTOR_STALL_MODE DATA=1
        G28 X
        MOTOR_BUS_SEND ADDR=129 PAYLOAD=000c0b
        MOTOR_BUS_SEND ADDR=130 PAYLOAD=000c0b
        MOTOR_STALL_MODE DATA=2
        G91
        G1 X-10 F3600
        G90
    {% endif %}

    # With XY known, move from a trustworthy Z coordinate to 5 mm above the
    # nominal contact plane, perform the bounded strain-gauge search, define
    # contact as Z=0, and leave the nozzle 5 mm clear of the bed.
    {% if home_z %}
        G90
        G1 X175 Y175 F6000
        {% if printer.print_stats.state == "printing"
              and printer["filament_switch_sensor filament_sensor"].filament_detected
              and not printer["gcode_macro START_PRINT"].skip_home_wipe %}
            # Only inside a print's START_PRINT, and whether or not Z was
            # already homed: stock cleans the nozzle before measuring Z
            # (BOX_NOZZLE_CLEAN), as ooze or a hardened strand left from an
            # earlier load touches the bed first and fakes contact. Soften
            # it, wipe with the fan on, and wipe again once cooled. A manual
            # G28 just homes; the precise tap still fails safe on a blob.
            {% set target = printer.extruder.target %}
            M106 S255
            M109 S{[target, 170]|max}
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1 PARK=0
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1 PARK=0
            M104 S{[target, 140]|min if target > 0 else 140}
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
            NOZZLE_WIPE CONFIRM=1 UNHOMED_Z=1
            M107
            M104 S{target}
            G90
            G1 X175 Y175 F6000
        {% endif %}
        {% if not z_was_homed and not z_from_bottom %}
            # Stock G28 Z: raise the bed at homing_speed until the strain
            # gauge triggers, retract, re-tap at second_homing_speed.
            M400
            G4 P1000
            G28 Z
        {% endif %}
        G1 Z5 F600
        M400
        G4 P1000
        M204 S20000
        PRTOUCH_HOME_Z PROBE_SPEED=1
        G1 Z5 F600
        M400
    {% endif %}

    M204 S20000

# CFS slot filament records + Fluidd/Mainsail editor (CFS_SLOTS). Data: hark_cfs_slots.json
[hark_cfs_slots]

# RUN_SAFE: run a macro, then always its cleanup (PA calibration heater/feed)
[hark_safe_run]

# Printed flow-ratio and retraction tests started from the screen or
# Mainsail (CALIBRATE_FLOW / CALIBRATE_RETRACTION SLOT=x); the pick is saved
# to the slot
[hark_calib]

# Phase 1 Kalico features as add-on modules (10-25): RELOAD_GCODE_MACROS,
# PID_PROFILE (loaded per CFS slot material by CFS_SLOT_APPLY) and
# BED_MESH_CHECK (run by START_PRINT after the mesh).
[hark_macro_reload]

[hark_pid_profiles]

[hark_mesh_check]

# Lets the stepper threads use both of the K2's cores (klippy is pinned to
# CPU1). Does nothing when Klipper runs on a host PC.
[hark_cpu]

# Power-loss recovery (klippy/extras/hark_plr.py), as stock K2 had: while
# printing, a journal of where the print is (file position, positions and
# offsets, temperatures, fans, PA, mesh, CFS slot) is kept every 10 s in
# the config folder (hark_plr.json). After the power comes back the console
# and touchscreen offer PLR_RESUME CONFIRM=1: the bed and nozzle heat to
# print temperature before anything moves (the nozzle is stuck in the part
# until then), Z comes back from the bottom
# switches (no tap on the part), the bed is raised clear, the slot is
# loaded and purged at the chute, and the print carries on from the last
# checkpoint (up to 10 s is printed twice). PLR_DISCARD forgets it,
# PLR_STATUS shows it. NEW (11-02): stay with the printer for the first
# resumes. enabled: False in printer-overrides.cfg turns it off.
[hark_plr]
#checkpoint_interval: 10
#recovery_lift: 3

# Print safety watch (10-26): stock master-server paused on a dead fan and
# stock motor_control cancelled on a motor fault; both are gone on the open
# stack. Fan failure pauses, an X/Y motor fault cancels (heaters off), an
# extruder motor fault (clog or jam) pauses. SAFETY_STATUS [QUERY=1].
[hark_safety]

# Maintenance counters (print hours, grams through the nozzle, cutter
# uses) against Creality's thresholds: MAINTENANCE_STATUS, MAINTENANCE_DONE
# ITEM=. Due items are listed when a print ends and the touchscreen reads
# them. Thresholds (hours unless said): shaper_calibrate 500,
# belt_tensioning 1000, lubrication 500, camera 500, fans 500, ptfe_tube
# 1000, wipe_strip 500, air_filter 500, cfs_ptfe 1000, cfs_desiccant 500,
# nozzle 20000 (grams), cutter 100000 (cuts); 0 switches an item off.
[hark_maintenance]
#nozzle: 20000
#filament_density: 1.24

# Pause after the first layer for a look (stock's FIRST_FLOOR_PAUSE): on
# with FIRST_LAYER_PAUSE ENABLE=1 (stays on until ENABLE=0). The slicer's
# layer change must send SET_PRINT_STATS_INFO CURRENT_LAYER= (the shipped
# Orca profiles do).
[gcode_macro FIRST_LAYER_PAUSE]
description: Pause after the first layer of every print: ENABLE=1 or 0
gcode:
    {% set on = params.ENABLE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_PAUSE VARIABLE=enabled VALUE={on}
    RESPOND MSG="First-layer pause {'on: the next print pauses after layer 1' if on else 'off'}"

[gcode_macro _FIRST_LAYER_PAUSE]
variable_enabled: 0
variable_done: 0
gcode:

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
gcode:
    SET_PRINT_STATS_INFO_BASE {rawparams}
    {% set fl = printer["gcode_macro _FIRST_LAYER_PAUSE"] %}
    {% if fl.enabled|int and not fl.done|int and params.CURRENT_LAYER is defined
          and params.CURRENT_LAYER|int == 2
          and printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_PAUSE VARIABLE=done VALUE=1
        RESPOND MSG="First layer done: paused for a look (RESUME to carry on, FIRST_LAYER_PAUSE ENABLE=0 to stop asking)"
        PAUSE
    {% endif %}

# Silent mode (stock's Qmode): accel 2500, 150 mm/s, corner speed 5,
# speed 50%, and M204 held to 2500 while it is on. SILENT_MODE ENABLE=0
# puts the limits back as they were.
[gcode_macro SILENT_MODE]
description: Quiet, slow motion limits for this print: ENABLE=1 or 0
variable_on: 0
variable_saved: {}
gcode:
    {% set on = params.ENABLE|default(1)|int %}
    {% set v = printer["gcode_macro SILENT_MODE"] %}
    {% set th = printer.toolhead %}
    {% if on and not v.on %}
        SET_GCODE_VARIABLE MACRO=SILENT_MODE VARIABLE=saved VALUE="{'{'}'accel':{th.max_accel},'velocity':{th.max_velocity},'scv':{th.square_corner_velocity},'mcr':{th.minimum_cruise_ratio},'speed':{printer.gcode_move.speed_factor}{'}'}"
        SET_VELOCITY_LIMIT ACCEL=2500 VELOCITY=150 SQUARE_CORNER_VELOCITY=5
        M220 S50
        SET_GCODE_VARIABLE MACRO=SILENT_MODE VARIABLE=on VALUE=1
        RESPOND MSG="Silent mode on: accel 2500, 150 mm/s, speed 50%"
    {% elif not on and v.on %}
        {% set s = v.saved %}
        SET_VELOCITY_LIMIT ACCEL={s.accel} VELOCITY={s.velocity} SQUARE_CORNER_VELOCITY={s.scv} MINIMUM_CRUISE_RATIO={s.mcr}
        M220 S{(s.speed * 100)|round(0)|int}
        SET_GCODE_VARIABLE MACRO=SILENT_MODE VARIABLE=on VALUE=0
        RESPOND MSG="Silent mode off: limits restored"
    {% endif %}

[gcode_macro M204]
rename_existing: M204.1
gcode:
    {% if printer["gcode_macro SILENT_MODE"].on|int %}
        {% set s = params.S|default(params.P|default(params.T|default(0)))|float %}
        M204.1 S{[s, 2500]|min if s > 0 else 2500}
    {% else %}
        M204.1 {rawparams}
    {% endif %}

# Fan health from the tachometers (FAN_CHECK, FAN_HEALTH) and the lowest
# speed the part fan keeps turning at (FAN_MIN_CAL; M106 raises lower
# requests to it). Records in hark_fans.json next to the config.
[hark_fans]
# Part fan blast length for a reading, and the drop from its usual rpm
# that is reported
#spin_time: 3
#drop_warn: 15
# Added to the lowest turning duty found by FAN_MIN_CAL (percent)
#min_margin: 2

# At print start: read both fans at full speed (the part fan with a 3 s
# blast while the bed heats, the hotend fan at the chute once hot) and
# report a fan that has slowed or stopped. Off: printer-overrides.cfg
#   [gcode_macro _FAN_AUTO]
#   variable_on_print_start: 0
[gcode_macro _FAN_AUTO]
variable_on_print_start: 1
gcode:
    FAN_CHECK FAN={params.FAN|default("all")} SPIN={params.SPIN|default(0)|int}

# Updates: offers the newest tested K2 OpenKlipper release from GitHub (a
# dialog in Mainsail, a row on the touchscreen's Machine page) and installs it
# with OKL_UPDATE CONFIRM=1, keeping printer-overrides.cfg. OKL_UPDATE_CHECK
# checks now. Set check_interval: 0 to only check on request.
[hark_update]

[gcode_macro CFS_FILAMENTS]
description: Show and edit the filament in each CFS slot
gcode:
    CFS_SLOTS

# Toolhead accelerometer. Creality's nozzle MCU firmware speaks the 2023
# lis2dw protocol, so this uses extras/lis2dw_k2.py instead of mainline's
# lis2dw. Pins and axes_map are from stock printer.cfg.
[lis2dw_k2]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw_k2
probe_points: 130, 130, 130
min_freq: 20
max_freq: 120
accel_per_hz: 100

# G10/G11 retraction. CFS_SLOT_APPLY sets the length (and speed) from the
# armed slot's record; these are the fallbacks for slots with 0 (unset).
# Orca needs "Use firmware retraction" on in the printer preset.
[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

# Bambu-style clean for a crusted nozzle, over the purge chute. Works before
# Z is homed (drops the bed 5 mm first). Heats to TEMP to soften the crust,
# flushes FLUSH mm if filament is loaded, then wipes on the silicone hot and
# again while cooling with the fan on, so leftovers freeze and strip off.
[gcode_macro NOZZLE_DEEP_CLEAN]
description: Melt, flush and wipe a crusted nozzle over the purge chute
gcode:
    {% set temp = params.TEMP|default(250)|float %}
    {% set flush = params.FLUSH|default(15)|float %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set unhomed_z = 0 if 'z' in homed else 1 %}
    {% if 'z' not in homed %}
        {% if not printer.k2_z_align.endstop_triggered %}
            FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10
            FORCE_MOVE STEPPER=stepper_z1 DISTANCE=5 VELOCITY=10
        {% endif %}
    {% elif printer.toolhead.position.z|float < 5.0 %}
        G90
        G1 Z5 F600
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    CFS_PURGE_POSITION CONFIRM=1 UNHOMED_Z={unhomed_z}
    M107
    M109 S{temp}
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        M83
        G1 E{flush} F300
        G1 E-2 F1800
    {% endif %}
    M106 S255
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M104 S180
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=185
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=145
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={unhomed_z}
    M107
    M104 S0
    RESPOND MSG="Nozzle deep clean done"

# Purge line 20 mm in front of the print area (clears a 5 mm auto brim plus
# the bead width), so the first perimeters start
# with a full nozzle. Two phases, like Bambu's prime line: a fat, slow bead
# low enough to swamp the nozzle tip and pick up residue around it, then a
# fast low drag that wipes the tip along the line. Placement adapted from
# KAMP's Line_Purge (GPLv3): from the file's EXCLUDE_OBJECT outlines, along X
# in front of the parts if there is room, else along Y to their left.
[gcode_macro _HARK_LINE_PURGE]
description: Adaptive swamp-and-drag purge line in front of the printed objects
gcode:
    {% set height = params.HEIGHT|default(0.6)|float %}
    {% set margin = params.MARGIN|default(20)|float %}
    {% set length = params.LENGTH|default(25)|float %}
    {% set amount = params.AMOUNT|default(30)|float %}
    {% set drag = params.DRAG|default(20)|float %}
    {% set flow = params.FLOW|default(12)|float %}
    {% set total = length + drag + 10 %}
    {% set pts = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% if not pts %}
        RESPOND MSG="Purge line skipped: the file has no object outlines"
    {% else %}
        {% set x_min = pts | map(attribute=0) | min %}
        {% set x_max = pts | map(attribute=0) | max %}
        {% set y_min = pts | map(attribute=1) | min %}
        {% set y_max = pts | map(attribute=1) | max %}
        {% set speed = flow / 2.405 / amount * length * 60 %}
        {% set along_x = y_min - margin >= 5 %}
        {% if along_x %}
            {% set a0 = [[(x_min + x_max) / 2 - total / 2, 5]|max, 250 - total]|min %}
            # As far from the part as the bed allows: the front edge (Y10),
            # or MARGIN in front of the part when it reaches further forward
            {% set b0 = [y_min - margin, params.EDGE|default(10)|float]|min %}
        {% else %}
            {% set a0 = [[(y_min + y_max) / 2 - total / 2, 5]|max, 250 - total]|min %}
            {% set b0 = [x_min - margin, 5]|max %}
        {% endif %}
        {% set ax = 'X' if along_x else 'Y' %}
        SAVE_GCODE_STATE NAME=HARK_LINE_PURGE
        G90
        M83
        {% if along_x %}
            G0 X{a0} Y{b0} F12000
        {% else %}
            G0 X{b0} Y{a0} F12000
        {% endif %}
        G0 Z{height} F600
        G1 {ax}{a0 + length} E{amount} F{speed}
        G1 Z0.2 F600
        G1 {ax}{a0 + length + drag} E1 F1800
        G10
        G0 {ax}{a0 + total} F12000
        G0 Z2 F600
        G11
        RESTORE_GCODE_STATE NAME=HARK_LINE_PURGE
        RESPOND MSG="Purge line done: {amount}mm swamp + {drag}mm drag along {ax} from {'%.0f'|format(a0)}"
    {% endif %}

# Screen/console slot loading while idle. Heats over the purge chute (never
# over the bed) to the hotter of the old and new filament.
[gcode_macro _CFS_SAFE_Z]
gcode:
    {% if printer.toolhead.position.z|float < 10 %}
        G90
        G1 Z10 F600
    {% endif %}

# Leave the nozzle clean after a load/purge/unload: whatever oozes while it
# cools is wiped off with the fan on, instead of hardening on the tip.
[gcode_macro _CFS_COOL_WIPE]
gcode:
    M104 S0
    M106 S255
    NOZZLE_WIPE CONFIRM=1
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1
    M107

[gcode_macro CFS_LOAD_SLOT]
description: Load a CFS slot and purge the old filament out (idle only)
gcode:
    {% set slot = params.SLOT|default("")|upper %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set active = printer.k2_cfs.active_slot %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_LOAD_SLOT is only for when nothing is printing") }
    {% endif %}
    {% if slot not in ("A", "B", "C", "D") %}
        { action_raise_error("CFS_LOAD_SLOT needs SLOT=A, B, C or D") }
    {% endif %}
    {% set new_t = (slots[slot].nozzle_temp if slot in slots else 0)|int %}
    {% set old_t = (slots[active].nozzle_temp if active and active in slots else 0)|int %}
    {% set temp = [new_t, old_t, 220]|max %}
    # Everything happens over the chute: take Z from the bottom switch (no
    # nozzle contact, so a crusted nozzle cannot fail a probe) and home X/Y
    {% if 'z' not in printer.toolhead.homed_axes %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    _STAGE TEXT="Loading slot {slot} and purging"
    M109 S{temp}
    CFS_CHANGE_SLOT SLOT={slot} CONFIRM=1
    {% set soft = printer["gcode_macro _SOFT_FILAMENT"].max_flow %}
    {% set mat = ((slots[slot].type if slot in slots else "") or "")|upper %}
    {% set sf = namespace(cap=0.0) %}
    {% for k in soft %}
        {% if mat.startswith(k) %}{% set sf.cap = soft[k]|float %}{% endif %}
    {% endfor %}
    {% if printer["gcode_macro _PA_AUTO"].on_load|int and not sf.cap %}
        _PA_AUTO SLOT={slot}
    {% endif %}
    NOZZLE_WIPE CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    CFS_SLOT_APPLY SLOT={slot}
    # COOL=0 (screen's load-then-calibrate) keeps the nozzle hot for the
    # PA_CAL_RUN that follows, which ends with its own cool-wipe
    {% if params.COOL|default(1)|int %}
        _CFS_COOL_WIPE
    {% endif %}
    _STAGE CLEAR=1
    RESPOND MSG="Slot {slot} loaded and purged"

[gcode_macro CFS_UNLOAD_ACTIVE]
description: Cut and rewind the loaded CFS filament (idle only)
gcode:
    {% set active = printer.k2_cfs.active_slot %}
    {% set slots = printer.hark_cfs_slots.slots %}
    {% if not printer.k2_cfs.fitted %}
        { action_raise_error("This printer has no CFS: use LOAD_FILAMENT / UNLOAD_FILAMENT") }
    {% endif %}
    _CFS_CHECK
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CFS_UNLOAD_ACTIVE is only for when nothing is printing") }
    {% endif %}
    {% if not active %}
        { action_raise_error("No CFS slot is loaded") }
    {% endif %}
    {% set temp = [(slots[active].nozzle_temp if active in slots else 0)|int, 220]|max %}
    # Same as CFS_LOAD_SLOT: Z from the bottom switch, no nozzle contact
    {% if 'z' not in printer.toolhead.homed_axes %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    G90
    G1 Y345 F6000
    G1 X225 F6000
    _STAGE TEXT="Unloading slot {active}"
    CFS_CUT_UNLOAD SLOT={active} CONFIRM=1
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    _CFS_COOL_WIPE
    _STAGE CLEAR=1
    RESPOND MSG="Slot {active} unloaded"

# A K2 without a CFS (cfs_fitted: False) feeds one filament from the rear
# spool holder. START_PRINT primes it at the chute; LOAD_FILAMENT and
# UNLOAD_FILAMENT (Mainsail shows them as Load/Unload buttons on the extruder
# panel) load and unload it, idle or from a runout pause. Slot E's filament
# record (the external spool) is used for this spool when set.
# Stop before homing or heating when the CFS is fitted but did not answer at
# startup and still does not (unplugged, no power), instead of at the CFS step
[gcode_macro _CFS_CHECK]
gcode:
    {% set cfs = printer.k2_cfs %}
    {% if cfs.fitted and cfs.detected == False and not cfs.online %}
        { action_raise_error("The CFS is not answering. Check its cable and power, then restart. If this printer has no CFS, add cfs_fitted: False under [k2_cfs] in printer-overrides.cfg and restart.") }
    {% endif %}

# Soft filaments (TPU, TPE) buckle and slip in the extruder gears when pushed
# fast. Loads, START_PRINT's prime-out, flush and prime line run them at
# max_flow (mm3/s; 1 mm/s of 1.75 mm filament = 2.405 mm3/s), and the
# automatic pressure advance measurement is skipped for them: its 10 mm3/s
# step slips, so the slot keeps the PA saved in its record. Keys match the
# start of the slot record's type, so 'TPU' covers TPU 95A, TPU-AMS etc.
# Part fan while purge filament comes out at the chute (0-255). Creality
# flushes with the fan at 30, but the K2's part fan blows from one side:
# PETG and the other hot, sticky filaments then cool unevenly, curl back up
# and stick to the nozzle, blocking the chute (seen 11-02). They flush with
# the fan off; the blast that snaps the strand off afterwards is unchanged.
# Keys match the start of the slot record's type; others use `default`.
[gcode_macro _PURGE_FAN]
variable_default: 30
variable_material: {'PETG': 0, 'PCTG': 0, 'ABS': 0, 'ASA': 0, 'PC': 0}
gcode:
    RESPOND MSG="Purge fan while flushing (0-255): default {printer['gcode_macro _PURGE_FAN'].default}, {printer['gcode_macro _PURGE_FAN'].material}"

[gcode_macro _SOFT_FILAMENT]
variable_max_flow: {'TPU': 3.0, 'TPE': 2.0}
gcode:
    RESPOND MSG="Soft filament flow caps (mm3/s): {printer['gcode_macro _SOFT_FILAMENT'].max_flow}"

[gcode_macro _SPOOL_PRINT_START]
gcode:
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("No filament at the toolhead. Load the rear spool with LOAD_FILAMENT, then start the print again.") }
    {% endif %}
    # At the chute and at print temperature (START_PRINT): push out what
    # sat in the hot zone, then the usual cool-wipe and flush follow.
    # FEED (mm/min) is lower for soft filaments.
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    M83
    G1 E25 F{params.FEED|default(300)|float}
    G1 E-2 F1800
    NOZZLE_WIPE CONFIRM=1

[gcode_macro LOAD_FILAMENT]
description: Load filament (rear spool without a CFS; SLOT=A-D with a CFS, SLOT=E for the rear spool)
gcode:
    {% set state = printer.print_stats.state %}
    {% set want = (params.SLOT|default(""))|string|upper %}
    {% set want = "E" if want in ("EXT", "EXTERNAL", "SPOOL") else want %}
    {% if printer.k2_cfs.fitted and want != "E" %}
        {% if not want %}
            { action_raise_error("This printer loads from the CFS: LOAD_FILAMENT SLOT=A-D (SLOT=E for the rear spool), or use the CFS panel") }
        {% endif %}
        CFS_LOAD_SLOT SLOT={want}
    {% elif printer.k2_cfs.fitted and printer.k2_cfs.active_slot %}
        # The rear spool (a print mapped to slot E) shares the way into the
        # toolhead with the CFS: that slot comes out first, then the spool
        # is pushed in by hand and loaded here
        CFS_UNLOAD_ACTIVE
        RESPOND MSG="Slot {printer.k2_cfs.active_slot} unloaded. Push the rear spool in until it stops at the extruder, then run LOAD_FILAMENT SLOT=E again."
    {% else %}
        {% set slots = printer.hark_cfs_slots.slots %}
        {% set rec_t = (slots.E.nozzle_temp if 'E' in slots and slots.E.loaded else 0)|int %}
        {% set target = printer.extruder.target|float %}
        {% set temp = params.TEMP|default(target if target >= 180 else (rec_t if rec_t >= 180 else 220))|float %}
        {% set material = (params.MATERIAL|default(slots.E.type if 'E' in slots and slots.E.loaded else "") or "")|upper %}
        {% set soft = printer["gcode_macro _SOFT_FILAMENT"].max_flow %}
        {% set sf = namespace(cap=0.0) %}
        {% for k in soft %}
            {% if material.startswith(k) %}{% set sf.cap = soft[k]|float %}{% endif %}
        {% endfor %}
        # mm/min: soft filaments grip and purge at their flow cap
        {% set purge_f = (sf.cap / 2.405 * 60) if sf.cap else 300 %}
        {% set grip_f = [purge_f, 120]|min %}
        {% if state == "printing" %}
            { action_raise_error("LOAD_FILAMENT: pause the print first") }
        {% endif %}
        {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
            { action_raise_error("Push the filament in from the rear spool holder until it stops at the extruder, then run LOAD_FILAMENT again") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}
        _STAGE TEXT="Loading the external spool"
        _CFS_SAFE_Z
        CFS_PURGE_POSITION CONFIRM=1
        M109 S{temp}
        M83
        # Slowly at first so the gears grip, then purge the old colour out
        {% if sf.cap %}
            RESPOND MSG="{material}: loading at {"%.1f"|format(sf.cap)} mm3/s, pressure advance not measured (slot E keeps {slots.E.pressure_advance if 'E' in slots and slots.E.loaded else 'its current value'})"
        {% endif %}
        G1 E40 F{grip_f}
        G1 E{params.PURGE|default(50)|float} F{purge_f}
        G1 E-1 F1800
        NOZZLE_WIPE CONFIRM=1
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
        {% if state != "paused" and printer["gcode_macro _PA_AUTO"].on_load|int and not sf.cap %}
            _PA_AUTO SLOT=E
        {% endif %}
        {% if state != "paused" %}
            _CFS_COOL_WIPE
        {% endif %}
        _STAGE CLEAR=1
        RESPOND MSG="Filament loaded{' : RESUME when ready' if state == 'paused' else ''}"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (rear spool without a CFS; the loaded slot with a CFS, or SLOT=E the rear spool)
gcode:
    {% set state = printer.print_stats.state %}
    {% set want = (params.SLOT|default(""))|string|upper %}
    {% set cfs = printer.k2_cfs %}
    # With a CFS: the loaded slot, or SLOT=E the rear spool (after a print
    # mapped to the external spool)
    {% set rear = want in ("E", "EXT", "EXTERNAL", "SPOOL") %}
    {% if cfs.fitted and cfs.active_slot and rear %}
        { action_raise_error("CFS slot %s is loaded, not the rear spool: UNLOAD_FILAMENT unloads it" % cfs.active_slot) }
    {% endif %}
    {% if cfs.fitted and not rear and not cfs.active_slot
          and printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("No CFS slot is loaded. If the rear spool is in the toolhead: UNLOAD_FILAMENT SLOT=E") }
    {% endif %}
    {% if cfs.fitted and not rear %}
        CFS_UNLOAD_ACTIVE
    {% else %}
        {% set c = printer.configfile.settings.k2_cfs %}
        {% set slots = printer.hark_cfs_slots.slots %}
        {% set rec_t = (slots.E.nozzle_temp if 'E' in slots and slots.E.loaded else 0)|int %}
        {% set target = printer.extruder.target|float %}
        {% set temp = params.TEMP|default(target if target >= 180 else (rec_t if rec_t >= 180 else 220))|float %}
        {% set accel = printer.toolhead.max_accel|float %}
        {% if state == "printing" %}
            { action_raise_error("UNLOAD_FILAMENT: pause the print first") }
        {% endif %}
        {% if 'z' not in printer.toolhead.homed_axes %}
            KZ_ALIGN_BOTTOM CONFIRM=1
        {% endif %}
        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28 X Y
        {% endif %}
        _STAGE TEXT="Unloading the external spool"
        _CFS_SAFE_Z
        CFS_PURGE_POSITION CONFIRM=1
        M109 S{temp}
        # The CFS unload's cut (k2_cfs CFS_CUT_UNLOAD): small retract, knife
        # at the cutter, tip shaping, then pull the cut end out of the gears.
        # The runout switch would see this as a runout: off until the load.
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
        M83
        G1 E-{c.cutter_retract_length} F{c.cutter_retract_speed * 60}
        G90
        G1 Y{c.cutter_y} F{c.cutter_speed * 60}
        G1 X{c.cutter_x} F{c.cutter_speed * 60}
        M400
        SET_VELOCITY_LIMIT ACCEL={c.cutter_ram_accel}
        G1 X{c.cutter_cut_x} Y{c.cutter_y} F{c.cutter_ram_speed * 60}
        G1 X{c.cutter_release_x} Y{c.cutter_y} F{c.cutter_release_speed * 60}
        M400
        SET_VELOCITY_LIMIT ACCEL={accel}
        M83
        G1 E-{c.cutter_retract_length} F{c.cutter_retract_speed * 60}
        G1 E{c.cutter_tip_length} F{c.cutter_tip_push_speed * 60}
        G1 E-{c.cutter_tip_length} F{c.cutter_tip_pull_speed * 60}
        {% for i in range(3) %}
            G1 E-{c.unload_pull_length} F{c.unload_pull_speed * 60}
        {% endfor %}
        G1 E-10 F{c.unload_pull_speed * 60}
        M400
        CFS_PURGE_POSITION CONFIRM=1
        {% if state != "paused" %}
            _CFS_COOL_WIPE
        {% endif %}
        _STAGE CLEAR=1
        RESPOND MSG="Filament cut and released: pull it out from the back"
    {% endif %}



# Pressure advance from nozzle force: stream the strain gauge while the
# nozzle steps between slow and fast flow over the purge chute at a range
# of PA values (CNC Kitchen PATuner method). The gauge only arrives in
# 50 ms windows, so each PA value repeats the step CYCLES times and the
# analysis overlays them. The printer analyses the log itself;
# AUTO=1 also saves a result that passes its quality checks to the slot.
# pa_cal_fetch.sh on the Mac adds diagnostic plots.
[pa_pressure_log]

[gcode_macro PA_CAL_RUN]
description: Log nozzle pressure over the chute at a range of PA values
gcode:
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set slot = (params.SLOT|default(printer.k2_cfs.active_slot or ("" if printer.k2_cfs.fitted else "E")))|upper %}
    {% set default_temp = slots[slot].nozzle_temp if slot and slot in slots else 220 %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set ks = (params.KS|default("0.02,0.04,0.06,0.08,0.10,0.12,0.14")).split(",") %}
    {% set slow = params.SLOW|default(2)|float %}
    {% set fast = params.FAST|default(12)|float %}
    {% set v = params.SPEED|default(40)|float %}
    {% set xa = params.XA|default(113)|float %}
    {% set xb = params.XB|default(127)|float %}
    {% set name = params.NAME|default("pa_cal_" ~ (slot or "x")) %}
    {% set auto = params.AUTO|default(0)|int %}
    {% set cycles = params.CYCLES|default(8)|int %}
    {% set t_seg = (xb - xa)|abs / v %}
    {% set e_slow = slow / 2.405 * t_seg %}
    {% set e_fast = fast / 2.405 * t_seg %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("PA_CAL_RUN is only for when nothing is printing") }
    {% endif %}
    {% if not slot %}
        { action_raise_error("PA_CAL_RUN needs SLOT=A-D, or E for the external spool (the slot loaded in the nozzle)") }
    {% endif %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("PA_CAL_RUN needs filament loaded (%s first)" % ("CFS_LOAD_SLOT" if printer.k2_cfs.fitted else "LOAD_FILAMENT")) }
    {% endif %}
    # Everything happens over the chute, so Z is never probed (the bed may
    # still hold a part, the nozzle may be crusted): Z comes from the bottom
    # switch when unknown, then X/Y are homed
    {% set homed = printer.toolhead.homed_axes %}
    {% set uz = 0 %}
    {% if 'z' not in homed %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    M106 S0
    G90
    M83
    G1 X{xa} F6000
    # Feed from the CFS as a print does; without it the extruder drags the
    # filament off the spool against the take-up and slips at full flow
    CFS_FEED_START SLOT={slot} CONFIRM=1
    G1 E15 F300
    # Unlogged warm-up so the melt has settled before the first PA value
    {% for c in range(2) %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_fast} F{v * 60}
        {% endfor %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
        {% endfor %}
    {% endfor %}
    G4 P2000
    SET_PRESSURE_ADVANCE ADVANCE=0
    PA_LOG_START
    G4 P1000
    PA_LOG_MARK LABEL=dry
    {% for i in range(6) %}
        G1 X{xb if i % 2 == 0 else xa} F{v * 60}
    {% endfor %}
    G4 P1500
    {% for k in ks %}
        SET_PRESSURE_ADVANCE ADVANCE={k}
        G4 P1500
        PA_LOG_MARK LABEL=k{k}
        {% for c in range(cycles) %}
            {% for i in range(4) %}
                G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
            {% endfor %}
            {% for i in range(4) %}
                G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_fast} F{v * 60}
            {% endfor %}
        {% endfor %}
        {% for i in range(4) %}
            G1 X{xb if i % 2 == 0 else xa} E{"%.5f" % e_slow} F{v * 60}
        {% endfor %}
        PA_LOG_MARK LABEL=end{k}
        G4 P1500
    {% endfor %}
    PA_LOG_STOP NAME={name}
    M104 S0
    CFS_FEED_STOP
    CFS_PRELOAD ENABLE=1
    PA_CAL_ANALYZE NAME={name} SLOT={slot} SAVE={auto}
    {% if slot %}
        CFS_SLOT_APPLY SLOT={slot}
    {% endif %}
    M106 S255
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1 UNHOMED_Z={uz}
    M107

# Pressure advance from nozzle force with the nozzle standing still over the
# chute, the way Bambu's force-sensor printers do it: the extruder steps
# between slow and fast flow (extrude-only moves) and pa_tester fits how fast
# the nozzle pressure follows. Dmitry Butyugin's pa_tester (GPLv3, from his
# Klipper branch ads131m0x-pa) with the K2 gauge as its load cell.
[pa_tester]
force_sensor: pa_pressure_log
# Fit quality limit (pa_tester's default 0.001); PLA's slowing-down steps
# fitted at 0.0011-0.0012 on 10-27 and were rejected
#max_fit_mse: 0.001
# The gauge samples in bursts: 50 ms windows with ~50 ms gaps at slow flow,
# ~5 ms bursts every ~10 ms at fast flow (10-28). Vary each step's length so
# steps land at different points of that cycle, and leave out steps whose
# first 40 ms contain a gap longer than max_start_gap (the start of their
# decay is missing)
segment_jitter: 0.1
max_start_gap: 0.015
slow_flow: 2
high_flow: 10
purge_length: 20
segment_time: 0.5
test_repetitions: 10

[gcode_macro PA_CAL_STATIC]
description: Measure pressure advance with the nozzle still over the chute
gcode:
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set slot = (params.SLOT|default(printer.k2_cfs.active_slot or printer.k2_cfs.feed_slot or ("" if printer.k2_cfs.fitted else "E")))|upper %}
    {% set default_temp = slots[slot].nozzle_temp if slot and slot in slots else 220 %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% set method = params.METHOD|default("step_response") %}
    {% set high = params.HIGH_FLOW|default(10)|float %}
    {% set slow = params.SLOW_FLOW|default(2)|float %}
    # Gauge source (0 = MCU processed, 1 = raw ADC), window period and an
    # optional CSV capture for offline analysis, for this run only
    {% set src = params.SRC|default(0)|int %}
    {% set period = params.PERIOD|default(0)|float %}
    {% set capture = params.CAPTURE|default("") %}
    # Slow/fast step pairs; the gauge covers about half the time (it is read
    # back over the bus between 50 ms windows), so more pairs average better
    {% set reps = params.REPS|default(0)|int %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("PA_CAL_STATIC is only for when nothing is printing") }
    {% endif %}
    {% if not slot %}
        { action_raise_error("PA_CAL_STATIC needs SLOT=A-D, or E for the external spool (the slot loaded in the nozzle)") }
    {% endif %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("PA_CAL_STATIC needs filament loaded (%s first)" % ("CFS_LOAD_SLOT" if printer.k2_cfs.fitted else "LOAD_FILAMENT")) }
    {% endif %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'z' not in homed %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    # RUN_SAFE: the heater goes off and the feed stops even if the test fails
    RUN_SAFE RUN=_PA_STATIC_TEST FINALLY=_PA_STATIC_DONE SLOT={slot} METHOD={method} HIGH_FLOW={high} SLOW_FLOW={slow} SRC={src} SAVE={params.SAVE|default(0)|int}{(" PERIOD=%.3f" % period) if period > 0 else ""}{(" CAPTURE=" ~ capture) if capture else ""}{(" REPS=%d" % reps) if reps > 0 else ""}

# The stationary test itself, at the chute with the nozzle hot. SAVE=1 keeps
# a plausible result in the slot's filament record (_PA_STATIC_SAVE).
[gcode_macro _PA_STATIC_TEST]
gcode:
    {% set slot = params.SLOT|upper %}
    {% set src = params.SRC|default(0)|int %}
    {% set reps = params.REPS|default(0)|int %}
    _STAGE TEXT="Measuring pressure advance (slot {slot})"
    M106 S0
    M83
    CFS_FEED_START SLOT={slot} CONFIRM=1
    G1 E15 F300
    M400
    PA_GAUGE_SETUP SRC={src}{(" PERIOD=" ~ params.PERIOD) if params.PERIOD else ""}{(" CAPTURE=" ~ params.CAPTURE) if params.CAPTURE else ""}
    TEST_PRESSURE_ADVANCE METHOD={params.METHOD|default("step_response")} HIGH_FLOW={params.HIGH_FLOW|default(10)} SLOW_FLOW={params.SLOW_FLOW|default(2)}{(" TEST_REPETITIONS=%d" % reps) if reps > 0 else ""}
    {% if params.SAVE|default(0)|int %}
        _PA_STATIC_SAVE SLOT={slot}
    {% endif %}

# Store the last stationary result in the slot record when it is plausible:
# within min_pa..max_pa, and the speeding-up and slowing-down steps agree
# within max_spread. A result outside that is reported and not used. The
# scale turns the stationary value into the printed one, per material (the
# slot record's type) with scale for the rest. On 10-28 the chevron pattern
# (tools/pa/pa_pattern.py) picked PLA 0.069 for 0.0514 measured (x1.34) and
# PETG 0.077 for 0.068 (x1.13); the default since 11-01 (the stationary
# value alone saved PA 13-34% low). Set your own from printed patterns in
# printer-overrides.cfg; other materials use scale.
[gcode_macro _PA_STATIC_SAVE]
variable_scale: 1.0
variable_scale_material: {'PLA': 1.34, 'PETG': 1.13}
variable_min_pa: 0.01
variable_max_pa: 0.15
variable_max_spread: 0.05
# The last result, for the touchscreen and Mainsail (stamp = print time)
variable_last: {}
gcode:
    {% set slot = params.SLOT|upper %}
    {% set v = printer["gcode_macro _PA_STATIC_SAVE"] %}
    {% set stamp = '%.1f' % printer.toolhead.estimated_print_time %}
    {% set pt = printer.pa_tester %}
    {% set measured = pt.last_pressure_advance if 'last_pressure_advance' in pt else none %}
    {% set records = printer.hark_cfs_slots.slots %}
    {% set material = (records[slot].type if slot in records else "")|upper %}
    {% set scale = (v.scale_material[material] if material in v.scale_material else v.scale)|float %}
    {% set pa = (measured * scale) if measured is not none else none %}
    {% set steps = pt.last_measured_pressure_advance if 'last_measured_pressure_advance' in pt else [] %}
    {% set spread = (steps|max - steps|min) if steps|length > 1 else 0 %}
    {% if pa is none %}
        SET_GCODE_VARIABLE MACRO=_PA_STATIC_SAVE VARIABLE=last VALUE="{'{'}'slot':'{slot}','saved':0,'reason':'none','stamp':{stamp}{'}'}"
        RESPOND TYPE=error MSG="PA calibration for slot {slot} gave no result; the slot keeps its pressure advance"
    {% elif pa < v.min_pa or pa > v.max_pa or spread > v.max_spread %}
        SET_GCODE_VARIABLE MACRO=_PA_STATIC_SAVE VARIABLE=last VALUE="{'{'}'slot':'{slot}','saved':0,'reason':'implausible','pa':{'%.4f'|format(pa)},'stamp':{stamp}{'}'}"
        RESPOND TYPE=error MSG="PA calibration for slot {slot}: {'%.4f'|format(pa)} (steps {steps|join(', ')}) looks wrong, not saved"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_PA_STATIC_SAVE VARIABLE=last VALUE="{'{'}'slot':'{slot}','saved':1,'pa':{'%.4f'|format(pa)},'measured':{'%.4f'|format(measured)},'scale':{'%.2f'|format(scale)},'material':'{material}','stamp':{stamp}{'}'}"
        CFS_SLOT_SET SLOT={slot} PA={'%.4f'|format(pa)}
        SET_PRESSURE_ADVANCE ADVANCE={'%.4f'|format(pa)}
        RESPOND MSG="Pressure advance for slot {slot}: {'%.4f'|format(pa)} saved{(' (measured %.4f x %.2f for %s)' % (measured, scale, material or 'this filament')) if scale != 1 else ''}"
    {% endif %}

# After the test, pass or fail: relieve the pressure the test leaves in the
# nozzle (it wept after the wipe on 10-28; at a print start the flush pushes
# this back, PRE=5, as it does the purge's), feed off (unless the caller
# keeps it for a print start) and the slot's settings applied again
[gcode_macro _PA_STATIC_END]
variable_relief: 2
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-{printer["gcode_macro _PA_STATIC_END"].relief} F1800
    {% endif %}
    {% if not params.KEEP_FEED|default(0)|int %}
        CFS_FEED_STOP
        CFS_PRELOAD ENABLE=1
    {% endif %}
    CFS_SLOT_APPLY SLOT={params.SLOT|upper}

[gcode_macro _PA_STATIC_DONE]
gcode:
    M104 S0
    _PA_STATIC_END SLOT={params.SLOT}
    _STAGE TEXT="Cooling and wiping"
    M106 S255
    NOZZLE_WIPE CONFIRM=1
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=180
    NOZZLE_WIPE CONFIRM=1
    M107
    _STAGE CLEAR=1

# Automatic pressure advance: measure it (stationary, about 90 s) every time
# a slot is loaded, and save a plausible result to the slot. A failed
# measurement is reported and the load carries on. Off by default.
#   on_load: CFS_LOAD_SLOT and LOAD_FILAMENT (idle)
#   on_print_start: a print start that loads a different slot
# Not during a print (tool changes, runout refills).
[gcode_macro _PA_AUTO]
variable_on_load: 0
variable_on_print_start: 0
gcode:
    {% set slot = params.SLOT|upper %}
    RESPOND MSG="Measuring pressure advance for slot {slot} (about 90 s)"
    CFS_PURGE_POSITION CONFIRM=1
    RUN_SAFE RUN=_PA_STATIC_TEST FINALLY=_PA_STATIC_END ON_ERROR=report SLOT={slot} SAVE=1 KEEP_FEED={params.KEEP_FEED|default(0)|int}
    NOZZLE_WIPE CONFIRM=1

# ---------------------------------------------------------------------------
# Max flow from the strain gauge (hark_flow_cal): the nozzle sits over the
# chute and the flow steps up until the gauge force leaves the straight line
# of the low flows. That knee is where the hotend stops melting what the
# extruder pushes (K2 CR-PETG at 250 C: 16 mm^3/s, 11-03); the cap is the
# last flow still on the line less a margin, and SET_MAX_FLOW holds the
# print's moves to it. Purges, primes and the test itself are not capped.
# ---------------------------------------------------------------------------
[hark_flow_cal]
# Steps (mm^3/s), each step_time long; the ramp stops at the knee
#flows: 8, 10, 12, 14, 16, 18, 20, 22, 24
#step_time: 3
# The first step runs this much longer before it is read (it starts from
# no pressure)
#first_step_extra: 2
# Pause before the rest level is read (the prime leaves pressure behind)
#relax: 3
# The knee is where the force passes knee_percent above the line fitted
# through the earlier steps at or below fit_max_flow (three of them at
# least, so judging starts at the fourth step), placed between steps; one
# step over the line counts only when the next one is over too
#knee_percent: 5
#fit_max_flow: 12
# Cap = knee - margin (mm^3/s, to the half below), never below min_cap:
# walls print above their steady flow at corners and PA bursts
#margin: 3
#min_cap: 4

[gcode_macro FLOW_CAL_STATIC]
description: Measure the max flow with the nozzle still over the chute (APPLY=1 caps the next print until END_PRINT)
gcode:
    {% set slots = printer.hark_cfs_slots.slots %}
    {% set slot = (params.SLOT|default(printer.k2_cfs.active_slot or printer.k2_cfs.feed_slot or ("" if printer.k2_cfs.fitted else "E")))|upper %}
    {% set default_temp = slots[slot].nozzle_temp if slot and slot in slots else 220 %}
    {% set temp = params.TEMP|default(default_temp)|float %}
    {% if printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("FLOW_CAL_STATIC is only for when nothing is printing") }
    {% endif %}
    {% if not slot %}
        { action_raise_error("FLOW_CAL_STATIC needs SLOT=A-D, or E for the external spool (the slot loaded in the nozzle)") }
    {% endif %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("FLOW_CAL_STATIC needs filament loaded (%s first)" % ("CFS_LOAD_SLOT" if printer.k2_cfs.fitted else "LOAD_FILAMENT")) }
    {% endif %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'z' not in homed %}
        KZ_ALIGN_BOTTOM CONFIRM=1
    {% endif %}
    {% if 'x' not in homed or 'y' not in homed %}
        G28 X Y
    {% endif %}
    _CFS_SAFE_Z
    CFS_PURGE_POSITION CONFIRM=1
    M109 S{temp}
    RUN_SAFE RUN=_FLOW_STATIC_TEST FINALLY=_PA_STATIC_DONE SLOT={slot} APPLY={params.APPLY|default(0)|int}{(" FLOWS=" ~ params.FLOWS) if params.FLOWS else ""}{(" STEP_TIME=" ~ params.STEP_TIME) if params.STEP_TIME else ""}{(" KNEE=" ~ params.KNEE) if params.KNEE else ""}{(" MARGIN=" ~ params.MARGIN) if params.MARGIN else ""}

# The ramp itself, at the chute with the nozzle hot and the feed armed
[gcode_macro _FLOW_STATIC_TEST]
gcode:
    {% set slot = params.SLOT|upper %}
    _STAGE TEXT="Measuring max flow (slot {slot})"
    M106 S0
    M83
    CFS_FEED_START SLOT={slot} CONFIRM=1
    G1 E15 F300
    M400
    FLOW_CAL_RUN APPLY={params.APPLY|default(0)|int}{(" FLOWS=" ~ params.FLOWS) if params.FLOWS else ""}{(" STEP_TIME=" ~ params.STEP_TIME) if params.STEP_TIME else ""}{(" KNEE=" ~ params.KNEE) if params.KNEE else ""}{(" MARGIN=" ~ params.MARGIN) if params.MARGIN else ""}

# Automatic max flow at print start: after the slot is loaded and purged,
# still at the chute at print temperature, ramp the flow (about 20 s and
# 50-100 mm of filament) and cap this print to the knee found. Off by
# default; turn it on in printer-overrides.cfg:
#   [gcode_macro _FLOW_AUTO]
#   variable_on_print_start: 1
# A failed measurement is reported and the print starts uncapped. The
# slicer's own volumetric limit still applies where it is lower.
[gcode_macro _FLOW_AUTO]
variable_on_print_start: 0
gcode:
    {% set slot = params.SLOT|upper %}
    RESPOND MSG="Measuring max flow for slot {slot} (about 20 s)"
    CFS_PURGE_POSITION CONFIRM=1
    RUN_SAFE RUN=_FLOW_STATIC_TEST FINALLY=_PA_STATIC_END ON_ERROR=report SLOT={slot} APPLY=1 KEEP_FEED={params.KEEP_FEED|default(0)|int}
    {% set r = printer.hark_flow_cal.last %}
    {% if r.cap %}
        _STAGE TEXT="Max flow {'%.1f'|format(r.cap)} mm3/s for this print"
    {% endif %}
    NOZZLE_WIPE CONFIRM=1

# ---------------------------------------------------------------------------
# Time-lapse: moonraker-timelapse's Klipper macros, vendored unchanged from
# mainsail-crew/moonraker-timelapse c7fff11e54 (GPLv3). They do nothing until
# time-lapse is switched on (Mainsail's Timelapse tab or the touchscreen's
# Settings), so a file with TIMELAPSE_TAKE_FRAME in its layer change G-code
# prints the same everywhere. The Moonraker side is
# system/moonraker-compat/timelapse.py (on a K2 that runs its own Moonraker).
# ---------------------------------------------------------------------------
# Timelapse klipper macro definition
#
# Copyright (C) 2021 Christoph Frei <fryakatkop@gmail.com>
# Copyright (C) 2021 Alex Zellner <alexander.zellner@googlemail.com>
#
# This file may be distributed under the terms of the GNU GPLv3 license
#
# Macro version 1.15
#

##### DO NOT CHANGE ANY MACRO!!! #####

##########################################################################
#                                                                        #
# GET_TIMELAPSE_SETUP: Print the Timelapse setup to console              #
#                                                                        #
##########################################################################

[gcode_macro GET_TIMELAPSE_SETUP]
description: Print the Timelapse setup
gcode: 
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set output_txt = ["Timelapse Setup:"] %}
  {% set _dummy = output_txt.append("enable: %s" % tl.enable) %}
  {% set _dummy = output_txt.append("park: %s" % tl.park.enable) %}
  {% if tl.park.enable %}
    {% set _dummy = output_txt.append("park position: %s time: %s s" % (tl.park.pos, tl.park.time)) %}
    {% set _dummy = output_txt.append("park cord x:%s y:%s dz:%s" % (tl.park.coord.x, tl.park.coord.y, tl.park.coord.dz)) %}
    {% set _dummy = output_txt.append("travel speed: %s mm/s" % tl.speed.travel) %}
  {% endif %}
  {% set _dummy = output_txt.append("fw_retract: %s" % tl.extruder.fw_retract) %}
  {% if not tl.extruder.fw_retract %}
    {% set _dummy = output_txt.append("retract: %s mm speed: %s mm/s" % (tl.extruder.retract, tl.speed.retract)) %}
    {% set _dummy = output_txt.append("extrude: %s mm speed: %s mm/s" % (tl.extruder.extrude, tl.speed.extrude)) %}
  {% endif %}
  {% set _dummy = output_txt.append("verbose: %s" % tl.verbose) %}
  {action_respond_info(output_txt|join("\n"))}

################################################################################################
#                                                                                              #
# Use _SET_TIMELAPSE_SETUP [ENABLE=value] [VERBOSE=value] [PARK_ENABLE=value] [PARK_POS=value] #
#                          [PARK_TIME=value] [CUSTOM_POS_X=value] [CUSTOM_POS_Y=value]         #
#                          [CUSTOM_POS_DZ=value][TRAVEL_SPEED=value] [RETRACT_SPEED=value]     #
#                          [EXTRUDE_SPEED=value] [EXTRUDE_DISTANCE=value]                      #
#                          [RETRACT_DISTANCE=value] [FW_RETRACT=value]                         #
#                                                                                              #
################################################################################################

[gcode_macro _SET_TIMELAPSE_SETUP]
description: Set user parameters for timelapse
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  ##### get min and max bed size #####
  {% set min = printer.toolhead.axis_minimum %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch'] 
                else False %}
  {% set park = {'min'   : {'x': (min.x / 1.42)|round(3) if round_bed else min.x|round(3),
                            'y': (min.y / 1.42)|round(3) if round_bed else min.y|round(3)},
                 'max'   : {'x': (max.x / 1.42)|round(3) if round_bed else max.x|round(3),
                            'y': (max.y / 1.42)|round(3) if round_bed else max.y|round(3)},
                 'center': {'x': (max.x-(max.x-min.x)/2)|round(3),
                            'y': (max.y-(max.y-min.y)/2)|round(3)}} %}
  ##### set new values #####
  {% if params.ENABLE %}
    {% if params.ENABLE|lower is in ['true', 'false'] %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if params.ENABLE|lower == 'true' else False}
    {% else %}
      {action_raise_error("ENABLE=%s not supported. Allowed values are [True, False]" % params.ENABLE|capitalize)}
    {% endif %}
  {% endif %}
  {% if params.VERBOSE %}
    {% if params.VERBOSE|lower is in ['true', 'false'] %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=verbose VALUE={True if params.VERBOSE|lower == 'true' else False}
    {% else %}
      {action_raise_error("VERBOSE=%s not supported. Allowed values are [True, False]" % params.VERBOSE|capitalize)}
    {% endif %}
  {% endif %}
  {% if params.CUSTOM_POS_X %}
    {% if params.CUSTOM_POS_X|float >= min.x and params.CUSTOM_POS_X|float <= max.x %}
      {% set _dummy = tl.park.custom.update({'x':params.CUSTOM_POS_X|float|round(3)}) %}
    {% else %}
      {action_raise_error("CUSTOM_POS_X=%s must be within [%s - %s]" % (params.CUSTOM_POS_X, min.x, max.x))}
    {% endif %}
  {% endif %}
  {% if params.CUSTOM_POS_Y %}
    {% if params.CUSTOM_POS_Y|float >= min.y and params.CUSTOM_POS_Y|float <= max.y %}
      {% set _dummy = tl.park.custom.update({'y':params.CUSTOM_POS_Y|float|round(3)}) %}
    {% else %}
      {action_raise_error("CUSTOM_POS_Y=%s must be within [%s - %s]" % (params.CUSTOM_POS_Y, min.y, max.y))}
    {% endif %}
  {% endif %}
  {% if params.CUSTOM_POS_DZ %}
    {% if params.CUSTOM_POS_DZ|float >= min.z and params.CUSTOM_POS_DZ|float <= max.z %}
      {% set _dummy = tl.park.custom.update({'dz':params.CUSTOM_POS_DZ|float|round(3)}) %}
    {% else %}
      {action_raise_error("CUSTOM_POS_DZ=%s must be within [%s - %s]" % (params.CUSTOM_POS_DZ, min.z, max.z))}
    {% endif %}
  {% endif %}
  {% if params.PARK_ENABLE %}
    {% if params.PARK_ENABLE|lower is in ['true', 'false'] %}
      {% set _dummy = tl.park.update({'enable':True if params.PARK_ENABLE|lower == 'true' else False}) %}
    {% else %}
      {action_raise_error("PARK_ENABLE=%s not supported. Allowed values are [True, False]" % params.PARK_ENABLE|capitalize)}
    {% endif %}
  {% endif %}
  {% if params.PARK_POS %}
    {% if params.PARK_POS|lower is in ['center','front_left','front_right','back_left','back_right','custom','x_only','y_only'] %}
      {% set dic = {'center'      : {'x': park.center.x   , 'y': park.center.y   , 'dz': 1                },
                    'front_left'  : {'x': park.min.x      , 'y': park.min.y      , 'dz': 0                },
                    'front_right' : {'x': park.max.x      , 'y': park.min.y      , 'dz': 0                },
                    'back_left'   : {'x': park.min.x      , 'y': park.max.y      , 'dz': 0                },
                    'back_right'  : {'x': park.max.x      , 'y': park.max.y      , 'dz': 0                },
                    'custom'      : {'x': tl.park.custom.x, 'y': tl.park.custom.y, 'dz': tl.park.custom.dz},
                    'x_only'      : {'x': tl.park.custom.x, 'y': 'none'          , 'dz': tl.park.custom.dz},
                    'y_only'      : {'x': 'none'          , 'y': tl.park.custom.y, 'dz': tl.park.custom.dz}} %}
      {% set _dummy = tl.park.update({'pos':params.PARK_POS|lower}) %}
      {% set _dummy = tl.park.update({'coord':dic[tl.park.pos]}) %}
    {% else %}
      {action_raise_error("PARK_POS=%s not supported. Allowed values are [CENTER, FRONT_LEFT, FRONT_RIGHT, BACK_LEFT, BACK_RIGHT, CUSTOM, X_ONLY, Y_ONLY]"
                          % params.PARK_POS|upper)}
    {% endif %}
  {% endif %}
  {% if params.PARK_TIME %}
    {% if params.PARK_TIME|float >= 0.0 %}
      {% set _dummy = tl.park.update({'time':params.PARK_TIME|float|round(3)}) %}
    {% else %}
      {action_raise_error("PARK_TIME=%s must be a positive number" % params.PARK_TIME)}
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=park VALUE="{tl.park}"
  {% if params.TRAVEL_SPEED %}
    {% if params.TRAVEL_SPEED|float > 0.0 %}
      {% set _dummy = tl.speed.update({'travel':params.TRAVEL_SPEED|float|round(3)}) %}
    {% else %}
      {action_raise_error("TRAVEL_SPEED=%s must be larger than 0" % params.TRAVEL_SPEED)}
    {% endif %}
  {% endif %}
  {% if params.RETRACT_SPEED %}
    {% if params.RETRACT_SPEED|float > 0.0 %}
      {% set _dummy = tl.speed.update({'retract':params.RETRACT_SPEED|float|round(3)}) %}
    {% else %}
      {action_raise_error("RETRACT_SPEED=%s must be larger than 0" % params.RETRACT_SPEED)}
    {% endif %}
  {% endif %}
  {% if params.EXTRUDE_SPEED %}
    {% if params.EXTRUDE_SPEED|float > 0.0 %}
      {% set _dummy = tl.speed.update({'extrude':params.EXTRUDE_SPEED|float|round(3)}) %}
    {% else %}
      {action_raise_error("EXTRUDE_SPEED=%s must be larger than 0" % params.EXTRUDE_SPEED)}
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=speed VALUE="{tl.speed}"
  {% if params.EXTRUDE_DISTANCE %}
    {% if params.EXTRUDE_DISTANCE|float >= 0.0 %}
      {% set _dummy = tl.extruder.update({'extrude':params.EXTRUDE_DISTANCE|float|round(3)}) %}
    {% else %}
      {action_raise_error("EXTRUDE_DISTANCE=%s must be specified as positiv number" % params.EXTRUDE_DISTANCE)}
    {% endif %}
  {% endif %}
  {% if params.RETRACT_DISTANCE %}
    {% if params.RETRACT_DISTANCE|float >= 0.0 %}
      {% set _dummy = tl.extruder.update({'retract':params.RETRACT_DISTANCE|float|round(3)}) %}
    {% else %}
      {action_raise_error("RETRACT_DISTANCE=%s must be specified as positiv number" % params.RETRACT_DISTANCE)}
    {% endif %}
  {% endif %}
  {% if params.FW_RETRACT %}
    {% if params.FW_RETRACT|lower is in ['true', 'false'] %}
      {% if 'firmware_retraction' in printer.configfile.settings %}
        {% set _dummy = tl.extruder.update({'fw_retract': True if params.FW_RETRACT|lower == 'true' else False}) %}
      {% else %}
        {% set _dummy = tl.extruder.update({'fw_retract':False}) %}
        {% if params.FW_RETRACT|capitalize == 'True' %}
          {action_raise_error("[firmware_retraction] not defined in printer.cfg. Can not enable fw_retract")}
        {% endif %}
      {% endif %}
    {% else %}
      {action_raise_error("FW_RETRACT=%s not supported. Allowed values are [True, False]" % params.FW_RETRACT|capitalize)}
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=extruder VALUE="{tl.extruder}"
  {% if printer.configfile.settings['gcode_macro pause'] is defined %}
    {% set _dummy = tl.macro.update({'pause': printer.configfile.settings['gcode_macro pause'].rename_existing}) %}
  {% endif %}
  {% if printer.configfile.settings['gcode_macro resume'] is defined %}
    {% set _dummy = tl.macro.update({'resume': printer.configfile.settings['gcode_macro resume'].rename_existing}) %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=macro VALUE="{tl.macro}"

##########################################################################
#                                                                        #
# TIMELAPSE_TAKE_FRAME: take the next picture                            #
#                                                                        #
##########################################################################

######################### definition #########################
## enable: enable or disable the next frame. Valid inputs: [True, False]
## takingframe: internal use. Valid inputs: [True, False]
##
## park.enable: enable or disable to park the head while taking a picture. Valid inputs: [True, False]
## park.pos   : used position for parking. Valid inputs: [center, front_left, front_right, back_left, back_right, custom, x_only, y_only]
## park.time  : used for the debug macro. Time in s
## park.custom.x, park.custom.y: coordinates of the custom parkposition. Unit [mm]
## park.custom.dz              : custom z hop for the picture. Unit [mm]
## park.coord : internal use
##
## extruder.fw_retract: enable disable fw retraction [True,False]
## extruder.extrude   : filament extruded at the end of park. Unit [mm]
## extruder.retract   : filament retract at the start of park. Unit [mm]
##
## speed.travel : used speed for travel from and to the park positon. Unit: [mm/min]
## speed.retract: used speed for retract [mm/min]
## speed.extrude: used speed for extrude [mm/min]
##
## verbose: Enable mesage output of TIMELAPSE_TAKE_FRAME
##
## check_time: time when the status of the taken picture is checked. Default 0.5 sec
##
## restore.absolute.coordinates: internal use
## restore.absolute.extrude    : internal use
## restore.speed               : internal use
## restore.e                   : internal use
## restore.factor.speed        : internal use
## restore.factor.extrude      : internal use
##
## macro.pause  : internal use
## macro.resume : internal use
##
## is_paused: internal use
###############################################################
[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Take Timelapse shoot
variable_enable: False
variable_takingframe: False
variable_park: {'enable': False,
                'pos'   : 'center',
                'time'  : 0.1,
                'custom': {'x': 0, 'y': 0, 'dz': 0},
                'coord' : {'x': 0, 'y': 0, 'dz': 0}}
variable_extruder: {'fw_retract': False,
                    'retract': 1.0,
                    'extrude': 1.0}
variable_speed: {'travel': 100,
                 'retract': 15,
                 'extrude': 15}
variable_verbose: True
variable_check_time: 0.5
variable_restore: {'absolute': {'coordinates': True, 'extrude': True}, 'speed': 1500, 'e':0, 'factor': {'speed': 1.0, 'extrude': 1.0}}
variable_macro: {'pause': 'PAUSE', 'resume': 'RESUME'}
variable_is_paused: False
gcode:
  {% set hyperlapse = True if params.HYPERLAPSE and params.HYPERLAPSE|lower =='true' else False %}
  {% if enable %}
    {% if (hyperlapse and printer['gcode_macro HYPERLAPSE'].run) or
          (not hyperlapse and not printer['gcode_macro HYPERLAPSE'].run) %}
      {% if park.enable %}
        {% set pos = {'x': 'X' + park.coord.x|string if park.pos != 'y_only' else '', 
                      'y': 'Y' + park.coord.y|string if park.pos != 'x_only' else '', 
                      'z': 'Z'+ [printer.gcode_move.gcode_position.z + park.coord.dz, printer.toolhead.axis_maximum.z]|min|string} %}
        {% set restore = {'absolute': {'coordinates': printer.gcode_move.absolute_coordinates,
                                       'extrude'    : printer.gcode_move.absolute_extrude},
                          'speed'   : printer.gcode_move.speed,
                          'e'       : printer.gcode_move.gcode_position.e,
                          'factor'  : {'speed'  : printer.gcode_move.speed_factor,
                                       'extrude': printer.gcode_move.extrude_factor}} %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=restore VALUE="{restore}"
        {% if not printer[printer.toolhead.extruder].can_extrude %}
          {% if verbose %}{action_respond_info("Timelapse: Warning, minimum extruder temperature not reached!")}{% endif %}
        {% else %}
          {% if extruder.fw_retract %}
            G10
          {% else %}
            M83     ; insure relative extrusion
            G0 E-{extruder.retract} F{speed.retract * 60}
          {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=True 
        {macro.pause}            ; execute the klipper PAUSE command
        SET_GCODE_OFFSET X=0 Y=0 ; this will insure that the head parks always at the same position in a multi setup
        G90                      ; insure absolute move
        {% if "xyz" not in printer.toolhead.homed_axes %}
          {% if verbose %}{action_respond_info("Timelapse: Warning, axis not homed yet!")}{% endif %}
        {% else %}
          G0 {pos.x} {pos.y} {pos.z} F{speed.travel * 60}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=True
        UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={check_time}
        M400
      {% endif %}
      _TIMELAPSE_NEW_FRAME HYPERLAPSE={hyperlapse}
    {% endif %}    
  {% else %}
    {% if verbose %}{action_respond_info("Timelapse: disabled, take frame ignored")}{% endif %}
  {% endif %}

[gcode_macro _TIMELAPSE_NEW_FRAME]
description: action call for timelapse shoot. must be a seperate macro
gcode:  
 {action_call_remote_method("timelapse_newframe", 
                            macropark=printer['gcode_macro TIMELAPSE_TAKE_FRAME'].park, 
                            hyperlapse=params.HYPERLAPSE)}

[delayed_gcode _WAIT_TIMELAPSE_TAKE_FRAME]
gcode:
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% set factor = {'speed': printer.gcode_move.speed_factor, 'extrude': printer.gcode_move.extrude_factor} %}
  {% if tl.takingframe %}
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_TAKE_FRAME DURATION={tl.check_time}
  {% else %}
    {tl.macro.resume} VELOCITY={tl.speed.travel} ; execute the klipper RESUME command
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=is_paused VALUE=False
    {% if not printer[printer.toolhead.extruder].can_extrude %}
        {action_respond_info("Timelapse: Warning minimum extruder temperature not reached!")}
    {% else %}
      {% if tl.extruder.fw_retract %}
        G11
      {% else %}
        G0 E{tl.extruder.extrude} F{tl.speed.extrude * 60}
        G0 F{tl.restore.speed}
        {% if tl.restore.absolute.extrude %} 
          M82
          G92 E{tl.restore.e}
        {% endif %}
      {% endif %}
    {% endif %}
    {% if tl.restore.factor.speed   != factor.speed   %} M220 S{(factor.speed*100)|round(0)}   {% endif %}
    {% if tl.restore.factor.extrude != factor.extrude %} M221 S{(factor.extrude*100)|round(0)} {% endif %}
    {% if not tl.restore.absolute.coordinates %} G91 {% endif %}
  {% endif %}

####################################################################################################
#                                                                                                  #
# HYPERLAPSE: Starts or stops a Hyperlapse video                                                   #
# Usage: HYPERLAPSE ACTION=START [CYCLE=time] starts a hyperlapse with cycle time (default 30 sec) #
#        HYPERLAPSE ACTION=STOP stops the hyperlapse recording                                     # 
#                                                                                                  #
####################################################################################################

######################### definition #########################
## cycle: cycle time in seconds
## run: internal use [True/False]
###############################################################
[gcode_macro HYPERLAPSE]
description: Start/Stop a hyperlapse recording
variable_cycle: 0
variable_run: False
gcode:
  {% set cycle = params.CYCLE|default(30)|int %}
  {% if params.ACTION and params.ACTION|lower == 'start' %}
    {action_respond_info("Hyperlapse: frames started (Cycle %d sec)" % cycle)}
    SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=run VALUE=True
    SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=cycle VALUE={cycle}
    UPDATE_DELAYED_GCODE ID=_HYPERLAPSE_LOOP DURATION={cycle}
    TIMELAPSE_TAKE_FRAME HYPERLAPSE=True
  {% elif params.ACTION and params.ACTION|lower == 'stop' %}
    {% if run %}{action_respond_info("Hyperlapse: frames stopped")}{% endif %}
    SET_GCODE_VARIABLE MACRO=HYPERLAPSE VARIABLE=run VALUE=False
    UPDATE_DELAYED_GCODE ID=_HYPERLAPSE_LOOP DURATION=0
  {% else %}
    {action_raise_error("Hyperlapse: No valid input parameter
                         Use: 
                         - HYPERLAPSE ACTION=START [CYCLE=time]
                         - HYPERLAPSE ACTION=STOP")}
  {% endif %}

[delayed_gcode _HYPERLAPSE_LOOP]
gcode:
  UPDATE_DELAYED_GCODE ID=_HYPERLAPSE_LOOP DURATION={printer["gcode_macro HYPERLAPSE"].cycle}
  TIMELAPSE_TAKE_FRAME HYPERLAPSE=True

##########################################################################
#                                                                        #
# TIMELAPSE_RENDER: Render the video at print end                        #
#                                                                        #
##########################################################################

######################### definition #########################
## render: internal use. Valid inputs: [True, False]
## run_identifier: internal use. Valid input [0 .. 3]
###############################################################
[gcode_macro TIMELAPSE_RENDER]
description: Render Timelapse video and wait for the result
variable_render: False
variable_run_identifier: 0
gcode:
  {action_respond_info("Timelapse: Rendering started")}
  {action_call_remote_method("timelapse_render", byrendermacro="True")}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_RENDER VARIABLE=render VALUE=True
  {printer.configfile.settings['gcode_macro pause'].rename_existing} ; execute the klipper PAUSE command
  UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_RENDER DURATION=0.5

[delayed_gcode _WAIT_TIMELAPSE_RENDER]
gcode:
  {% set ri = printer['gcode_macro TIMELAPSE_RENDER'].run_identifier % 4 %}
  SET_GCODE_VARIABLE MACRO=TIMELAPSE_RENDER VARIABLE=run_identifier VALUE={ri + 1}
  {% if printer['gcode_macro TIMELAPSE_RENDER'].render %}
    M117 Rendering {['-','\\','|','/'][ri]}
    UPDATE_DELAYED_GCODE ID=_WAIT_TIMELAPSE_RENDER DURATION=0.5
  {% else %}
    {action_respond_info("Timelapse: Rendering finished")}
    M117
    {printer.configfile.settings['gcode_macro resume'].rename_existing} ; execute the klipper RESUME command
  {% endif %}

##########################################################################
#                                                                        #
# TEST_STREAM_DELAY: Helper macro to find stream and park delay          #
#                                                                        #
##########################################################################

[gcode_macro TEST_STREAM_DELAY]
description: Helper macro to find stream and park delay
gcode:
  {% set min = printer.toolhead.axis_minimum %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set act = printer.toolhead.position %}
  {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
  {% if act.z > 5.0 %}
    G0 X{min.x + 5.0} F{tl.speed.travel|int * 60}
    G0 X{(max.x-min.x)/2}
    G4 P{tl.park.time|float * 1000}
    _TIMELAPSE_NEW_FRAME HYPERLAPSE=FALSE
    G0 X{max.x - 5.0}
  {% else %}
    {action_raise_error("Toolhead z %.3f to low. Please place head above z = 5.0" % act.z)}
  {% endif %}

# K2 Plus PTC chamber heater, as stock: heater PC12, its fan PB14 powered
# through PB2 with the tachometer on PC6 (stock fan_feedback fan0), and the
# chamber thermistor PC5, shared with [temperature_sensor
# chamber_temperature] so the screen shows what the heater controls on.
# [hark_chamber] adds stock's rules (only over 40C, bed first, soft start,
# fan and over-temperature cut-offs, max 60C). On since 11-01, after the
# supervised test on a real K2 Plus (docs/K2-PLUS-BETA.md step 9) heated as
# stock did; [hark_chamber] enable: False in printer-overrides.cfg turns it
# off.
[duplicate_pin_override]
pins: PC5

[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
min_temp: -30
max_temp: 80

# Stock's limits: a chamber warms slowly and the door may be open, so the
# heating-rate check is effectively off (hark_chamber switches the heater
# off on a dead fan or over-temperature instead). A reading over max_temp
# still shuts Klipper down.
[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1

# Runs whenever the chamber heater has a target (stock ran it at 30% while
# heating; full speed keeps the PTC element coolest)
[heater_fan ptc_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
heater_temp: 100
fan_speed: 1.0
tachometer_pin: PC6
tachometer_ppr: 2

[hark_chamber]
enable: True

# K2 Plus automatic belt tensioners (stock [belt_mdl mdlx]/[belt_mdl mdly]):
# a motorised slider with a strain gauge on each belt, answering on the
# motor bus at 0x21 (X) and 0x22 (Y). BELT_TENSION_STATUS reads them;
# BELT_TENSION CONFIRM=1 is stock's automatic tensioning (140 N, as
# Creality's BELT_TENSION macro). docs/K2-PLUS-BETA.md step 10.
[k2_belt_tension]
#target: 140
#tolerance: 0.15

# Z tilt at print start: "probe" taps both sides every print (about 30 s);
# "saved" puts back the last Z_TILT_ADJUST result without probing (as
# Creality's ADJUST_STEPPERS does), and probes when there is none saved.
# Re-run Z_TILT_ADJUST after moving the printer or working on the bed.
[gcode_macro _Z_TILT_START]
variable_mode: "probe"
gcode:
    {% set zt = printer.z_tilt %}
    {% if printer["gcode_macro _Z_TILT_START"].mode == "saved" and zt.saved %}
        Z_TILT_APPLY_SAVED
    {% else %}
        Z_TILT_ADJUST
    {% endif %}

# K2 Plus beta: visit the chute, brush, cutter and strip positions slowly
# (20 mm/s, 3 s at each) and say where the nozzle is. Nothing extrudes, wipes
# or cuts. Watch the toolhead; KZ / power off if anything is about to hit.
[gcode_macro CHUTE_POSITION_CHECK]
description: K2 Plus beta: slow tour of the chute, brush and cutter positions
gcode:
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("Home X and Y first (G28 X Y)") }
    {% endif %}
    {% set c = printer.configfile.settings.k2_cfs %}
    {% set f = 1200 %}
    {% set wait = params.WAIT|default(3000)|int %}
    G90
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < 10 %}
        G1 Z10 F600
    {% endif %}
    {% set stops = [
        ("safe park (purge_return_x, purge_safe_y)", c.purge_return_x, c.purge_safe_y),
        ("chute approach (purge_entry_x, purge_safe_y)", c.purge_entry_x, c.purge_safe_y),
        ("chute gate (purge_gate_x, purge_y)", c.purge_gate_x, c.purge_y),
        ("purge spot over the chute (purge_x, purge_y)", c.purge_x, c.purge_y),
        ("chute swing right (clean_right_x, clean_y)", c.clean_right_x, c.clean_y),
        ("brush left (clean_circle_left_x, clean_y)", c.clean_circle_left_x, c.clean_y),
        ("brush right (clean_circle_right_x, clean_y)", c.clean_circle_right_x, c.clean_y),
        ("back to the chute swing right (clean_right_x, clean_y)", c.clean_right_x, c.clean_y),
        ("back out (clean_right_x, purge_safe_y)", c.clean_right_x, c.purge_safe_y),
        ("rear cleaning strip probe point (stock 150,355)", 150, 355),
        ("rear cleaning strip scrub point (stock 185,355.5)", 185, 355.5),
        ("cutter approach (cutter_x, cutter_y)", c.cutter_x, c.cutter_y),
        ("bed centre", 175, 175)] %}
    {% for name, x, y in stops %}
        G1 X{x} Y{y} F{f}
        M400
        RESPOND MSG="Position check {loop.index}/{stops|length}: {name} = X{x} Y{y}"
        G4 P{wait}
    {% endfor %}
    RESPOND MSG="Position check done. Note any stop that was off or close to something."
