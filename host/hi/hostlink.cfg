# Creality Hi through the USB host-link (host/hi): included LAST in the host's
# printer.cfg so these lines replace the Hi's internal UART paths.
# Interfaces: if00 main MCU, if01 nozzle MCU; bed MCU and the motor bus share
# if02 and come out of demux.py as two pseudo-terminals.
# HOME below is filled in by host-setup.sh.

[mcu]
serial: /dev/serial/by-id/usb-Hark_Tech_Creality_Hi_hostlink_20080411-if00-port0

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-Hark_Tech_Creality_Hi_hostlink_20080411-if01-port0

[mcu bed_mcu]
serial: @HOME@/printer_data_hi/comms/hi-bed

[k2_motor_bus]
serial: @HOME@/printer_data_hi/comms/hi-bus

[virtual_sdcard]
path: @HOME@/printer_data_hi/gcodes

[pa_pressure_log]
output_dir: @HOME@/printer_data_hi/config/pa_logs

# Creality's pa_compute (HI_PA_CAL) is an ARM program on the Hi: run it there
# over SSH. host.sh setup makes the key; add its .pub to the Hi's
# /etc/dropbear/authorized_keys once.
[hi_pa_compute]
remote_host: root@192.168.3.96
ssh_key: @HOME@/.ssh/id_hi_hostlink

# CFS slot records and Creality's material list live on the host. Copy the
# Hi's /mnt/UDISK/creality/userdata/box folder to creality-box once (it holds
# material_database.json and the slots as stock last knew them).
[hark_cfs_slots]
store_path: @HOME@/printer_data_hi/config/hark_cfs_slots.json
creality_dir: @HOME@/printer_data_hi/creality-box
