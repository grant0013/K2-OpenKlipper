# Moonraker for the Creality Hi on the host PC (second instance, port 7126,
# so it can sit beside another printer's Moonraker on 7125).
# HOME below is filled in by host-setup.sh.

[server]
host: 0.0.0.0
port: 7126
klippy_uds_address: @HOME@/printer_data_hi/comms/klippy.sock

[authorization]
trusted_clients:
    192.168.0.0/16
    10.0.0.0/8
    127.0.0.0/8
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*

[file_manager]
enable_object_processing: True

[history]
