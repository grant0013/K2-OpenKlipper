# printer-overrides.cfg for a K2 run from a host PC (docs/EXTERNAL-HOST.md).
#
# Copy this file to ~/printer_data_k2/config/printer-overrides.cfg and replace
# USER. It sits next to k2-openklipper.cfg (a copy of the release's
# config/mainline_stage2.cfg) and is loaded after it, so anything here wins:
#
#   printer.cfg:
#     [include k2-openklipper.cfg]
#     [include printer-overrides.cfg]
#
# The host part below is what makes the release config work on a PC; your
# printer's own settings go underneath. Updating the host replaces
# k2-openklipper.cfg and never touches this file.

# --- Host PC
[mcu]
# K2 ttyS2 via the USB relay, gadget interface 00 (the K2 boot script links
# gser.0/1/2 in order; link order = interface number).
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Tina_ADB_20080411-if00-port0

[mcu nozzle_mcu]
# K2 ttyS3, interface 01
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Tina_ADB_20080411-if01-port0

[k2_motor_bus]
# K2 ttyS5 (X/Y/E motor controllers + CFS RS485), interface 02.
# Nothing else may ever open interface 02.
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Tina_ADB_20080411-if02-port0

[virtual_sdcard]
path: /home/USER/printer_data_k2/gcodes

[hark_cfs_slots]
store_path: /home/USER/printer_data_k2/config/hark_cfs_slots.json
# A copy of the K2's CFS material database (creality/userdata/box)
creality_dir: /home/USER/printer_data_k2/creality-box

[pa_pressure_log]
output_dir: /home/USER/printer_data_k2/config/pa_logs

# The update button runs the installer on the K2 itself, not on this PC, so
# no automatic checks or update offers here. OKL_UPDATE_CHECK still reports
# new releases; update the host as in docs/EXTERNAL-HOST.md.
[hark_update]
check_interval: 0
notify: False

# The optional bed accelerometer ([mcu bed_accel] / [lis2dw bed]) must plug
# into the host PC, not the K2.

# --- This printer (examples; keep only what you change)

# A PC has the CPU for finer arcs than the K2 board (0.5 mm). If an
# arc-heavy job shows "Timer too close", go back to 0.5.
#[gcode_arcs]
#resolution: 0.2

# Phaetus DXC2 extruder instead of the stock one (docs/INSTALL.md)
#[k2_cfs]
#cutter_cut_x: -8.0
#unload_pull_length: 20

# First-layer correction (bigger = nozzle lower)
#[gcode_macro START_PRINT]
#variable_hot_z_comp: 0.04
